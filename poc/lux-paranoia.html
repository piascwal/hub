<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lux &amp; Paranoia</title>
<meta name="description" content="Aventure procédurale dans le noir : un petit peureux n'a qu'un caillou, et escorte des âmes jusqu'au portail sans croiser les regards rouges.">
<meta name="theme-color" content="#08080e">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    background: #08080e;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #e8e8f0;
    -webkit-user-select: none;
    user-select: none;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---- interface ---- */

  .hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: max(0.7rem, env(safe-area-inset-top)) 0.8rem 0.7rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    pointer-events: none;
    z-index: 10;
  }

  .hud > * { pointer-events: auto; }

  .back {
    color: rgba(232, 232, 240, 0.55);
    text-decoration: none;
    font-size: 0.95rem;
    padding: 0.35rem 0.55rem;
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.05);
  }

  .zone {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: rgba(232, 232, 240, 0.4);
    font-variant-numeric: tabular-nums;
  }

  .btn {
    font: inherit;
    font-size: 0.85rem;
    color: #e8e8f0;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    padding: 0.4rem 0.85rem;
    cursor: pointer;
  }

  .btn:active { background: rgba(255, 255, 255, 0.14); }

  .jauge {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .forme {
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    transition: color 0.4s ease;
  }

  .barre {
    width: 80px;
    height: 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.09);
    overflow: hidden;
  }

  .barre i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 999px;
    transition: width 0.18s linear, background 0.4s ease;
  }

  /* bonus temporaire en cours */
  .bonus {
    position: fixed;
    left: 50%;
    top: 3.6rem;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 0.45rem;
    padding: 0.3rem 0.75rem;
    border-radius: 999px;
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    z-index: 11;
    pointer-events: none;
  }

  .bonus.on { display: flex; }

  .bonus b { font-weight: 600; }

  .bonus s {
    display: block;
    height: 3px;
    width: 46px;
    border-radius: 999px;
    background: currentColor;
    opacity: 0.55;
  }

  /* le bouton d'action : il n'y en a qu'un, et il ne change jamais */
  .actions {
    position: fixed;
    right: max(0.9rem, env(safe-area-inset-right));
    bottom: max(1.4rem, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column-reverse;
    gap: 0.6rem;
    z-index: 12;
  }

  .rond {
    position: relative;
    overflow: hidden;
    touch-action: manipulation;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 2px solid;
    background: rgba(255, 255, 255, 0.06);
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    display: none;
    cursor: pointer;
    font-family: inherit;
    line-height: 1.25;
  }

  .rond.on { display: block; }
  .rond:disabled { opacity: 0.34; }
  /* anneau de recharge : sans lui, un bouton indisponible ressemble à un bouton
     cassé — c'est la même sensation que « ça ne marche pas » */
  .rond::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    background: conic-gradient(currentColor calc(var(--recharge, 1) * 360deg), transparent 0);
    opacity: 0.18;
    pointer-events: none;
  }

  /* `manipulation` laisse le navigateur revendiquer un glissement comme un
     défilement : il envoyait un pointercancel dès le premier mouvement, et la
     visée mourait avant qu'on ait pu orienter quoi que ce soit. Ce bouton-ci
     se garde le geste entier. */
  #caillou { border-color: rgba(178, 186, 204, 0.55); color: #b2bacc; touch-action: none; }

  .rond:active:not(:disabled) { background: rgba(255, 255, 255, 0.16); }

  .hint {
    position: fixed;
    left: 0; right: 0;
    bottom: max(1.1rem, env(safe-area-inset-bottom));
    padding: 0 6.5rem 0 1.2rem;
    text-align: center;
    font-size: 0.85rem;
    line-height: 1.45;
    color: rgba(232, 232, 240, 0.5);
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.5s ease;
  }

  /* bandeau passager : il informe sans arrêter le jeu */
  .toast {
    position: fixed;
    left: 50%;
    top: 22%;
    transform: translateX(-50%);
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    background: rgba(255, 122, 107, 0.16);
    border: 1px solid rgba(255, 122, 107, 0.4);
    color: #ffb4a8;
    font-size: 0.85rem;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 14;
  }

  .toast.on { opacity: 1; }

  /* bandeau d'évolution et de passage de zone */
  .flash {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    text-align: center;
    padding: 2rem;
    background: rgba(8, 8, 14, 0.74);
    backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .flash.on { opacity: 1; pointer-events: auto; }
  .flash strong { font-size: 1.7rem; letter-spacing: 0.02em; }
  .flash em { font-style: normal; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.55; }
  .flash p { font-size: 0.92rem; color: rgba(232, 232, 240, 0.62); max-width: 22rem; line-height: 1.5; }
</style>
</head>
<body>

<canvas id="jeu"></canvas>

<div class="hud">
  <a class="back" href="../index.html" aria-label="Retour au hub">←</a>
  <span class="zone" id="zone">ZONE 1</span>
  <span class="jauge">
    <span class="forme" id="forme">Peureux</span>
    <span class="barre"><i id="barre"></i></span>
  </span>
</div>

<div class="bonus" id="bonus"><b id="bonus-nom"></b><s id="bonus-jauge"></s></div>

<div class="actions">
  <button type="button" class="rond on" id="caillou">CAILLOU<br><span id="caillou-n">1</span></button>
</div>

<p class="hint" id="hint">
  Pose le doigt n'importe où : un joystick apparaît sous lui.<br>
  Glisse depuis CAILLOU pour viser, lâche pour lancer.<br>
  Éclaire les bleus pour les calmer, amène-les au portail.
</p>

<div class="toast" id="toast"></div>

<div class="flash" id="flash">
  <em id="flash-sur"></em>
  <strong id="flash-titre"></strong>
  <p id="flash-texte"></p>
  <button type="button" class="btn" id="flash-ok">Continuer</button>
</div>

<script>
(() => {
  'use strict';

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function grainDepuisTexte(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  function ecartAngle(a, b) {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }

  function melange(hex, vers, t) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255]
      .map((v) => Math.round(v + (vers - v) * t));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }
  const eclaircir = (hex, t) => melange(hex, 255, t);
  const assombrir = (hex, t) => melange(hex, 0, t);
  const rgba = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  };

  /* ==================================================== formes =========== */

  // Une forme = une couleur, un halo, et EXACTEMENT UN verbe de plus. C'est la
  // règle : on ne découvre jamais deux mécaniques à la fois, sinon on n'en
  // comprend aucune.
  // Les seuils tiennent dans UNE zone, puisqu'on repart peureux à chaque fois.
  // Ils sont calés sur le PLAFOND réellement mesuré d'une zone — tout ramasser,
  // tout calmer, tout livrer : 108 en zone 1, 122 en zone 3, 177 en zone 6.
  // On montait quatre formes en une poignée de secondes ; chaque palier demande
  // maintenant un vrai bout de zone (25 %, 50 %, 80 % du plafond de la zone 1).
  // Solaire est au-delà du plafond des deux premières zones : c'est une
  // récompense de fin d'aventure, pas un passage obligé. Premier calage tenté à
  // 30/70/120/180 : Ardent passait au-dessus du plafond de la zone 1 et Solaire
  // au-dessus de celui de la zone 6 — deux formes purement décoratives.
  const FORMES = [
    { nom: 'Peureux', couleur: '#8fd0ff', seuil: 0, halo: 1.00, portee: 0, cone: 0,
      verbe: 'Le caillou',
      texte: "Tu n'as qu'un halo minuscule — mais tu peux lancer un caillou devant toi. Là où il tombe, les sentinelles vont voir. C'est toute ton arme : les détourner." },
    { nom: 'Curieux', couleur: '#ffd479', seuil: 26, halo: 1.28, portee: 5.2, cone: 0.34,
      verbe: 'Le faisceau',
      texte: "Un faisceau s'ouvre devant toi. Il porte loin, et il réveille les autres : un bonhomme éclairé relaie ta lumière avec son regard." },
    { nom: 'Veilleur', couleur: '#a8f0c8', seuil: 55, halo: 1.45, portee: 6.0, cone: 0.32,
      verbe: 'Le caillou couve',
      texte: "Ton caillou ne retombe plus éteint : là où il tombe, il se met à brûler pour toujours. Les rouges ne supportent pas cette lumière — tu poses tes abris à distance." },
    { nom: 'Ardent', couleur: '#ff9a6b', seuil: 88, halo: 1.62, portee: 7.0, cone: 0.30,
      verbe: 'Le caillou frappe',
      texte: "Vise un rouge, touche-le : il est étourdi et perd ta trace. Ce n'est plus seulement un leurre, c'est de quoi ouvrir un passage à ton convoi." },
    { nom: 'Solaire', couleur: '#fff2c4', seuil: 128, halo: 1.9, portee: 8.2, cone: 0.30,
      verbe: 'Le caillou éclate',
      texte: "À l'impact, le caillou se brise en un éclat qui aveugle tous les rouges autour du point de chute. Un seul lancer, et toute une salle cesse de te chercher." },
  ];

  // Tout le jeu tient sur UN bouton. Chaque forme ne donne pas un nouveau verbe
  // à apprendre : elle enrichit le seul geste qu'on connaît déjà. La réserve
  // grossit et le délai fond à chaque palier — c'est la progression qu'on sent
  // en jouant, avant même de lire ce que le caillou fait de plus.
  const CAILLOU = [
    { reserve: 1, delai: 2.6 },
    { reserve: 2, delai: 1.9 },
    { reserve: 2, delai: 1.5, couve: true },
    { reserve: 3, delai: 1.2, couve: true, frappe: true },
    { reserve: 3, delai: 0.9, couve: true, frappe: true, eclate: true },
  ];
  const rangCaillou = () => CAILLOU[joueur.niveau];

  const EMOTIONS = { PEUR: 'peur', COLERE: 'colere', CURIEUX: 'curieux' };

  // Un visage ne dit pas QUI on est, il dit CE QUI SE PASSE. Trois humeurs, la
  // même règle pour le joueur et pour les âmes qu'il escorte : on court, on
  // marche, ou quelque chose nous a repérés. Avant, le peureux portait des
  // sourcils d'intrigué en permanence et on ne lisait plus rien sur lui.
  // INQUIET est la peur au repos : mêmes sourcils relevés, mêmes grands yeux,
  // mais la bouche reste sage. La bouche ouverte qui tremble est réservée au
  // vrai danger — sans cette nuance, un peureux tranquille hurlait en
  // permanence et on ne voyait plus arriver le moment qui compte.
  const HUMEURS = { PEUR: 'peur', INQUIET: 'inquiet', INTRIGUE: 'intrigue',
                    ACHARNE: 'acharne', VISEE: 'visee' };
  // moitié de la vitesse de pointe du joueur : au-delà, on court vraiment
  const SEUIL_COURSE = 150;
  // `calme` distingue le repos serein du repos inquiet : une âme qu'on n'a pas
  // encore apprivoisée reste sur ses gardes.
  const humeurSelon = (p, menace, calme) => menace ? HUMEURS.PEUR
    : Math.hypot(p.vx, p.vy) > SEUIL_COURSE ? HUMEURS.ACHARNE
    : calme ? HUMEURS.INTRIGUE : HUMEURS.INQUIET;
  // Le joueur a peur des mêmes choses que ses âmes, plus une : sentir sa propre
  // lumière se faire manger. Et viser au caillou passe avant tout le reste :
  // c'est un geste volontaire, il mérite son visage à lui.
  const humeurDuJoueur = () => visee.actif ? HUMEURS.VISEE
    : humeurSelon(joueur, menace || joueur.vu > 0.15 || joueur.souffle < 0.45,
                  joueur.niveau > 0);
  const COULEURS = {
    [EMOTIONS.PEUR]: '#8fd0ff',
    [EMOTIONS.COLERE]: '#ff7a6b',
    [EMOTIONS.CURIEUX]: '#ffd479',
  };

  // Les lueurs à effet. Chacune n'apparaît qu'à partir d'une forme donnée :
  // on n'introduit jamais un bonus avant que le joueur ait digéré le précédent.
  // Chaque bonus porte sa propre phrase : un nom seul ne dit rien. Et chacun se
  // VOIT sur le personnage — couleur du corps, du halo, particules — parce que
  // le mot dans la barre du haut n'est pas là où le joueur regarde.
  const BONUS = {
    eclat:   { couleur: '#ffe9a8', forme: 0, duree: 0,  nom: 'Lueur',
               phrase: '' },
    galet:   { couleur: '#b2bacc', forme: 0, duree: 0,  nom: 'Galet',
               phrase: 'Poche pleine — tous tes cailloux sont revenus' },
    souffle: { couleur: '#8fd0ff', forme: 1, duree: 7,  nom: 'Voilé',
               phrase: 'Voilé — les sentinelles ne te voient plus' },
    hate:    { couleur: '#a8f0c8', forme: 2, duree: 8,  nom: 'Hâte',
               phrase: 'Hâte — tu files bien plus vite' },
  };

  /* ==================================================== le monde ========= */

  // Côté d'une case, en pixels monde. Le baisser revient à filmer de plus haut :
  // tout le jeu est exprimé en CASE, donc les proportions et les distances de
  // détection ne bougent pas d'un pouce — seul le cadrage s'élargit.
  const CASE = 62;                 // côté d'une case de la grille, en pixels monde

  // Portée du regard d'une sentinelle. Ramenée de 4.6 à 3.6 cases : elle
  // accrochait de trop loin. Mais l'essentiel est ailleurs — c'est la VITESSE
  // de verrouillage qui décroît avec la distance (voir majRegles), comme dans
  // un Metal Gear : au bord du cône elle te soupçonne, elle ne te tient pas.
  const PORTEE_VUE = CASE * 3.6;

  // Une zone est un plan de salles reliées par des couloirs. C'est volontairement
  // une grille : la seule chose à garantir ici, c'est « peut-on aller d'ici à
  // là », et sur une grille un parcours en largeur y répond exactement.
  function construireZone(rnd, numero) {
    const cols = 15 + Math.min(6, numero);
    const lignes = 20 + Math.min(8, numero * 2);
    const mur = [];
    for (let y = 0; y < lignes; y++) mur.push(new Array(cols).fill(1));

    const salles = [];
    const vise = 6 + Math.min(5, Math.floor(numero * 0.8));
    for (let essai = 0; essai < 220 && salles.length < vise; essai++) {
      const w = 3 + Math.floor(rnd() * 4);
      const h = 3 + Math.floor(rnd() * 4);
      const x = 1 + Math.floor(rnd() * (cols - w - 2));
      const y = 1 + Math.floor(rnd() * (lignes - h - 2));
      const chevauche = salles.some((s) =>
        x < s.x + s.w + 1 && x + w + 1 > s.x && y < s.y + s.h + 1 && y + h + 1 > s.y);
      if (chevauche) continue;
      salles.push({ x, y, w, h, cx: x + (w >> 1), cy: y + (h >> 1) });
    }
    if (salles.length < 3) return null;

    for (const s of salles) {
      for (let y = s.y; y < s.y + s.h; y++)
        for (let x = s.x; x < s.x + s.w; x++) mur[y][x] = 0;
    }

    const couloir = (a, b) => {
      let x = a.cx, y = a.cy;
      while (x !== b.cx) { mur[y][x] = 0; x += x < b.cx ? 1 : -1; }
      while (y !== b.cy) { mur[y][x] = 0; y += y < b.cy ? 1 : -1; }
      mur[y][x] = 0;
    };
    for (let i = 1; i < salles.length; i++) couloir(salles[i - 1], salles[i]);
    // deux raccourcis : sans ça le plan est un couloir unique et se parcourt bêtement
    for (let i = 0; i < 2; i++) {
      const a = salles[Math.floor(rnd() * salles.length)];
      const b = salles[Math.floor(rnd() * salles.length)];
      if (a !== b) couloir(a, b);
    }

    return { mur, cols, lignes, salles };
  }

  // Parcours en largeur sur les cases libres. Exact, et c'est tout l'intérêt :
  // ce que la génération promet, on le vérifie vraiment.
  function distances(z, depart) {
    const { mur, cols, lignes } = z;
    const d = [];
    for (let y = 0; y < lignes; y++) d.push(new Array(cols).fill(-1));
    if (mur[depart.cy][depart.cx]) return d;
    d[depart.cy][depart.cx] = 0;
    const file = [depart.cx, depart.cy];
    for (let i = 0; i < file.length; i += 2) {
      const x = file[i], y = file[i + 1];
      for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
        if (nx < 0 || ny < 0 || nx >= cols || ny >= lignes) continue;
        if (mur[ny][nx] || d[ny][nx] !== -1) continue;
        d[ny][nx] = d[y][x] + 1;
        file.push(nx, ny);
      }
    }
    return d;
  }

  function genererZone(grainTexte, numero, formeJoueur) {
    const base = grainDepuisTexte(grainTexte);
    // types de lueurs disponibles à ce stade de la progression
    const types = Object.keys(BONUS).filter((k) => BONUS[k].forme <= formeJoueur);

    for (let variante = 0; variante < 30; variante++) {
      const rnd = mulberry32(base + variante * 7919 + numero * 104729);
      const z = construireZone(rnd, numero);
      if (!z) continue;

      const depart = z.salles[0];
      const d = distances(z, depart);

      let sortie = null, loin = -1;
      for (const s of z.salles) {
        if (d[s.cy][s.cx] > loin) { loin = d[s.cy][s.cx]; sortie = s; }
      }
      if (!sortie || loin < 12) continue;

      const lueurs = [];
      for (const s of z.salles) {
        if (s === depart) continue;
        const combien = 2 + Math.floor(rnd() * 3);
        for (let i = 0; i < combien; i++) {
          const cx = s.x + Math.floor(rnd() * s.w);
          const cy = s.y + Math.floor(rnd() * s.h);
          if (d[cy][cx] < 0) continue;
          // une lueur sur cinq est spéciale, tirée parmi ce qui est débloqué
          const special = types.length > 1 && rnd() < 0.22;
          const type = special ? types[1 + Math.floor(rnd() * (types.length - 1))] : 'eclat';
          lueurs.push({ x: (cx + 0.5) * CASE, y: (cy + 0.5) * CASE, type, prise: false, vue: false, phase: rnd() * TAU });
        }
      }
      if (lueurs.length < 14) continue;

      const persos = [];
      const palette = numero === 1
        ? [EMOTIONS.PEUR, EMOTIONS.CURIEUX, EMOTIONS.COLERE]
        : [EMOTIONS.PEUR, EMOTIONS.CURIEUX, EMOTIONS.COLERE, EMOTIONS.COLERE];
      for (const s of z.salles) {
        if (s === depart) continue;
        const combien = 1 + Math.floor(rnd() * 2);
        for (let i = 0; i < combien; i++) {
          const cx = s.x + Math.floor(rnd() * s.w);
          const cy = s.y + Math.floor(rnd() * s.h);
          if (d[cy][cx] < 0) continue;
          const x = (cx + 0.5) * CASE, y = (cy + 0.5) * CASE;
          const regard = rnd() * TAU;
          persos.push({
            x, y, baseX: x, baseY: y, vx: 0, vy: 0,
            sx: 1, sy: 1, vsx: 0, vsy: 0,
            regard, regardRepos: regard,
            balayage: (rnd() < 0.5 ? 1 : -1) * (0.35 + rnd() * 0.5),
            amplitude: 0.5 + rnd() * 0.9,
            phase: rnd() * TAU,
            emotion: palette[Math.floor(rnd() * palette.length)],
            eclaire: false, calme: false, suit: false, livre: false, rang: 0,
            aveugle: 0, compteCalme: 0,
            tremble: rnd() * TAU, humeur: HUMEURS.INTRIGUE, fuit: 0,
            alerte: 0, etape: 0, charge: 0, route: null, immobile: 0, bouscule: 0,
            curiosite: null, curieuxT: 0,
            // Les sentinelles clignent des yeux : quelques dixièmes de seconde
            // où elles ne voient rien. C'est ce qui rend l'observation des yeux
            // dans le noir réellement utile, et donne une fenêtre pour passer.
            cligne: 0, prochainCligne: 1.5 + rnd() * 3.5,
            // points de passage de la ronde, pris dans les cases libres autour
            // Points de ronde. Ils doivent être NETTEMENT écartés du poste et
            // les uns des autres : tirés sans distance minimale, ils pouvaient
            // tomber tous les trois dans la case de la sentinelle. Elle
            // « arrivait » alors à chaque frame, passait au point suivant, et
            // ne bougeait jamais — une sentinelle sur 29 restait ainsi plantée.
            ronde: (() => {
              const pts = [];
              const loinDeTout = (ox, oy) => {
                if (Math.hypot(ox - cx, oy - cy) < 1.8) return false;
                return pts.every((q) => Math.hypot(ox - q.cx, oy - q.cy) >= 1.8);
              };
              for (let k = 0; k < 40 && pts.length < 3; k++) {
                const ox = cx + Math.floor(rnd() * 11) - 5;
                const oy = cy + Math.floor(rnd() * 11) - 5;
                if (ox < 0 || oy < 0 || ox >= z.cols || oy >= z.lignes) continue;
                if (z.mur[oy][ox] || d[oy][ox] < 0) continue;
                if (!loinDeTout(ox, oy)) continue;
                pts.push({ cx: ox, cy: oy, x: (ox + 0.5) * CASE, y: (oy + 0.5) * CASE });
              }
              // moins de deux points utilisables : elle tient son poste et
              // balaye, ce qui est un garde statique parfaitement lisible
              return pts.length >= 2 ? pts : [];
            })(),
          });
        }
      }

      const joignable = (p) => {
        const cx = Math.floor(p.x / CASE), cy = Math.floor(p.y / CASE);
        return d[cy] && d[cy][cx] >= 0;
      };
      if (!lueurs.every(joignable)) continue;

      // PORTES. On ne les met que dans les couloirs, à la bouche d'une salle :
      // une case libre hors salle, avec exactement deux voisines libres et
      // opposées (donc un vrai couloir, pas un carrefour), dont l'une est dans
      // la salle. Fermée, elle coupe le regard d'une sentinelle qui balaye le
      // couloir — c'est là tout son intérêt : un abri qui existe sans lumière.
      const dansUneSalle = (cx, cy) => z.salles.some((s) =>
        cx >= s.x && cx < s.x + s.w && cy >= s.y && cy < s.y + s.h);
      const libreEn = (cx, cy) =>
        cx >= 0 && cy >= 0 && cx < z.cols && cy < z.lignes && !z.mur[cy][cx];
      const portes = [];
      const candidates = [];
      for (let cy = 1; cy < z.lignes - 1; cy++) {
        for (let cx = 1; cx < z.cols - 1; cx++) {
          if (z.mur[cy][cx] || d[cy][cx] < 0 || dansUneSalle(cx, cy)) continue;
          const h = [libreEn(cx - 1, cy), libreEn(cx + 1, cy)];
          const v = [libreEn(cx, cy - 1), libreEn(cx, cy + 1)];
          const nb = h.filter(Boolean).length + v.filter(Boolean).length;
          if (nb !== 2) continue;                       // carrefour ou cul-de-sac
          const couloirH = h[0] && h[1], couloirV = v[0] && v[1];
          if (!couloirH && !couloirV) continue;         // coude : le battant n'a pas d'axe
          const touche = couloirH
            ? dansUneSalle(cx - 1, cy) || dansUneSalle(cx + 1, cy)
            : dansUneSalle(cx, cy - 1) || dansUneSalle(cx, cy + 1);
          if (!touche) continue;                        // pas à la bouche d'une salle
          candidates.push({ cx, cy, couloirH });
        }
      }
      // Écartées les unes des autres, et jamais sur le seuil ni sur le portail :
      // une porte collée au départ enferme, une porte sur la sortie bloque la fin.
      const interdit = (cx, cy) =>
        (Math.abs(cx - depart.cx) <= 1 && Math.abs(cy - depart.cy) <= 1)
        || (Math.abs(cx - sortie.cx) <= 1 && Math.abs(cy - sortie.cy) <= 1);
      for (let k = candidates.length - 1; k > 0; k--) {   // mélange déterministe
        const j = Math.floor(rnd() * (k + 1));
        [candidates[k], candidates[j]] = [candidates[j], candidates[k]];
      }
      const maxPortes = 3 + Math.min(5, numero);
      for (const c of candidates) {
        if (portes.length >= maxPortes) break;
        if (interdit(c.cx, c.cy)) continue;
        if (portes.some((q) => Math.abs(q.cx - c.cx) + Math.abs(q.cy - c.cy) < 3)) continue;
        portes.push({
          cx: c.cx, cy: c.cy,
          x: (c.cx + 0.5) * CASE, y: (c.cy + 0.5) * CASE,
          // le couloir est horizontal -> le battant barre verticalement
          verticale: c.couloirH,
          ouverte: 0, phase: rnd() * TAU,
        });
      }

      // Torches fixées aux murs : gratuites mais temporaires, contrairement aux
      // braises qu'on porte. En passant devant, on les allume pour un moment.
      const torches = [];
      for (const sl of z.salles) {
        for (let essai = 0; essai < 14 && torches.length < 3 + numero; essai++) {
          const cx = sl.x + Math.floor(rnd() * sl.w);
          const cy = sl.y + Math.floor(rnd() * sl.h);
          if (z.mur[cy][cx] || d[cy][cx] < 0) continue;
          // il faut un mur juste à côté : une torche se fixe à une paroi
          const cotes = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([ox, oy]) => {
            const nx = cx + ox, ny = cy + oy;
            return nx < 0 || ny < 0 || nx >= z.cols || ny >= z.lignes || z.mur[ny][nx];
          });
          if (!cotes.length) continue;
          const [ox, oy] = cotes[Math.floor(rnd() * cotes.length)];
          torches.push({
            x: (cx + 0.5 + ox * 0.36) * CASE,
            y: (cy + 0.5 + oy * 0.36) * CASE,
            r: CASE * 2.1, duree: 26, reste: 0, phase: rnd() * TAU,
          });
          break;
        }
      }

      // table de consultation : `solide` est appelé des milliers de fois par
      // image, il ne peut pas parcourir une liste à chaque fois
      const porteDe = [];
      for (let y = 0; y < z.lignes; y++) porteDe.push(new Array(z.cols).fill(null));
      for (const pt of portes) porteDe[pt.cy][pt.cx] = pt;

      return {
        ...z, numero, grain: grainTexte, lueurs, persos, torches, portes, porteDe,
        braises: [],
        depart: { x: (depart.cx + 0.5) * CASE, y: (depart.cy + 0.5) * CASE },
        // Le portail ne compte plus des lueurs mais des ÂMES : il faut lui
        // amener des bonhommes calmés. Les lueurs redeviennent ce qu'elles
        // auraient toujours dû être — du carburant, pas un objectif.
        sortie: { x: (sortie.cx + 0.5) * CASE, y: (sortie.cy + 0.5) * CASE, r: CASE * 0.55,
                  vue: false, ames: 0 },
        // Il faut en ramasser nettement plus qu'avant : c'est ce qui laisse le
        // temps de remonter les formes depuis peureux. Deux lueurs de marge pour
        // ne jamais forcer à toutes les prendre.
        // nombre d'âmes à livrer : il en faut toujours au moins deux de reste
        // pour ne jamais coincer le joueur si un PNJ panique
        requis: Math.max(2, Math.min(persos.filter((q) => q.emotion !== EMOTIONS.COLERE).length - 2,
                                     2 + Math.floor(numero / 2))),
        largeur: z.cols * CASE, hauteur: z.lignes * CASE, longueur: loin,
      };
    }
    return null;
  }

  /* ==================================================== état ============= */

  const canvas = document.getElementById('jeu');
  const ctx = canvas.getContext('2d');

  // Le calque d'obscurité n'est que du dégradé : demi-résolution, invisible à
  // l'œil et quatre fois moins cher à rastériser.
  const QLUM = 0.5;
  const lum = document.createElement('canvas');
  const lctx = lum.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  const PALIERS = [2, 1.5, 1];
  let palier = 0, fenetre = [];

  let zone = null;
  const cam = { x: 0, y: 0 };
  let particules = [];
  let ondes = [];                  // ondes de choc de la charge et de l'éclat
  let cailloux = [];               // les cailloux en vol
  let fil = [];                    // la trace du joueur : sa seule mémoire du terrain
  let menace = false;              // un rouge cherche, ou un faisceau nous tient

  const joueur = {
    x: 0, y: 0, vx: 0, vy: 0,
    sx: 1, sy: 1, vsx: 0, vsy: 0,
    regard: -Math.PI / 2,
    eclat: 0, sommet: 0, niveau: 0,
    souffle: 1, repit: 0, vu: 0,
    tremble: 0,                    // sans lui, sin(temps + undefined) = NaN et
                                   // la bouche du joueur ne se dessinait pas
    galets: 1,                     // cailloux en poche
    caillouDispo: 1,               // fraction de recharge du prochain galet
    bonus: null, bonusT: 0,
  };

  // Joystick flottant : il naît sous le doigt, où qu'on le pose.
  const manche = { actif: false, ox: 0, oy: 0, dx: 0, dy: 0, force: 0, id: null };
  const RAYON_MANCHE = 56;

  let numeroZone = 1;
  let grain = 'LUX-1042';
  let priseCount = 0;

  const el = (id) => document.getElementById(id);
  const elZone = el('zone'), elForme = el('forme'), elBarre = el('barre');
  const elHint = el('hint'), elToast = el('toast'), elFlash = el('flash');
  const elCaillou = el('caillou'), elCaillouN = el('caillou-n');
  const elBonus = el('bonus'), elBonusNom = el('bonus-nom'), elBonusJauge = el('bonus-jauge');

  const forme = () => FORMES[joueur.niveau];
  const aBonus = (k) => joueur.bonus === k && joueur.bonusT > 0;

  function dims() {
    // la taille d'un bonhomme suit la case, sinon reculer la caméra ne
    // l'aurait pas rapetissé et il aurait paru énorme à l'écran
    const t = CASE * 0.5;
    // Le halo se mesure en CASES, pas en pixels d'écran : à 0.17 du petit côté
    // il valait 66 px pour des cases de 74, donc on ne voyait même pas les murs
    // de son propre couloir. Il faut au minimum une case et demie pour que
    // l'obscurité soit une contrainte et pas un aveuglement.
    return { taille: t, halo: CASE * 1.5, portee: CASE, cone: 0.20 };
  }
  let D = dims();

  // Le halo EST la jauge de santé : se faire fixer le fait rétrécir, se cacher
  // le fait revenir. Ça dit la règle sans un mot, et évite une deuxième barre.
  // Le plancher est haut (0.68) : à jauge presque pleine on doit encore y voir
  // assez pour s'enfuir. Mesuré à 0.5, le halo tombait sous une case pile au
  // moment où il fallait courir.
  const rayonHalo = () => D.halo * forme().halo * (0.68 + joueur.souffle * 0.32);
  const porteeFaisceau = () => forme().portee * CASE;
  const coneFaisceau = () => forme().cone;

  /* ==================================================== collisions ======= */

  // Une porte fermée est un mur : collision, ligne de vue, propagation de la
  // lumière et découpe des cônes passent TOUTES par ici, donc il suffit de le
  // dire une fois. Le parcours en largeur, lui, ne lit que `mur` — une porte
  // s'ouvre, donc elle ne rend jamais rien inatteignable.
  const solide = (cx, cy) => {
    if (cx < 0 || cy < 0 || cx >= zone.cols || cy >= zone.lignes) return true;
    if (zone.mur[cy][cx] === 1) return true;
    const pt = zone.porteDe[cy] && zone.porteDe[cy][cx];
    return !!pt && pt.ouverte < 0.5;
  };

  function degager(p, demi) {
    const c0x = Math.floor((p.x - demi) / CASE), c1x = Math.floor((p.x + demi) / CASE);
    const c0y = Math.floor((p.y - demi) / CASE), c1y = Math.floor((p.y + demi) / CASE);
    for (let cy = c0y; cy <= c1y; cy++) {
      for (let cx = c0x; cx <= c1x; cx++) {
        if (!solide(cx, cy)) continue;
        const mx = cx * CASE, my = cy * CASE;
        const gauche = (mx - demi) - p.x, droite = (mx + CASE + demi) - p.x;
        const haut = (my - demi) - p.y, bas = (my + CASE + demi) - p.y;
        const dx = Math.abs(gauche) < Math.abs(droite) ? gauche : droite;
        const dy = Math.abs(haut) < Math.abs(bas) ? haut : bas;
        if (Math.abs(dx) < Math.abs(dy)) { p.x += dx; p.vx = 0; }
        else { p.y += dy; p.vy = 0; }
      }
    }
  }

  /* ==================================================== vision =========== */

  function vueLibre(x1, y1, x2, y2) {
    const d = Math.hypot(x2 - x1, y2 - y1);
    const pas = Math.max(1, Math.ceil(d / (CASE * 0.45)));
    for (let i = 1; i < pas; i++) {
      const t = i / pas;
      if (solide(Math.floor((x1 + (x2 - x1) * t) / CASE), Math.floor((y1 + (y2 - y1) * t) / CASE))) return false;
    }
    return true;
  }

  const dansLeCone = (sx, sy, angle, tx, ty, portee, demi) => {
    const d = Math.hypot(tx - sx, ty - sy);
    if (d > portee || d < 1) return false;
    const a = Math.atan2(ty - sy, tx - sx);
    return Math.abs(ecartAngle(angle, a)) <= demi + Math.min(0.45, 30 / Math.max(d, 1));
  };

  // Relais : ton faisceau réveille un bonhomme, qui éclaire à son tour dans la
  // direction de son regard. Ça ne décide de rien — ça sert à voir plus loin.
  function propager() {
    const eclaires = new Set();
    // un calmé brille tout seul, faisceau ou pas
    for (const p of zone.persos) if (p.calme && !p.livre) eclaires.add(p);
    const portee = porteeFaisceau();
    if (!portee) return eclaires;
    const cone = coneFaisceau();

    for (const p of zone.persos) {
      if (p.emotion === EMOTIONS.COLERE) continue;
      if (!dansLeCone(joueur.x, joueur.y, joueur.regard, p.x, p.y, portee, cone)) continue;
      if (!vueLibre(joueur.x, joueur.y, p.x, p.y)) continue;
      eclaires.add(p);
    }
    for (let tour = 0; tour < 4; tour++) {
      let ajout = false;
      for (const src of [...eclaires]) {
        for (const cible of zone.persos) {
          if (cible === src || eclaires.has(cible)) continue;
          if (cible.emotion === EMOTIONS.COLERE) continue;
          if (!dansLeCone(src.x, src.y, src.regard, cible.x, cible.y, D.portee * 5, D.cone)) continue;
          if (!vueLibre(src.x, src.y, cible.x, cible.y)) continue;
          eclaires.add(cible);
          ajout = true;
        }
      }
      if (!ajout) break;
    }
    return eclaires;
  }

  // Une braise tient les rouges à distance : c'est ce qui en fait un abri et
  // pas seulement un lampadaire.
  // Chemin case par case entre deux points du monde, en descendant le gradient
  // du parcours en largeur. Les sentinelles allaient tout droit vers leur point
  // de ronde : mesuré, elles visaient un point derrière un mur 46 % du temps et
  // 5 sur 23 restaient plantées contre la paroi plus de 60 % du temps.
  function routeVers(x0, y0, x1, y1) {
    const dep = { cx: Math.floor(x0 / CASE), cy: Math.floor(y0 / CASE) };
    if (solide(dep.cx, dep.cy)) return null;
    const d = distances(zone, dep);
    let cx = Math.floor(x1 / CASE), cy = Math.floor(y1 / CASE);
    if (!d[cy] || d[cy][cx] < 0) return null;
    const route = [];
    let garde = 0;
    while (d[cy][cx] > 0 && garde++ < 400) {
      route.push({ x: (cx + 0.5) * CASE, y: (cy + 0.5) * CASE });
      const voisins = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]
        .filter(([x, y]) => d[y] !== undefined && d[y][x] >= 0);
      if (!voisins.length) break;
      const suivant = voisins.reduce((a, [x, y]) => (d[y][x] < d[a[1]][a[0]] ? [x, y] : a), voisins[0]);
      cx = suivant[0]; cy = suivant[1];
    }
    return route.reverse();
  }

  const prochedUneBraise = (x, y, marge) =>
    zone.braises.some((b) => Math.hypot(b.x - x, b.y - y) < b.r * (marge || 1));

  const procheDuneTorche = (x, y) =>
    zone.torches.some((t) => t.reste > 0 && Math.hypot(t.x - x, t.y - y) < t.r);

  /* ==================================================== particules ======= */

  // Petites particules au-dessus de la tête : c'est le canal qui dit l'émotion
  // sans texte — danger, joie, peur.
  function emettre(x, y, couleur, n, vitesse, forme2) {
    for (let i = 0; i < n && particules.length < 140; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
      particules.push({
        x, y, vx: Math.cos(a) * vitesse * (0.5 + Math.random()),
        vy: Math.sin(a) * vitesse * (0.5 + Math.random()),
        vie: 0.5 + Math.random() * 0.5, max: 1, couleur, forme: forme2 || 'point',
      });
    }
  }

  function majParticules(dt) {
    for (let i = particules.length - 1; i >= 0; i--) {
      const q = particules[i];
      q.x += q.vx * dt; q.y += q.vy * dt;
      q.vy += 32 * dt;
      q.vie -= dt;
      if (q.vie <= 0) particules.splice(i, 1);
    }
    for (let i = ondes.length - 1; i >= 0; i--) {
      const o = ondes[i];
      o.r += (o.max - o.r) * Math.min(1, 7 * dt) + 40 * dt;
      if (o.r >= o.max * 0.97) ondes.splice(i, 1);
    }
  }

  /* ==================================================== physique ========= */

  function majJelly(p, dt) {
    const cibleX = clamp(1 + p.vy * 0.00055 - p.vx * 0.00055, 0.84, 1.19);
    const cibleY = clamp(1 + p.vx * 0.00055 - p.vy * 0.00055, 0.84, 1.19);
    p.vsx += (cibleX - p.sx) * 190 * dt;
    p.vsy += (cibleY - p.sy) * 190 * dt;
    p.vsx -= p.vsx * 13 * dt;
    p.vsy -= p.vsy * 13 * dt;
    p.sx += p.vsx * dt;
    p.sy += p.vsy * dt;
  }

  let filDernier = { x: 0, y: 0 };

  function majJoueur(dt) {
    const demi = D.taille * 0.5;

    if (manche.actif && manche.force > 0.06) {
      const accel = 1700 * manche.force;
      joueur.vx += manche.dx * accel * dt;
      joueur.vy += manche.dy * accel * dt;
    }

    const frottement = Math.pow(0.0009, dt);
    joueur.vx *= frottement;
    joueur.vy *= frottement;

    let vmax = 300 + joueur.niveau * 26;
    if (aBonus('hate')) vmax *= 1.55;
    const v = Math.hypot(joueur.vx, joueur.vy);
    if (v > vmax) { joueur.vx = (joueur.vx / v) * vmax; joueur.vy = (joueur.vy / v) * vmax; }

    joueur.x += joueur.vx * dt;
    joueur.y += joueur.vy * dt;
    joueur.x = clamp(joueur.x, demi, zone.largeur - demi);
    joueur.y = clamp(joueur.y, demi, zone.hauteur - demi);
    degager(joueur, demi);

    if (v > 26) joueur.regard += ecartAngle(joueur.regard, Math.atan2(joueur.vy, joueur.vx)) * Math.min(1, 12 * dt);

    // le fil : un point tous les vingt pixels parcourus
    if (Math.hypot(joueur.x - filDernier.x, joueur.y - filDernier.y) > 20) {
      fil.push({ x: joueur.x, y: joueur.y });
      filDernier = { x: joueur.x, y: joueur.y };
      if (fil.length > 900) fil.shift();
    }

    majJelly(joueur, dt);
  }

  // Le convoi. Chacun suit celui qui le précède, à la queue leu leu, pour ne pas
  // s'empiler sur le joueur. Les deux couleurs n'obéissent pas à la même règle,
  // et c'est tout l'arbitrage du jeu :
  //   BLEU — timide : il n'avance que tant qu'il est DANS la lumière. Discret,
  //          mais il colle et il ralentit.
  //   OR   — curieux : il suit partout et garde son faisceau allumé devant lui.
  //          Il éclaire la route, et il dénonce.
  function suivre(p, dt) {
    // Le portail aspire : sans ça un suiveur gardait son espacement derrière le
    // joueur et n'entrait jamais dans le rayon de livraison, même collé dessus.
    const versPortail = Math.hypot(zone.sortie.x - p.x, zone.sortie.y - p.y);
    if (zone.sortie.ames < zone.requis && versPortail < CASE * 2.6) {
      const ax = zone.sortie.x - p.x, ay = zone.sortie.y - p.y;
      const ad = versPortail || 1;
      p.vx += (ax / ad) * 2400 * dt;
      p.vy += (ay / ad) * 2400 * dt;
      p.regard += ecartAngle(p.regard, Math.atan2(ay, ax)) * 5 * dt;
      return;
    }

    const file = zone.persos.filter((q) => q.suit && !q.livre).sort((a, b) => a.rang - b.rang);
    const i = file.indexOf(p);
    const devant = i <= 0 ? joueur : file[i - 1];
    const dx = devant.x - p.x, dy = devant.y - p.y;
    const d = Math.hypot(dx, dy) || 1;
    const ecart = D.taille * 1.5;

    const timide = p.emotion === EMOTIONS.PEUR;
    const auClair = !timide || estEclaire(p.x, p.y);

    // Hors de la lumière, le bleu TRAÎNE — il ne se fige pas. Mesuré avec la
    // règle « il n'avance que s'il est éclairé » : un bleu sorti du halo ne
    // pouvait plus jamais revenir et restait planté à onze cases du convoi.
    // Et l'accélération doit être d'un tout autre ordre que celle d'un PNJ
    // immobile : à 320 le frottement la plafonnait à 50 px/s, six fois moins
    // que le joueur, donc le convoi décrochait systématiquement.
    if (d > ecart) {
      const vitesse = (timide ? 2100 : 2700) * (auClair ? 1 : 0.3);
      p.vx += (dx / d) * vitesse * dt;
      p.vy += (dy / d) * vitesse * dt;
      if (!timide) p.regard += ecartAngle(p.regard, Math.atan2(dy, dx)) * 5 * dt;
    }
    if (timide) {
      p.regard += ecartAngle(p.regard, Math.atan2(joueur.y - p.y, joueur.x - p.x)) * 3 * dt;
      if (!auClair && Math.random() < dt * 3) emettre(p.x, p.y - D.taille * 0.7, '#8fd0ff', 1, 24);
    }
  }

  function majPersos(dt, temps, eclaires) {
    const demi = D.taille * 0.5;
    for (const p of zone.persos) {
      if (p.livre) continue;                      // absorbé par le portail
      p.eclaire = eclaires.has(p);
      if (p.aveugle > 0) p.aveugle -= dt;
      if (p.emotion === EMOTIONS.COLERE) {
        p.cligne = (p.cligne || 0) - dt;
        p.prochainCligne -= dt;
        if (p.prochainCligne <= 0) { p.cligne = 0.42; p.prochainCligne = 2.2 + Math.random() * 3.6; }
      }
      if (p.fuit > 0) p.fuit -= dt;
      const dx = joueur.x - p.x, dy = joueur.y - p.y;
      const d = Math.hypot(dx, dy) || 1;
      // Un peureux ou un curieux te remarque de partout : ils ne te chassent pas.
      // Un coléreux, lui, est une SENTINELLE : il ne te voit que dans son cône.
      const voit = p.emotion === EMOTIONS.COLERE
        ? dansLeCone(p.x, p.y, p.regard, joueur.x, joueur.y, PORTEE_VUE, 0.42)
            && vueLibre(p.x, p.y, joueur.x, joueur.y)
        : d < CASE * 5 && vueLibre(p.x, p.y, joueur.x, joueur.y);

      // Une âme ne porte pas une humeur de naissance : elle porte celle de la
      // situation, exactement comme le joueur. Calculée avant son déplacement,
      // donc sur la vitesse de l'image précédente — un retard invisible.
      if (p.emotion !== EMOTIONS.COLERE) p.humeur = humeurSelon(p, menace || p.fuit > 0, p.calme);

      if (p.emotion === EMOTIONS.CURIEUX) {
        if (p.calme) {
          suivre(p, dt);
        } else {
          p.phase += p.balayage * (p.eclaire ? 0.18 : 1) * dt;
          p.regard = p.regardRepos + Math.sin(p.phase) * p.amplitude;
        }

      } else if (p.emotion === EMOTIONS.PEUR) {
        if (p.calme) { suivre(p, dt); } else if (voit && d < CASE * 2.6) {
          p.vx -= (dx / d) * 300 * dt;
          p.vy -= (dy / d) * 300 * dt;
          p.regard = Math.atan2(-dy, -dx);
          p.fuit = 0.6;                          // il a peur de TOI, pas des rouges
          if (Math.random() < dt * 3) emettre(p.x, p.y - D.taille * 0.7, '#8fd0ff', 1, 26);
        } else {
          p.vx += (p.baseX - p.x) * 1.6 * dt;
          p.vy += (p.baseY - p.y) * 1.6 * dt;
          p.phase += p.balayage * 0.5 * dt;
          p.regard = p.regardRepos + Math.sin(p.phase) * 0.5;
        }

      } else {
        // SENTINELLE. Elle fait sa ronde et balaye du regard. Elle ne te
        // détecte QUE si tu entres dans son cône — donc on peut la contourner,
        // passer dans son dos, attendre que son balayage s'éloigne. La laisse
        // reste : sans elle, un seul rouge suivait le joueur à travers toute la
        // zone et le revidait à chaque réapparition.
        const loin = Math.hypot(p.x - p.baseX, p.y - p.baseY) > CASE * 5.5;
        if (p.alerte > 0) p.alerte -= dt;         // l'alerte est posée par majRegles
        if (p.gene) p.alerte = 0;

        if (p.alerte > 0) {
          // EN ALERTE, ELLE N'A PAS VU LE HÉROS. Elle se doute de quelque chose
          // et fouille sa zone : elle balaye largement et avance dans la
          // direction qu'elle regarde. Elle ne fonce surtout pas sur le joueur —
          // c'est le front rouge de son cône qui menace, pas elle.
          p.route = null;
          if (!p.enAlerte) { p.enAlerte = true; p.capAlerte = p.regard; p.phase = 0; }
          p.phase += 1.5 * dt;
          p.regard = p.capAlerte + Math.sin(p.phase) * 0.9;
          if (!loin) {
            p.vx += Math.cos(p.regard) * 130 * dt;
            p.vy += Math.sin(p.regard) * 130 * dt;
          }
          p.humeur = HUMEURS.ACHARNE;          // elle cherche, et ça se voit
          if (Math.random() < dt * 4) emettre(p.x, p.y - D.taille * 0.75, '#ff7a6b', 1, 34, 'trait');

        } else {
          p.enAlerte = false;
          // elle a entendu un caillou : elle va voir, sans être alertée
          if (p.curiosite && p.curieuxT > 0) {
            p.curieuxT -= dt;
            const cd = Math.hypot(p.curiosite.x - p.x, p.curiosite.y - p.y);
            if (cd < CASE * 0.8 || p.curieuxT <= 0) { p.curiosite = null; p.route = null; }
            else {
              if (!p.route || !p.route.length) p.route = routeVers(p.x, p.y, p.curiosite.x, p.curiosite.y);
              if (p.route && p.route.length) {
                const w = p.route[0];
                const rx = w.x - p.x, ry = w.y - p.y, rd = Math.hypot(rx, ry) || 1;
                if (rd < CASE * 0.45) p.route.shift();
                else { p.vx += (rx / rd) * 430 * dt; p.vy += (ry / rd) * 430 * dt; }
              }
              p.regard += ecartAngle(p.regard, Math.atan2(p.curiosite.y - p.y, p.curiosite.x - p.x)) * 4 * dt;
              p.humeur = HUMEURS.INTRIGUE;     // un bruit, pas une certitude
              if (Math.random() < dt * 2) emettre(p.x, p.y - D.taille * 0.8, '#b2bacc', 1, 26);
            }
          }
          // ronde : elle va d'un point de passage au suivant, et le regard
          // balaye autour de sa direction de marche
          // elle recule jusqu'à être NETTEMENT hors de la braise : s'arrêter à
          // sa frontière la faisait osciller entre gênée et pas gênée
          const b = zone.braises.find((q) => Math.hypot(q.x - p.x, q.y - p.y) < q.r * 1.3);
          if (b) {
            const bx = p.x - b.x, by = p.y - b.y, bd = Math.hypot(bx, by) || 1;
            p.vx += (bx / bd) * 300 * dt;
            p.vy += (by / bd) * 300 * dt;
            p.humeur = HUMEURS.INTRIGUE;
          } else if (p.curiosite) {
            // on la laisse finir son détour avant de reprendre la ronde
          } else if (p.ronde && p.ronde.length) {
            const c = p.ronde[p.etape % p.ronde.length];

            // détecteur de blocage : si elle n'avance plus, elle recalcule
            // plutôt que de pousser contre la pierre
            p.immobile = Math.hypot(p.x - (p.dernierX || 0), p.y - (p.dernierY || 0)) < 0.4
              ? (p.immobile || 0) + dt : 0;
            p.dernierX = p.x; p.dernierY = p.y;

            if (Math.hypot(c.x - p.x, c.y - p.y) < CASE * 0.6) {
              // arrivée : on passe au point suivant, une seule fois
              p.etape++; p.route = null; p.immobile = 0;
            } else {
              if (!p.route || !p.route.length || p.immobile > 1.1) {
                p.route = routeVers(p.x, p.y, c.x, c.y);
                p.immobile = 0;
              }
              // Un chemin vide alors qu'on n'est PAS arrivé veut dire que la
              // cible est dans notre propre case : le parcours en largeur n'a
              // rien à renvoyer. On y va alors en ligne droite — c'est sans
              // risque à cette distance. Sans ce cas, la sentinelle sautait au
              // point suivant à chaque frame et ne partait jamais nulle part.
              const w = (p.route && p.route.length) ? p.route[0] : c;
              const rx = w.x - p.x, ry = w.y - p.y;
              const rd = Math.hypot(rx, ry) || 1;
              if (p.route && p.route.length && rd < CASE * 0.45) p.route.shift();
              else { p.vx += (rx / rd) * 430 * dt; p.vy += (ry / rd) * 430 * dt; }
              p.cap = Math.atan2(ry, rx);
            }
            p.humeur = p.aveugle > 0 ? HUMEURS.INTRIGUE : HUMEURS.ACHARNE;
          }
          p.phase += p.balayage * 0.8 * dt;
          const cap = p.cap === undefined ? p.regardRepos : p.cap;
          p.regard += ecartAngle(p.regard, cap + Math.sin(p.phase) * 0.9) * 3.2 * dt;
        }

        // aveuglée : elle ferme les yeux et stresse
        if (p.aveugle > 0 && Math.random() < dt * 9) {
          emettre(p.x + (Math.random() - 0.5) * D.taille, p.y - D.taille * 0.8,
                  Math.random() < 0.5 ? '#ffffff' : '#ff7a6b', 1, 30);
        }
      }

      const f = Math.pow(0.0016, dt);
      p.vx *= f; p.vy *= f;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.x = clamp(p.x, demi, zone.largeur - demi);
      p.y = clamp(p.y, demi, zone.hauteur - demi);
      degager(p, demi);

      // séparation d'avec le joueur : un rouge logé dedans est illisible
      const sx = p.x - joueur.x, sy = p.y - joueur.y;
      const sd = Math.hypot(sx, sy);
      const mini = D.taille * 0.95;
      if (sd > 0.01 && sd < mini) {
        const k = (mini - sd) * 0.5;
        p.x += (sx / sd) * k; p.y += (sy / sd) * k;
        joueur.x -= (sx / sd) * k; joueur.y -= (sy / sd) * k;
        degager(joueur, demi);
        // Toucher une sentinelle est fatal (voir majRegles) ; ici on se contente
        // de la réveiller, pour le cas où elle serait aveuglée.
        if (p.emotion === EMOTIONS.COLERE) {
          p.alerte = 2.8;
          p.route = null;
        }
      }

      majJelly(p, dt);
    }
  }

  /* ==================================================== règles =========== */

  // Formes déjà expliquées une fois dans la session : on ne réexplique pas.
  const dejaVues = new Set();

  function evoluer() {
    const suivant = FORMES[joueur.niveau + 1];
    if (!suivant || joueur.sommet < suivant.seuil) return;
    joueur.niveau++;
    // le palier élargit la poche : on la remplit tout de suite, sinon la
    // récompense ne se sent qu'au bout d'une recharge complète
    joueur.galets = rangCaillou().reserve;
    majBoutons();
    emettre(joueur.x, joueur.y - D.taille * 0.7, suivant.couleur, 16, 90);
    // Le bandeau modal met le jeu en pause. Acceptable pour découvrir un verbe,
    // insupportable au milieu d'une escorte — et comme la forme repart à zéro à
    // chaque zone, on le reverrait à chaque fois. Une seule explication par
    // forme et par session ; ensuite un simple bandeau passager.
    if (dejaVues.has(suivant.nom)) {
      montrerToast(`${suivant.nom} — ${suivant.verbe}`, suivant.couleur);
    } else {
      dejaVues.add(suivant.nom);
      montrerFlash(suivant.nom, suivant.texte, suivant.couleur, suivant.verbe);
    }
  }

  function majBoutons() {
    elCaillou.disabled = joueur.galets <= 0;
    elCaillouN.textContent = joueur.galets;
    // l'anneau montre le galet en cours de retour ; poche pleine, il est plein
    const plein = joueur.galets >= rangCaillou().reserve;
    elCaillou.style.setProperty('--recharge', plein ? '1' : joueur.caillouDispo.toFixed(2));
  }

  function gagnerEclat(n) {
    joueur.eclat += n;
    joueur.sommet = Math.max(joueur.sommet, joueur.eclat);
    evoluer();
  }

  // Un membre du convoi repéré s'enfuit et redevient farouche. Il reste
  // récupérable : il faut retourner le calmer, ce qui coûte du temps.
  function paniquer(q) {
    q.suit = false; q.calme = false; q.compteCalme = 0;
    q.fuit = 1.2;
    const a = Math.atan2(q.y - joueur.y, q.x - joueur.x);
    q.vx += Math.cos(a) * 420; q.vy += Math.sin(a) * 420;
    q.baseX = q.x; q.baseY = q.y;
    emettre(q.x, q.y - D.taille * 0.8, '#8fd0ff', 8, 70);
    montrerToast('Une âme t\'échappe !', '#8fd0ff');
    for (const r of zone.persos) if (r.suit && r.rang > q.rang) r.rang--;
  }

  // Un point de sol libre au plus près d'une position : les âmes lâchées ne
  // doivent pas se retrouver dans la pierre.
  // Elles se répandent autour du point de chute plutôt que de s'y empiler :
  // cinq âmes sur un même pixel, on n'en voit qu'une et on croit en avoir perdu
  // quatre pour de bon. On balaye en spirale et on refuse une place déjà prise —
  // un cap figé par âme ne suffisait pas, celle dont le cap pointait dans la
  // pierre restait plantée au centre avec les autres.
  function solLibrePres(x, y, rang, prises) {
    const ecart = CASE * 0.45;
    for (let anneau = 1; anneau <= 4; anneau++) {
      for (let k = 0; k < 12; k++) {
        const a = (k / 12) * TAU + rang * 0.52;      // chacune commence ailleurs
        const cx = x + Math.cos(a) * CASE * 0.55 * anneau;
        const cy = y + Math.sin(a) * CASE * 0.55 * anneau;
        if (solide(Math.floor(cx / CASE), Math.floor(cy / CASE))) continue;
        if (prises.some((q) => Math.hypot(q.x - cx, q.y - cy) < ecart)) continue;
        return { x: cx, y: cy };
      }
    }
    return { x, y };                    // cul-de-sac d'une case : tant pis
  }

  function eteindre() {
    // L'éclat n'est JAMAIS repris : la progression ne se perd pas, sinon la
    // mort punit deux fois. Et c'est un bandeau qui s'efface, pas une fenêtre à
    // valider : ça casserait le rythme.
    joueur.souffle = 1;
    for (const p of zone.persos) p.charge = 0;

    // On perd le CONVOI, jamais la banque. Ce qui est entré dans le portail y
    // reste : le travail déjà fait ne se défait pas, sinon une mort tardive
    // renvoie à la case départ et l'escorte devient décourageante. Ce qu'on
    // portait sur le dos, en revanche, se disperse là où on est tombé, et il
    // faut retourner le chercher à l'endroit exact de l'échec.
    const mx = joueur.x, my = joueur.y;
    const prises = [];
    let perdues = 0;
    for (const p of zone.persos) {
      if (p.emotion === EMOTIONS.COLERE || !p.suit || p.livre) continue;
      const pos = solLibrePres(mx, my, ++perdues, prises);
      prises.push(pos);
      p.x = p.baseX = pos.x; p.y = p.baseY = pos.y;
      p.vx = p.vy = 0;
      p.suit = false; p.calme = false;
      p.compteCalme = 0; p.rang = 0; p.fuit = 0.8;
      emettre(p.x, p.y - D.taille * 0.8, '#8fd0ff', 8, 60);
    }

    joueur.x = zone.depart.x; joueur.y = zone.depart.y;
    joueur.vx = joueur.vy = 0;
    joueur.repit = 1.6;
    fil.push(null);                     // coupure : on ne relie pas la mort au seuil
    filDernier = { x: zone.depart.x, y: zone.depart.y };
    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE) continue;
      p.x = p.baseX; p.y = p.baseY; p.vx = p.vy = 0;
    }
    montrerToast(perdues
      ? `Éteint — ${perdues} âme${perdues > 1 ? 's' : ''} lâchée${perdues > 1 ? 's' : ''} là où tu es tombé`
      : 'Éteint — tu repars du seuil');
  }

  function ramasser(l) {
    l.prise = true;
    const b = BONUS[l.type];
    emettre(l.x, l.y, b.couleur, 10, 70);
    if (l.type === 'eclat') { priseCount++; gagnerEclat(4); return; }
    priseCount++;
    if (l.type === 'galet') { joueur.galets = rangCaillou().reserve; joueur.caillouDispo = 0; majBoutons(); montrerToast(b.phrase, b.couleur); return; }
    if (l.type === 'souffle') joueur.souffle = 1;
    joueur.bonus = l.type;
    joueur.bonusT = b.duree;
    montrerToast(b.phrase, b.couleur);
    gagnerEclat(2);
  }

  // Une porte s'ouvre pour QUI QUE CE SOIT — joueur comme sentinelle — et se
  // referme seule. C'est ce qui en fait un objet de tension et pas un verrou :
  // s'en approcher ouvre le couloir au regard d'en face, exactement au moment
  // où on voudrait rester caché.
  function majPortes(dt) {
    for (const pt of zone.portes) {
      let proche = Math.hypot(joueur.x - pt.x, joueur.y - pt.y) < CASE * 0.95;
      if (!proche) {
        for (const q of zone.persos) {
          if (q.livre) continue;
          if (Math.hypot(q.x - pt.x, q.y - pt.y) < CASE * 0.95) { proche = true; break; }
        }
      }
      const avant = pt.ouverte;
      pt.ouverte = clamp(pt.ouverte + (proche ? 3.2 : -1.3) * dt, 0, 1);
      if (avant < 0.5 && pt.ouverte >= 0.5) emettre(pt.x, pt.y, '#c8b088', 5, 40);
    }
  }

  function majRegles(dt) {
    for (const l of zone.lueurs) {
      if (l.prise) continue;
      if (Math.hypot(l.x - joueur.x, l.y - joueur.y) < D.taille * 0.9) { ramasser(l); continue; }
      // mémoire des points d'intérêt : on se souvient des objets, pas du terrain
      if (!l.vue && estEclaire(l.x, l.y)) l.vue = true;
    }
    if (!zone.sortie.vue && estEclaire(zone.sortie.x, zone.sortie.y)) zone.sortie.vue = true;

    for (const t of zone.torches) {
      if (t.reste > 0) t.reste -= dt;
      if (Math.hypot(t.x - joueur.x, t.y - joueur.y) < CASE * 0.75 && t.reste < t.duree * 0.6) {
        if (t.reste <= 0) emettre(t.x, t.y, '#ffb45c', 8, 55);
        t.reste = t.duree;
      }
    }

    // Regarder un bonhomme assez longtemps le calme — n'importe lequel, pas
    // seulement les peureux. Il passe au vert et SON FAISCEAU DEVIENT
    // PERMANENT : c'est ce qui donne enfin un rôle aux personnages non joués.
    // Une lampe qu'on gagne en la regardant, et qu'on choisit où allumer.
    for (const p of zone.persos) {
      if (p.emotion === EMOTIONS.COLERE || p.calme || p.livre || !p.eclaire) continue;
      p.compteCalme += dt;
      if (p.compteCalme > 1.1) {
        p.calme = true;
        p.suit = true;
        p.rang = zone.persos.filter((q) => q.suit).length;   // sa place dans la file
        gagnerEclat(6);
        emettre(p.x, p.y - D.taille * 0.7, '#a8f0c8', 12, 80);
        montrerToast(p.emotion === EMOTIONS.PEUR
          ? 'Il te suit — mais seulement dans ta lumière'
          : 'Il te suit et éclaire devant lui', '#a8f0c8');
      }
    }

    // LA RÈGLE. Entrer dans le faisceau ne te fait pas repérer : ça met la
    // sentinelle en alerte, et une zone rouge se met à grandir depuis elle le
    // long de son cône. Tant que ce front ne t'a pas rattrapé, tu peux encore
    // sortir. S'il t'atteint — ou si tu la touches — c'est fini. La distance
    // fait donc le délai toute seule, sans aucune formule.
    if (joueur.repit > 0) joueur.repit -= dt;
    const abri = prochedUneBraise(joueur.x, joueur.y, 1) || procheDuneTorche(joueur.x, joueur.y);
    let pire = 0, traque = false;

    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE || p.livre) continue;

      // Hystérésis sur l'abri : une sentinelle arrêtée pile au bord d'une braise
      // basculait alerte / pas alerte plusieurs fois par seconde. Elle entre
      // dans l'état « gênée » plus loin qu'elle n'en sort.
      p.gene = p.aveugle > 0 || prochedUneBraise(p.x, p.y, p.gene ? 1.12 : 0.95);

      const d = Math.hypot(joueur.x - p.x, joueur.y - p.y);
      if (d < D.taille && joueur.repit <= 0 && p.aveugle <= 0) { eteindre(); return; }

      // Ce que la sentinelle peut voir : toi ET ton convoi. C'est le cœur de
      // l'arbitrage — chaque âme que tu escortes est une silhouette de plus
      // dans le faisceau, et la jauge monte d'autant plus vite.
      const exposable = (q) => !p.gene && p.cligne <= 0
        && Math.hypot(q.x - p.x, q.y - p.y) <= PORTEE_VUE
        && dansLeCone(p.x, p.y, p.regard, q.x, q.y, PORTEE_VUE, 0.42)
        && vueLibre(p.x, p.y, q.x, q.y);

      const joueurVu = !aBonus('souffle') && !abri && joueur.repit <= 0 && exposable(joueur);
      const convoi = zone.persos.filter((q) => q.suit && !q.livre && exposable(q));
      const corps = (joueurVu ? 1 : 0) + convoi.length;
      p.corpsVus = corps;                       // exposé pour les mesures

      if (corps > 0) {
        traque = true;
        p.alerte = 2.8;                         // elle se doute, elle n'a pas vu
        p.charge = Math.min(1, p.charge + 0.34 * corps * dt);

        // Le front rouge rattrape quelqu'un : le joueur est éliminé, mais un
        // membre du convoi PANIQUE seulement. On perd la cargaison, pas la
        // partie — un échec qui coûte du temps plutôt qu'une punition sèche.
        const front = p.charge * PORTEE_VUE;
        if (joueurVu && front >= d) { eteindre(); return; }
        for (const q of convoi) {
          if (front < Math.hypot(q.x - p.x, q.y - p.y)) continue;
          paniquer(q);
        }
      } else {
        const cache = !vueLibre(p.x, p.y, joueur.x, joueur.y);
        p.charge = Math.max(0, p.charge - (cache ? 0.7 : 0.45) * dt);
      }
      pire = Math.max(pire, p.charge);
    }

    // Le halo suit la jauge la plus pleine : la lumière rétrécit à mesure qu'une
    // sentinelle te verrouille, et revient quand tu lui échappes. Une seule
    // idée, deux lectures.
    joueur.souffle = 1 - pire;
    joueur.vu += ((traque ? 1 : 0) - joueur.vu) * Math.min(1, 6 * dt);
    // Ce que TOUT LE MONDE ressent : être dans un faisceau, ou simplement
    // savoir qu'un rouge cherche. C'est ce drapeau qui met la peur sur les
    // visages, celui du joueur comme ceux du convoi.
    menace = traque || zone.persos.some((p) =>
      p.emotion === EMOTIONS.COLERE && !p.livre && p.aveugle <= 0 && p.alerte > 0);
    if (traque && Math.random() < dt * 6) {
      emettre(joueur.x, joueur.y - D.taille * 0.75, '#ff7a6b', 1, 40, 'trait');
    }

    if (joueur.bonusT > 0) {
      joueur.bonusT -= dt;
      // traînée continue à la couleur du bonus : on voit qu'il est actif même
      // sans regarder la barre du haut
      if (Math.random() < dt * 14) {
        emettre(joueur.x + (Math.random() - 0.5) * D.taille,
                joueur.y + (Math.random() - 0.5) * D.taille,
                BONUS[joueur.bonus].couleur, 1, 18);
      }
      if (joueur.bonusT <= 0) { joueur.bonus = null; montrerToast('Le bonus s\'éteint', '#9aa1ac'); }
    }

    // Les galets reviennent un par un, au rythme du palier atteint.
    const rang = rangCaillou();
    if (joueur.galets < rang.reserve) {
      joueur.caillouDispo += dt / rang.delai;
      if (joueur.caillouDispo >= 1) { joueur.galets++; joueur.caillouDispo = 0; }
      majBoutons();
    } else joueur.caillouDispo = 0;

    // Livraison : tout membre du convoi qui touche le portail y entre.
    for (const q of zone.persos) {
      if (!q.suit || q.livre) continue;
      if (Math.hypot(zone.sortie.x - q.x, zone.sortie.y - q.y) > zone.sortie.r) continue;
      q.livre = true; q.suit = false;
      zone.sortie.ames++;
      gagnerEclat(10);
      emettre(zone.sortie.x, zone.sortie.y, '#ffe9a8', 16, 110);
      ondes.push({ x: zone.sortie.x, y: zone.sortie.y, r: 0, max: CASE * 2.6, couleur: '#ffe9a8' });
      montrerToast(zone.sortie.ames >= zone.requis
        ? 'Le portail est chargé — entre'
        : `Âme livrée — ${zone.sortie.ames}/${zone.requis}`, '#ffe9a8');
    }

    if (zone.sortie.ames >= zone.requis &&
        Math.hypot(zone.sortie.x - joueur.x, zone.sortie.y - joueur.y) < zone.sortie.r) {
      zoneSuivante();
    }
  }

  // « est-ce que ce point est actuellement éclairé » — sert à la mémoire des objets
  function estEclaire(x, y) {
    if (Math.hypot(x - joueur.x, y - joueur.y) < rayonHalo()) return true;
    const portee = porteeFaisceau();
    if (portee && dansLeCone(joueur.x, joueur.y, joueur.regard, x, y, portee, coneFaisceau())
        && vueLibre(joueur.x, joueur.y, x, y)) return true;
    if (prochedUneBraise(x, y, 1) || procheDuneTorche(x, y)) return true;
    // un calmé éclaire en permanence : ce qu'il vise est visible pour toujours
    return zone.persos.some((p) => p.calme
      && dansLeCone(p.x, p.y, p.regard, x, y, D.portee * 5, D.cone)
      && vueLibre(p.x, p.y, x, y));
  }

  // Un caillou part devant toi en arc de cercle et tombe quelques cases plus
  // loin. Les sentinelles qui l'entendent vont VOIR ce que c'était — elles se
  // déplacent vers le bruit sans être alertées. C'est le seul outil du Peureux,
  // et il reste utile jusqu'au bout.
  // visée du caillou : on glisse le doigt depuis le bouton pour choisir la
  // direction et la distance
  const visee = { actif: false, ox: 0, oy: 0, dx: 0, dy: 0, force: 0, id: null };

  function lancerCaillou(angle, portion) {
    if (joueur.galets <= 0) return;
    joueur.galets--;
    majBoutons();
    const a = angle === undefined ? joueur.regard : angle;
    const portee = CASE * (1.6 + (portion === undefined ? 1 : portion) * 4.4);
    // il s'arrête au premier mur : un caillou ne traverse pas la pierre
    let d = CASE * 0.4;
    while (d < portee && !solide(Math.floor((joueur.x + Math.cos(a) * d) / CASE),
                                 Math.floor((joueur.y + Math.sin(a) * d) / CASE))) d += CASE * 0.2;
    d = Math.max(CASE * 0.6, d - CASE * 0.25);
    cailloux.push({
      x0: joueur.x, y0: joueur.y,
      x1: joueur.x + Math.cos(a) * d, y1: joueur.y + Math.sin(a) * d,
      x: joueur.x, y: joueur.y, t: 0, duree: 0.34 + d / (CASE * 16),
      rang: rangCaillou(),
    });
  }

  // trajectoire prévue, dessinée pendant la visée
  function dessinerVisee() {
    if (!visee.actif) return;
    const a = Math.atan2(visee.dy, visee.dx);
    const portee = CASE * (1.6 + visee.force * 4.4);
    let d = CASE * 0.4;
    while (d < portee && !solide(Math.floor((joueur.x + Math.cos(a) * d) / CASE),
                                 Math.floor((joueur.y + Math.sin(a) * d) / CASE))) d += CASE * 0.2;
    d = Math.max(CASE * 0.6, d - CASE * 0.25);
    const jx = joueur.x - cam.x, jy = joueur.y - cam.y;
    ctx.save();
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = 'rgba(178,186,204,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 16; i++) {
      const k = i / 16;
      const x = jx + Math.cos(a) * d * k;
      const y = jy + Math.sin(a) * d * k - Math.sin(k * Math.PI) * CASE * 0.55;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    const cx = jx + Math.cos(a) * d, cy = jy + Math.sin(a) * d;
    ctx.strokeStyle = 'rgba(178,186,204,0.75)';
    ctx.beginPath(); ctx.arc(cx, cy, 9, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(178,186,204,0.25)';
    ctx.beginPath(); ctx.arc(cx, cy, 9, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function majCailloux(dt) {
    for (let i = cailloux.length - 1; i >= 0; i--) {
      const c = cailloux[i];
      c.t += dt;
      const k = Math.min(1, c.t / c.duree);
      c.x = c.x0 + (c.x1 - c.x0) * k;
      c.y = c.y0 + (c.y1 - c.y0) * k;
      c.hauteur = Math.sin(k * Math.PI) * CASE * 0.55;     // l'arc de cercle
      if (k < 1) continue;
      cailloux.splice(i, 1);
      toucherLeSol(c);
    }
  }

  // Le caillou retombe. Ce qu'il déclenche dépend du palier atteint, mais le
  // geste, lui, n'a jamais changé depuis la première seconde de jeu.
  function toucherLeSol(c) {
    const r = c.rang;
    const teinte = r.eclate ? '#fff2c4' : r.couve ? '#ffc478' : '#b2bacc';
    ondes.push({ x: c.x1, y: c.y1, r: 0, max: CASE * (r.eclate ? 6 : 3.2), couleur: teinte });
    emettre(c.x1, c.y1, teinte, r.eclate ? 26 : 7, r.eclate ? 200 : 45);

    // il se met à brûler : c'est l'abri du Veilleur, posé à distance
    if (r.couve) zone.braises.push({ x: c.x1, y: c.y1, r: CASE * 2.3, phase: Math.random() * TAU });

    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE) continue;
      const d = Math.hypot(p.x - c.x1, p.y - c.y1);
      // l'éclat aveugle toute la salle, le coup au but n'étourdit que sa cible
      if (r.eclate && d <= CASE * 6) { p.aveugle = 5; p.alerte = 0; p.route = null; continue; }
      if (r.frappe && d <= CASE * 0.85) { p.aveugle = Math.max(p.aveugle, 2.6); p.alerte = 0; p.route = null; continue; }
      if (p.aveugle > 0 || p.alerte > 0) continue;          // déjà sur toi : trop tard
      if (d > CASE * 5.5) continue;
      p.curiosite = { x: c.x1, y: c.y1 };
      p.curieuxT = 4.5;
      p.route = null;
      emettre(p.x, p.y - D.taille * 0.8, '#b2bacc', 3, 40);
    }
    if (r.eclate) montrerToast('Éclat — les rouges sont aveuglés');
  }

  /* ==================================================== rendu ============ */

  function carreArrondi(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  // Un visage = deux yeux, deux sourcils, une bouche, et une seule humeur les
  // accorde tous les trois. Ce sont les SOURCILS qui portent l'expression : la
  // peur, c'est les pointes intérieures relevées et l'œil grand ouvert ;
  // l'acharnement, l'inverse exact, pointes intérieures baissées et œil plissé.
  // Tant que le peureux portait des sourcils d'intrigué, aucune bouche ne
  // pouvait rattraper ça — il avait l'air plus inquiet sans bouche du tout.
  function dessinerTete(p, couleur, taille, allume, opacite, humeur, temps) {
    const affole = humeur === HUMEURS.PEUR;          // le vrai danger
    const inquiet = humeur === HUMEURS.INQUIET;      // la peur au repos
    const peur = affole || inquiet;                  // mêmes yeux, mêmes sourcils
    const acharne = humeur === HUMEURS.ACHARNE;
    const visee = humeur === HUMEURS.VISEE;
    const w = taille * p.sx, h = taille * p.sy;
    const arrondi = Math.min(w, h) * 0.32;
    const demi = taille * 0.5;

    ctx.save();
    ctx.translate(p.x - cam.x, p.y - cam.y);
    ctx.globalAlpha = opacite;

    const corps = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    if (allume) {
      corps.addColorStop(0, eclaircir(couleur, 0.42));
      corps.addColorStop(0.55, couleur);
      corps.addColorStop(1, assombrir(couleur, 0.3));
    } else {
      corps.addColorStop(0, '#23232f');
      corps.addColorStop(1, '#12121a');
    }
    ctx.fillStyle = corps;
    carreArrondi(ctx, -w / 2, -h / 2, w, h, arrondi);
    ctx.fill();
    ctx.strokeStyle = allume ? 'rgba(255,255,255,0.7)' : couleur;
    ctx.lineWidth = allume ? 2 : 1.5;
    ctx.stroke();

    const reflet = ctx.createRadialGradient(-w * 0.2, -h * 0.28, 0, -w * 0.2, -h * 0.28, w * 0.42);
    reflet.addColorStop(0, `rgba(255,255,255,${allume ? 0.45 : 0.1})`);
    reflet.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = reflet;
    carreArrondi(ctx, -w / 2, -h / 2, w, h, arrondi);
    ctx.fill();

    // --- yeux ---
    const ecart = demi * 0.36 * p.sx;
    const oeilY = -demi * 0.14 * p.sy;
    // l'œil s'ouvre grand quand on a peur, se plisse quand on s'acharne
    const rOeil = demi * 0.22 * (peur ? 1.22 : acharne ? 0.94 : 1);
    // en visée on ferme un œil : c'est le geste universel de qui ajuste
    const clinDoeil = visee ? 1 : 0;
    const px = Math.cos(p.regard) * rOeil * 0.42;
    const py = Math.sin(p.regard) * rOeil * 0.42;
    const encre = allume ? '#0a0a10' : couleur;
    if (p.aveugle > 0 || p.cligne > 0) {
      // aveuglée : les yeux se ferment. C'est le seul signe qui dit « elle ne
      // te voit plus » — sans lui, l'éclat n'a aucun effet visible.
      ctx.strokeStyle = encre;
      ctx.lineWidth = Math.max(2, demi * 0.12);
      ctx.lineCap = 'round';
      for (const dx of [-ecart, ecart]) {
        ctx.beginPath();
        ctx.arc(dx, oeilY - rOeil * 0.35, rOeil, 0.5, Math.PI - 0.5);
        ctx.stroke();
      }
    } else {
      // La pupille rétrécit dans la peur : c'est ce contraste avec le blanc
      // grand ouvert qui fait l'œil affolé, bien plus que sa taille.
      const rPupille = rOeil * (peur ? 0.36 : acharne ? 0.58 : 0.5);
      const hOeil = acharne ? rOeil * 0.62 : rOeil;   // paupière basse
      const frisson = affole ? Math.sin(temps * 17 + (p.tremble || 0)) * rOeil * 0.07 : 0;
      for (const dx of [-ecart, ecart]) {
        if (clinDoeil && dx > 0) {                    // l'œil droit se ferme
          ctx.strokeStyle = encre;
          ctx.lineWidth = Math.max(2, demi * 0.12);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(dx, oeilY - rOeil * 0.35, rOeil, 0.5, Math.PI - 0.5);
          ctx.stroke();
          continue;
        }
        ctx.save();
        ctx.beginPath(); ctx.ellipse(dx, oeilY, rOeil, hOeil, 0, 0, TAU);
        ctx.fillStyle = '#ffffff'; ctx.fill();
        ctx.clip();                                   // la pupille reste dans l'œil
        ctx.fillStyle = '#0a0a10';
        ctx.beginPath();
        ctx.arc(dx + px + frisson, oeilY + py, rPupille, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
    }

    // --- sourcils ---
    ctx.strokeStyle = encre;
    ctx.lineWidth = Math.max(2, demi * 0.12);
    ctx.lineCap = 'round';
    const lg = rOeil * 1.15;
    if (visee) {
      // un sourcil remonté, l'autre baissé sur l'œil fermé : la concentration
      ctx.beginPath();
      ctx.moveTo(-ecart - lg * 0.5, oeilY - rOeil * 2.1);
      ctx.lineTo(-ecart + lg * 0.5, oeilY - rOeil * 2.35);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ecart - lg * 0.5, oeilY - rOeil * 1.5);
      ctx.lineTo(ecart + lg * 0.5, oeilY - rOeil * 1.25);
      ctx.stroke();
    } else if (peur) {
      // Pointes INTÉRIEURES relevées, extérieures qui tombent, et le tout
      // remonté loin au-dessus de l'œil : c'est le sourcil inquiet.
      const sy = oeilY - rOeil * 1.95;
      for (const cote of [-1, 1]) {
        const dx = ecart * cote;
        ctx.beginPath();
        ctx.moveTo(dx + lg * 0.55 * cote, sy + rOeil * 0.42);   // extérieur, bas
        ctx.quadraticCurveTo(dx, sy - rOeil * 0.1,
                             dx - lg * 0.55 * cote, sy - rOeil * 0.34); // intérieur, haut
        ctx.stroke();
      }
    } else if (acharne) {
      // L'exact miroir : intérieures baissées vers le nez, et posées bas.
      const sy = oeilY - rOeil * 1.35;
      for (const cote of [-1, 1]) {
        const dx = ecart * cote;
        ctx.beginPath();
        ctx.moveTo(dx + lg * 0.55 * cote, sy - rOeil * 0.45);   // extérieur, haut
        ctx.lineTo(dx - lg * 0.55 * cote, sy + rOeil * 0.45);   // intérieur, bas
        ctx.stroke();
      }
    } else {
      // intrigué : l'un levé, l'autre droit — l'asymétrie fait tout
      const sy = oeilY - rOeil * 1.6;
      ctx.beginPath();
      ctx.moveTo(-ecart - lg * 0.5, sy - rOeil * 0.5);
      ctx.lineTo(-ecart + lg * 0.5, sy - rOeil * 0.15);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ecart - lg * 0.5, sy - rOeil * 0.1);
      ctx.lineTo(ecart + lg * 0.5, sy - rOeil * 0.1);
      ctx.stroke();
    }

    // --- bouche ---
    // La bouche ne contredit jamais les sourcils, elle les appuie. Elle reste
    // petite : le personnage fait douze pixels de haut, une grande bouche y
    // devient une tache.
    const by = oeilY + rOeil * 2.4;
    const bl = demi * 0.42;
    ctx.lineWidth = Math.max(1.8, demi * 0.1);
    ctx.strokeStyle = encre;
    ctx.beginPath();
    if (visee) {
      // bouche poussée sur le côté, comme on mord sa joue en ajustant
      ctx.moveTo(-bl * 0.1, by + bl * 0.06);
      ctx.quadraticCurveTo(bl * 0.22, by + bl * 0.02, bl * 0.46, by - bl * 0.12);
    } else if (affole) {
      // petite bouche ouverte qui tremble
      const t = Math.sin(temps * 18 + (p.tremble || 0)) * demi * 0.03;
      ctx.ellipse(0, by + t, bl * 0.3, bl * 0.4, 0, 0, TAU);
    } else if (inquiet) {
      // sage, à peine tombante : le visage dit l'inquiétude par les sourcils,
      // la bouche ne fait que ne pas la contredire
      ctx.moveTo(-bl * 0.34, by - bl * 0.04);
      ctx.quadraticCurveTo(0, by + bl * 0.1, bl * 0.34, by - bl * 0.04);
    } else if (acharne) {
      ctx.moveTo(-bl * 0.4, by + bl * 0.1);      // trait serré, un rien tombant
      ctx.quadraticCurveTo(0, by - bl * 0.12, bl * 0.4, by + bl * 0.1);
    } else {
      // intrigué : une vaguelette, ni sourire ni moue
      const t = Math.sin(temps * 2.5 + (p.tremble || 0)) * demi * 0.02;
      const w = bl * 0.52, h2 = bl * 0.34;
      ctx.moveTo(-w, by + t);
      ctx.quadraticCurveTo(-w * 0.5, by - h2 + t, 0, by + t);
      ctx.quadraticCurveTo(w * 0.5, by + h2 + t, w, by + t);
    }
    ctx.stroke();
    ctx.restore();
  }

  // Jusqu'où va le regard dans chaque direction du cône : on lance des rayons
  // et on s'arrête au premier mur. Sans ça un cône traversait la pierre et on
  // croyait se faire repérer à travers une cloison — la détection, elle, testait
  // déjà la ligne de vue, mais l'affichage mentait.
  // Un cône coupé par un mur n'est plus convexe, et une rastérisation logicielle
  // paie cher chaque segment. 22 -> 12 rayons : la marche d'escalier reste
  // lisible et le coût de dessin retombe.
  const RAYONS = 12;
  function portéesCone(wx, wy, angle, portee, demiAngle) {
    const out = new Array(RAYONS + 1);
    const pas = CASE * 0.22;
    for (let i = 0; i <= RAYONS; i++) {
      const a = angle - demiAngle + (2 * demiAngle * i) / RAYONS;
      const cx = Math.cos(a), cy = Math.sin(a);
      let d = 0;
      while (d + pas < portee) {
        if (solide(Math.floor((wx + cx * (d + pas)) / CASE), Math.floor((wy + cy * (d + pas)) / CASE))) break;
        d += pas;
      }
      // on s'arrête AVANT la pierre, pas dessus : garder le pas où le mur a été
      // trouvé faisait déborder chaque rayon d'un cran dans le mur
      out[i] = Math.min(d, portee);
    }
    return out;
  }

  // trace le polygone du cône réellement éclairé, en coordonnées écran
  function tracerCone(c, sx, sy, angle, demiAngle, portees) {
    c.beginPath();
    c.moveTo(sx, sy);
    for (let i = 0; i <= RAYONS; i++) {
      const a = angle - demiAngle + (2 * demiAngle * i) / RAYONS;
      c.lineTo(sx + Math.cos(a) * portees[i], sy + Math.sin(a) * portees[i]);
    }
    c.closePath();
  }

  function percerCone(c, wx, wy, angle, portee, demiAngle, force, dejaCalculees) {
    const portees = dejaCalculees || portéesCone(wx, wy, angle, portee, demiAngle);
    const x = wx - cam.x, y = wy - cam.y;
    const g = c.createRadialGradient(x, y, 0, x, y, portee);
    g.addColorStop(0, `rgba(0,0,0,${force})`);
    g.addColorStop(0.6, `rgba(0,0,0,${force * 0.7})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g;
    tracerCone(c, x, y, angle, demiAngle, portees);
    c.fill();
  }

  function percerDisque(c, x, y, r, force) {
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${force})`);
    g.addColorStop(0.62, `rgba(0,0,0,${force * 0.88})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  }

  // Le sol de TOUTES les cases à l'écran : le voile se charge de ne montrer que
  // ce qui est éclairé. Pas de brouillard de guerre — seule la lumière révèle.
  function dessinerSol(c0x, c1x, c0y, c1y) {
    ctx.fillStyle = '#1a1a26';
    for (let cy = c0y; cy <= c1y; cy++)
      for (let cx = c0x; cx <= c1x; cx++)
        if (!zone.mur[cy][cx]) ctx.fillRect(cx * CASE - cam.x, cy * CASE - cam.y, CASE + 1, CASE + 1);

    ctx.strokeStyle = 'rgba(255,255,255,0.13)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let cy = c0y; cy <= c1y; cy++) {
      for (let cx = c0x; cx <= c1x; cx++) {
        if (zone.mur[cy][cx]) continue;
        const x = cx * CASE - cam.x, y = cy * CASE - cam.y;
        if (solide(cx, cy - 1)) { ctx.moveTo(x, y); ctx.lineTo(x + CASE, y); }
        if (solide(cx, cy + 1)) { ctx.moveTo(x, y + CASE); ctx.lineTo(x + CASE, y + CASE); }
        if (solide(cx - 1, cy)) { ctx.moveTo(x, y); ctx.lineTo(x, y + CASE); }
        if (solide(cx + 1, cy)) { ctx.moveTo(x + CASE, y); ctx.lineTo(x + CASE, y + CASE); }
      }
    }
    ctx.stroke();

    // --- les battants ---
    for (const pt of zone.portes) {
      if (pt.cx < c0x - 1 || pt.cx > c1x + 1 || pt.cy < c0y - 1 || pt.cy > c1y + 1) continue;
      const x = pt.x - cam.x, y = pt.y - cam.y;
      const demi = CASE * 0.5;
      ctx.save();
      ctx.translate(x, y);
      if (pt.verticale) ctx.rotate(Math.PI / 2);
      // le battant pivote sur son gond : fermé il barre le couloir, ouvert il
      // se range le long de la paroi
      const angle = pt.ouverte * (Math.PI / 2) * 0.92;
      ctx.translate(-demi, 0);
      ctx.rotate(angle);
      const g = ctx.createLinearGradient(0, -demi * 0.2, 0, demi * 0.2);
      g.addColorStop(0, '#6a5640');
      g.addColorStop(1, '#3e3226');
      ctx.fillStyle = g;

      carreArrondi(ctx, 0, -CASE * 0.11, CASE * 0.96, CASE * 0.22, CASE * 0.06);
      ctx.fill();
      ctx.strokeStyle = 'rgba(214,186,140,0.55)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // poignée : elle dit de quel côté ça s'ouvre
      ctx.fillStyle = '#d6ba8c';
      ctx.beginPath();
      ctx.arc(CASE * 0.78, 0, CASE * 0.055, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  function dessinerManche() {
    if (!manche.actif) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(manche.ox, manche.oy, RAYON_MANCHE, 0, TAU); ctx.stroke();
    const kx = manche.ox + manche.dx * manche.force * RAYON_MANCHE;
    const ky = manche.oy + manche.dy * manche.force * RAYON_MANCHE;
    const g = ctx.createRadialGradient(kx, ky, 0, kx, ky, 26);
    g.addColorStop(0, rgba(forme().couleur, 0.5));
    g.addColorStop(1, rgba(forme().couleur, 0.06));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(kx, ky, 26, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba(forme().couleur, 0.6);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(kx, ky, 22, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // Les rayons d'un cône servaient au voile, à la lueur chaude ET à la jauge :
  // trois lancers identiques par cône et par frame. Mesuré sous throttle ×4,
  // ça coûtait 86 ms de frame contre 44 avant les cônes occultés. On les calcule
  // une fois ici, tout le reste s'en sert. Une portée plus courte se déduit par
  // un simple minimum, sans relancer quoi que ce soit.
  const raccourcir = (portees, portee) => portees.map((d) => Math.min(d, portee));

  function preparerRayons(eclaires, portee, cone) {
    if (portee) joueur.rayons = portéesCone(joueur.x, joueur.y, joueur.regard, portee, cone);
    for (const p of eclaires) {
      p.rayonsRelais = portéesCone(p.x, p.y, p.regard, D.portee * 5, D.cone + 0.05);
    }
    for (const p of zone.persos) {
      p.rayonsVue = null;
      if (p.emotion !== EMOTIONS.COLERE || p.aveugle > 0 || p.cligne > 0) continue;
      const traque = p.alerte > 0 || p.charge > 0.04;
      if (Math.hypot(p.x - joueur.x, p.y - joueur.y) > CASE * (traque ? 8 : 4.2)) continue;
      // hors écran : inutile de lancer les rayons ni de peindre quoi que ce soit
      const ex = p.x - cam.x, ey = p.y - cam.y, marge = PORTEE_VUE;
      if (ex < -marge || ey < -marge || ex > W + marge || ey > H + marge) continue;
      p.rayonsVue = portéesCone(p.x, p.y, p.regard, PORTEE_VUE, 0.42);
    }
  }

  function dessiner(temps, eclaires) {
    const f = forme();
    const r = rayonHalo();
    const portee = porteeFaisceau();
    const cone = coneFaisceau();
    preparerRayons(eclaires, portee, cone);

    ctx.fillStyle = '#08080e';
    ctx.fillRect(0, 0, W, H);

    const c0x = Math.max(0, Math.floor(cam.x / CASE));
    const c1x = Math.min(zone.cols - 1, Math.floor((cam.x + W) / CASE));
    const c0y = Math.max(0, Math.floor(cam.y / CASE));
    const c1y = Math.min(zone.lignes - 1, Math.floor((cam.y + H) / CASE));
    dessinerSol(c0x, c1x, c0y, c1y);

    // --- torches murales ---
    for (const t of zone.torches) {
      if (Math.hypot(t.x - joueur.x, t.y - joueur.y) < CASE * 3) t.vue = true;
      if (t.reste <= 0) continue;
      const k = clamp(t.reste / (t.duree * 0.35), 0, 1);
      const h = (14 + Math.sin(temps * 9 + t.phase) * 3) * (0.5 + k * 0.5);
      const g = ctx.createRadialGradient(t.x - cam.x, t.y - cam.y, 0, t.x - cam.x, t.y - cam.y, h * 1.9);
      g.addColorStop(0, 'rgba(255,235,190,0.95)');
      g.addColorStop(1, 'rgba(255,140,50,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(t.x - cam.x, t.y - cam.y, h * 1.9, 0, TAU); ctx.fill();
      if (Math.random() < 0.10) emettre(t.x, t.y, '#ffb45c', 1, 26);
    }

    // --- braises ---
    for (const b of zone.braises) {
      const s = 1 + Math.sin(temps * 5 + b.phase) * 0.12;
      const g = ctx.createRadialGradient(b.x - cam.x, b.y - cam.y, 0, b.x - cam.x, b.y - cam.y, 26 * s);
      g.addColorStop(0, 'rgba(255,226,170,0.95)');
      g.addColorStop(1, 'rgba(255,150,60,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x - cam.x, b.y - cam.y, 26 * s, 0, TAU); ctx.fill();
    }

    // --- sortie ---
    const ouverte = zone.sortie.ames >= zone.requis;
    const pulse = 1 + Math.sin(temps * 3) * 0.07;
    ctx.save();
    ctx.translate(zone.sortie.x - cam.x, zone.sortie.y - cam.y);
    ctx.strokeStyle = ouverte ? '#ffe9a8' : 'rgba(255,233,168,0.24)';
    ctx.lineWidth = ouverte ? 3.5 : 2;
    ctx.beginPath(); ctx.arc(0, 0, zone.sortie.r * pulse, 0, TAU); ctx.stroke();
    ctx.fillStyle = ouverte ? 'rgba(255,233,168,0.34)' : 'rgba(255,233,168,0.06)';
    ctx.beginPath(); ctx.arc(0, 0, zone.sortie.r * 0.5, 0, TAU); ctx.fill();
    ctx.restore();

    // --- lueurs ---
    for (const l of zone.lueurs) {
      if (l.prise) continue;
      const b = BONUS[l.type];
      const s = 1 + Math.sin(temps * 4 + l.phase) * 0.18;
      const g = ctx.createRadialGradient(l.x - cam.x, l.y - cam.y, 0, l.x - cam.x, l.y - cam.y, 13 * s);
      g.addColorStop(0, rgba(b.couleur, 0.95));
      g.addColorStop(1, rgba(b.couleur, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(l.x - cam.x, l.y - cam.y, 13 * s, 0, TAU); ctx.fill();
      ctx.fillStyle = b.couleur;
      ctx.beginPath();
      if (l.type === 'eclat') ctx.arc(l.x - cam.x, l.y - cam.y, 4.5 * s, 0, TAU);
      else {                                   // les spéciales sont des losanges
        const k = 6.5 * s;
        ctx.moveTo(l.x - cam.x, l.y - cam.y - k);
        ctx.lineTo(l.x - cam.x + k, l.y - cam.y);
        ctx.lineTo(l.x - cam.x, l.y - cam.y + k);
        ctx.lineTo(l.x - cam.x - k, l.y - cam.y);
      }
      ctx.fill();
    }

    // --- bonhommes, coléreux au-dessus ---
    const ordre = [...zone.persos].filter((q) => !q.livre).sort((a, b) =>
      (a.emotion === EMOTIONS.COLERE ? 1 : 0) - (b.emotion === EMOTIONS.COLERE ? 1 : 0));
    for (const p of ordre) {
      const couleur = p.calme ? '#a8f0c8' : COULEURS[p.emotion];
      const repere = p.emotion === EMOTIONS.COLERE && (p.alerte > 0 || p.charge > 0.04);
      dessinerTete(p, couleur, D.taille, p.eclaire || p.calme || repere, 1, p.humeur, temps);
    }

    // --- le joueur : exactement la règle des âmes, pas une autre ---
    // Il court : acharné. Il marche : intrigué. Un rouge cherche, ou on le
    // tient dans un faisceau : peur. Son niveau de forme n'y change rien —
    // une émotion vient de ce qui arrive, pas d'un palier de progression.
    const humeurJoueur = humeurDuJoueur();
    // un bonus actif teinte le corps et, pour « voilé », le rend translucide :
    // c'est ce qui fait comprendre l'effet sans lire un mot
    const teinte = joueur.bonus ? BONUS[joueur.bonus].couleur : f.couleur;
    const opac = aBonus('souffle') ? 0.5 : 1;
    dessinerTete(joueur, teinte, D.taille * 1.06, true, opac, humeurJoueur, temps);

    // --- cailloux en vol : une ombre au sol et le caillou en l'air ---
    for (const c of cailloux) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(c.x - cam.x, c.y - cam.y, 4, 2, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#cdd3e0';
      ctx.beginPath(); ctx.arc(c.x - cam.x, c.y - cam.y - c.hauteur, 3.4, 0, TAU); ctx.fill();
    }

    // --- ondes de choc ---
    for (const o of ondes) {
      ctx.strokeStyle = rgba(o.couleur, clamp(1 - o.r / o.max, 0, 1) * 0.6);
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(o.x - cam.x, o.y - cam.y, o.r, 0, TAU); ctx.stroke();
    }

    // --- particules ---
    for (const q of particules) {
      const a = clamp(q.vie / q.max, 0, 1);
      ctx.fillStyle = rgba(q.couleur, a * 0.9);
      if (q.forme === 'trait') ctx.fillRect(q.x - cam.x - 1, q.y - cam.y - 4, 2, 8);
      else { ctx.beginPath(); ctx.arc(q.x - cam.x, q.y - cam.y, 2.6 * a + 0.7, 0, TAU); ctx.fill(); }
    }

    /* ---- calque d'obscurité ---- */
    lctx.setTransform(DPR * QLUM, 0, 0, DPR * QLUM, 0, 0);
    lctx.globalCompositeOperation = 'source-over';
    lctx.fillStyle = 'rgba(8,8,14,0.975)';
    lctx.fillRect(0, 0, W, H);
    lctx.globalCompositeOperation = 'destination-out';

    const jx = joueur.x - cam.x, jy = joueur.y - cam.y;
    percerDisque(lctx, jx, jy, r, 1);
    if (portee) percerCone(lctx, joueur.x, joueur.y, joueur.regard, portee, cone, 0.95, joueur.rayons);
    for (const p of eclaires) percerCone(lctx, p.x, p.y, p.regard, D.portee * 5, D.cone + 0.05, 0.85, p.rayonsRelais);
    for (const b of zone.braises) percerDisque(lctx, b.x - cam.x, b.y - cam.y, b.r, 0.92);
    // Un calmé n'est pas qu'un faisceau : son corps et un petit halo restent
    // éclairés, sinon on ne voit qu'un cône sortir du néant.
    for (const p of zone.persos) {
      if (p.calme) percerDisque(lctx, p.x - cam.x, p.y - cam.y, D.taille * 2.1, 0.95);
      // Une sentinelle qui t'a repéré se montre en entier : c'est le signal le
      // plus important du jeu, il ne doit pas rester caché dans le noir.
      else if (p.emotion === EMOTIONS.COLERE && (p.alerte > 0 || p.charge > 0.04)) {
        percerDisque(lctx, p.x - cam.x, p.y - cam.y, D.taille * 1.7, 0.95);
      }
    }
    for (const t of zone.torches) {
      if (t.reste <= 0) continue;
      const k = clamp(t.reste / (t.duree * 0.35), 0, 1);       // elle faiblit en mourant
      percerDisque(lctx, t.x - cam.x, t.y - cam.y, t.r * (0.55 + k * 0.45), 0.9);
    }
    // Le cône d'une sentinelle n'apparaît que DE PRÈS. De loin on ne voit que
    // ses yeux, et on ignore encore si c'est un ami ou une sentinelle : c'est
    // tout le suspense. D'assez près pour réagir, il se montre.
    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE || p.aveugle > 0 || p.cligne > 0) continue;
      const dj = Math.hypot(p.x - joueur.x, p.y - joueur.y);
      const traque = p.alerte > 0 || p.charge > 0.04;
      // Traquée, elle ne se cache plus : son faisceau devient franchement
      // visible et de plus loin. Discrète, elle ne fait que se deviner de près,
      // pour garder le suspense des yeux dans le noir.
      if (!p.rayonsVue) continue;
      const proximite = clamp(1 - (dj - CASE * 2.6) / (CASE * 1.6), 0, 1);
      const force = traque ? 0.72 : 0.14 + proximite * 0.2;
      percerCone(lctx, p.x, p.y, p.regard, PORTEE_VUE, 0.42, force, p.rayonsVue);
    }
    lctx.globalCompositeOperation = 'source-over';

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(lum, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    /* ---- ce qui reste visible par-dessus l'obscurité ---- */
    // On se souvient des OBJETS, jamais du terrain : le fil qu'on a tracé, les
    // lueurs déjà aperçues, la sortie une fois trouvée. Assez pour ne pas être
    // perdu, trop peu pour connaître le plan.
    if (fil.length > 1) {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let i = 1; i < fil.length; i++) {
        // un `null` marque une téléportation (mort puis réapparition au seuil) :
        // relier les deux traçait un trait droit à travers les murs
        if (!fil[i] || !fil[i - 1]) continue;
        const t = i / fil.length;
        ctx.strokeStyle = rgba(f.couleur, 0.04 + t * 0.16);
        ctx.lineWidth = 1 + t * 1.6;
        ctx.beginPath();
        ctx.moveTo(fil[i - 1].x - cam.x, fil[i - 1].y - cam.y);
        ctx.lineTo(fil[i].x - cam.x, fil[i].y - cam.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    for (const l of zone.lueurs) {
      if (l.prise || !l.vue) continue;
      ctx.fillStyle = rgba(BONUS[l.type].couleur, 0.42);
      ctx.beginPath(); ctx.arc(l.x - cam.x, l.y - cam.y, 3.2, 0, TAU); ctx.fill();
    }
    for (const b of zone.braises) {
      ctx.strokeStyle = 'rgba(255,196,120,0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(b.x - cam.x, b.y - cam.y, 9, 0, TAU); ctx.stroke();
    }

    // Les torches éteintes restent devinables une fois croisées : ce sont des
    // repères, et savoir où rallumer fait partie du jeu.
    for (const t of zone.torches) {
      if (t.reste > 0 || !t.vue) continue;
      ctx.strokeStyle = 'rgba(255,180,92,0.22)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(t.x - cam.x, t.y - cam.y - 7);
      ctx.lineTo(t.x - cam.x, t.y - cam.y + 7);
      ctx.stroke();
    }

    // LES YEUX DANS LE NOIR. La seule chose qu'on distingue d'un inconnu. On
    // garde EXACTEMENT la géométrie des yeux éclairés — blanc de l'œil et
    // pupille décalée par le regard — pour que ce soit le même personnage, juste
    // sans son corps.
    // Mesuré : 57 % des PNJ à l'écran étaient masqués par un mur, ce qui vidait
    // l'effet. À travers une paroi ils restent perceptibles, mais bien plus
    // faibles et de moins loin : on sent une présence, on ne cartographie pas.
    for (const p of zone.persos) {
      const dj = Math.hypot(p.x - joueur.x, p.y - joueur.y);
      if (p.eclaire || estEclaire(p.x, p.y)) continue;
      if (p.cligne > 0 || p.aveugle > 0) continue;
      const cache = !vueLibre(p.x, p.y, joueur.x, joueur.y);
      const portee = cache ? CASE * 5 : CASE * 9;
      if (dj > portee) continue;

      const demi = D.taille * 0.5;
      const ecart = demi * 0.36;
      const oeilY = -demi * 0.14;
      const rOeil = demi * 0.22;
      const px = Math.cos(p.regard) * rOeil * 0.42;
      const py = Math.sin(p.regard) * rOeil * 0.42;
      const a = (clamp(1 - dj / portee, 0, 1) * 0.5 + 0.35) * (cache ? 0.34 : 1);

      for (const dx of [-ecart, ecart]) {
        const ox = p.x - cam.x + dx, oy = p.y - cam.y + oeilY;
        // la lueur autour de l'œil, qui le fait exister dans le noir
        const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, rOeil * 3.2);
        g.addColorStop(0, `rgba(226,232,246,${a * 0.55})`);
        g.addColorStop(1, 'rgba(226,232,246,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(ox, oy, rOeil * 3.2, 0, TAU); ctx.fill();
        // blanc de l'œil + pupille : la même forme que de jour
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.beginPath(); ctx.arc(ox, oy, rOeil, 0, TAU); ctx.fill();
        ctx.fillStyle = `rgba(10,10,16,${a})`;
        ctx.beginPath(); ctx.arc(ox + px, oy + py, rOeil * 0.5, 0, TAU); ctx.fill();
      }
    }

    // La jauge de chaque sentinelle, dessinée DANS son cône : il se remplit
    // depuis la pointe tant qu'on est dedans, et se vide dès qu'on en sort.
    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE || p.charge <= 0.01) continue;
      const portee = PORTEE_VUE * p.charge;
      const g = ctx.createRadialGradient(p.x - cam.x, p.y - cam.y, 0, p.x - cam.x, p.y - cam.y, portee);
      g.addColorStop(0, `rgba(255,60,50,${0.06 + p.charge * 0.14})`);
      g.addColorStop(0.72, `rgba(255,66,52,${0.12 + p.charge * 0.3})`);
      g.addColorStop(1, `rgba(255,86,66,${0.2 + p.charge * 0.45})`);
      const pj = p.rayonsVue ? raccourcir(p.rayonsVue, portee)
                             : portéesCone(p.x, p.y, p.regard, portee, 0.42);
      // Le front n'est plus un trait : le dégradé s'assombrit vers l'extérieur,
      // donc la limite se lit comme une zone dense qui avance vers toi. Tout
      // reste du faisceau, rien n'est un contour.
      ctx.fillStyle = g;
      tracerCone(ctx, p.x - cam.x, p.y - cam.y, p.regard, 0.42, pj);
      ctx.fill();
    }
    if (zone.sortie.vue) {
      ctx.strokeStyle = ouverte ? 'rgba(255,233,168,0.65)' : 'rgba(255,233,168,0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(zone.sortie.x - cam.x, zone.sortie.y - cam.y, zone.sortie.r * pulse, 0, TAU);
      ctx.stroke();
      // une fois le quota atteint, une flèche au bord de l'écran pour ne pas
      // finir la zone à errer
      if (ouverte) flecheVers(zone.sortie.x, zone.sortie.y, '#ffe9a8', temps);
    }

    /* ---- halo chaud ---- */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const couleurLumiere = joueur.bonus ? BONUS[joueur.bonus].couleur : f.couleur;
    const chaud = ctx.createRadialGradient(jx, jy, 0, jx, jy, r);
    chaud.addColorStop(0, rgba(couleurLumiere, 0.16));
    chaud.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = chaud;
    ctx.beginPath(); ctx.arc(jx, jy, r, 0, TAU); ctx.fill();

    if (portee) {
      const gf = ctx.createRadialGradient(jx, jy, 0, jx, jy, portee);
      gf.addColorStop(0, rgba(couleurLumiere, 0.14));
      gf.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gf;
      tracerCone(ctx, jx, jy, joueur.regard, cone, joueur.rayons);
      ctx.fill();
    }
    for (const b of zone.braises) {
      const gb = ctx.createRadialGradient(b.x - cam.x, b.y - cam.y, 0, b.x - cam.x, b.y - cam.y, b.r);
      gb.addColorStop(0, 'rgba(255,190,110,0.17)');
      gb.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gb;
      ctx.beginPath(); ctx.arc(b.x - cam.x, b.y - cam.y, b.r, 0, TAU); ctx.fill();
    }
    // le balayage rouge, en lumière additive : sans ça ce n'était qu'un trou
    // dans l'obscurité, on ne le lisait pas comme un faisceau
    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE || p.aveugle > 0 || p.cligne > 0) continue;
      if (!p.rayonsVue) continue;
      const traque = p.alerte > 0 || p.charge > 0.04;
      const pr = PORTEE_VUE;
      const gr = ctx.createRadialGradient(p.x - cam.x, p.y - cam.y, 0, p.x - cam.x, p.y - cam.y, pr);
      gr.addColorStop(0, `rgba(255,90,74,${traque ? 0.2 : 0.07})`);
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      const portees = p.rayonsVue;
      // traquée, la jauge dessine déjà un cône coloré par-dessus : inutile d'en
      // peindre un second, c'est un polygone dégradé plein écran de gagné
      if (!traque) {
        ctx.fillStyle = gr;
        tracerCone(ctx, p.x - cam.x, p.y - cam.y, p.regard, 0.42, portees);
        ctx.fill();
      }
      // Pas de contour : tout doit rester du faisceau. Traquée, le cône est
      // simplement plus dense — la jauge par-dessus fait le reste.
      if (traque) {
        const g2 = ctx.createRadialGradient(p.x - cam.x, p.y - cam.y, 0, p.x - cam.x, p.y - cam.y, pr);
        g2.addColorStop(0, 'rgba(255,96,78,0.17)');
        g2.addColorStop(1, 'rgba(255,96,78,0)');
        ctx.fillStyle = g2;
        tracerCone(ctx, p.x - cam.x, p.y - cam.y, p.regard, 0.42, portees);
        ctx.fill();
      }
    }
    for (const p of zone.persos) {
      if (!p.calme) continue;
      const rc = D.taille * 2.1;
      const gc = ctx.createRadialGradient(p.x - cam.x, p.y - cam.y, 0, p.x - cam.x, p.y - cam.y, rc);
      gc.addColorStop(0, 'rgba(168,240,200,0.2)');
      gc.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gc;
      ctx.beginPath(); ctx.arc(p.x - cam.x, p.y - cam.y, rc, 0, TAU); ctx.fill();
    }
    for (const t of zone.torches) {
      if (t.reste <= 0) continue;
      const k = clamp(t.reste / (t.duree * 0.35), 0, 1);
      const rt = t.r * (0.55 + k * 0.45);
      const gt = ctx.createRadialGradient(t.x - cam.x, t.y - cam.y, 0, t.x - cam.x, t.y - cam.y, rt);
      gt.addColorStop(0, 'rgba(255,180,92,0.19)');
      gt.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gt;
      ctx.beginPath(); ctx.arc(t.x - cam.x, t.y - cam.y, rt, 0, TAU); ctx.fill();
    }
    for (const p of eclaires) {
      const pp = D.portee * 5;
      const gp = ctx.createRadialGradient(p.x - cam.x, p.y - cam.y, 0, p.x - cam.x, p.y - cam.y, pp);
      // un calmé éclaire en vert : c'est une lampe que le joueur a allumée,
      // elle doit se distinguer d'un simple relais de passage
      gp.addColorStop(0, rgba(p.calme ? '#a8f0c8' : COULEURS[p.emotion], p.calme ? 0.2 : 0.16));
      gp.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gp;
      tracerCone(ctx, p.x - cam.x, p.y - cam.y, p.regard, D.cone, p.rayonsRelais);
      ctx.fill();
    }
    ctx.restore();

    // on se fait fixer : le bord de l'écran rougit
    const alerte = joueur.vu * (1 - joueur.souffle * 0.55);
    if (alerte > 0.02) {
      // concentré sur le bord : au centre on doit continuer à voir le jeu
      const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.62);
      v.addColorStop(0, 'rgba(255,60,50,0)');
      v.addColorStop(1, `rgba(255,60,50,${clamp(alerte * 0.3, 0, 0.3)})`);
      ctx.fillStyle = v;
      ctx.fillRect(0, 0, W, H);
    }

    dessinerManche();
    dessinerVisee();
  }

  function flecheVers(wx, wy, couleur, temps) {
    const x = wx - cam.x, y = wy - cam.y;
    if (x > 30 && x < W - 30 && y > 80 && y < H - 30) return;   // déjà à l'écran
    const a = Math.atan2(y - H / 2, x - W / 2);
    const rx = Math.min(W, H) * 0.38;
    const px = W / 2 + Math.cos(a) * rx, py = H / 2 + Math.sin(a) * rx;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(a);
    ctx.fillStyle = rgba(couleur, 0.5 + Math.sin(temps * 4) * 0.2);
    ctx.beginPath();
    ctx.moveTo(12, 0); ctx.lineTo(-8, 7); ctx.lineTo(-8, -7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* ==================================================== interface ======== */

  let toastT = 0;
  function montrerToast(texte, couleur) {
    elToast.textContent = texte;
    elToast.style.color = couleur || '#ffb4a8';
    elToast.style.borderColor = couleur ? rgba(couleur, 0.45) : 'rgba(255,122,107,0.4)';
    elToast.style.background = couleur ? rgba(couleur, 0.14) : 'rgba(255,122,107,0.16)';
    elToast.classList.add('on');
    toastT = 2.8;
  }

  let flashEnCours = false;
  function montrerFlash(titre, texte, couleur, surtitre) {
    el('flash-sur').textContent = surtitre || '';
    el('flash-titre').textContent = titre;
    el('flash-titre').style.color = couleur;
    el('flash-texte').textContent = texte;
    elFlash.classList.add('on');
    flashEnCours = true;
    manche.actif = false;
    manche.force = 0;
  }
  el('flash-ok').addEventListener('click', () => {
    elFlash.classList.remove('on');
    flashEnCours = false;
  });

  function majInterface() {
    const f = forme();
    const suivant = FORMES[joueur.niveau + 1];
    const bas = f.seuil;
    const haut = suivant ? suivant.seuil : f.seuil + 60;
    elForme.textContent = f.nom;
    elForme.style.color = f.couleur;
    elBarre.style.width = `${clamp((joueur.eclat - bas) / (haut - bas), 0, 1) * 100}%`;
    elBarre.style.background = f.couleur;
    elZone.textContent = `ZONE ${zone.numero} · ${zone.sortie.ames}/${zone.requis} âmes`;

    if (joueur.bonus && joueur.bonusT > 0) {
      const b = BONUS[joueur.bonus];
      elBonus.classList.add('on');
      elBonus.style.color = b.couleur;
      elBonusNom.textContent = b.nom;
      elBonusJauge.style.width = `${clamp(joueur.bonusT / b.duree, 0, 1) * 46}px`;
    } else {
      elBonus.classList.remove('on');
    }
  }

  /* ==================================================== zones ============ */

  function chargerZone(numero) {
    // Les lueurs spéciales ne dépendent plus de la forme courante — elle repart
    // à zéro à chaque zone — mais du NUMÉRO de zone : la variété s'ouvre au fil
    // de l'aventure, la puissance se regagne à chaque fois.
    const z = genererZone(grain, numero, Math.min(FORMES.length - 1, numero));
    if (!z) return;
    zone = z;
    numeroZone = numero;
    priseCount = 0;
    particules = [];
    ondes = [];
    cailloux = [];
    fil = [];
    // On redevient peureux à chaque nouvelle zone : tout se regagne sur place.
    joueur.eclat = 0; joueur.sommet = 0; joueur.niveau = 0;
    joueur.bonus = null; joueur.bonusT = 0;
    joueur.souffle = 1; joueur.repit = 0;
    joueur.galets = CAILLOU[0].reserve; joueur.caillouDispo = 0;
    joueur.x = zone.depart.x;
    joueur.y = zone.depart.y;
    joueur.vx = joueur.vy = 0;
    filDernier = { x: joueur.x, y: joueur.y };
    cadrer(true);
    majBoutons();
    majInterface();
  }

  function zoneSuivante() {
    const n = numeroZone + 1;
    chargerZone(n);
    montrerFlash(`Zone ${n}`,
      "Plus grand, plus peuplé — et tu y entres peureux. Tout se regagne ici : ramasse, calme, remonte.",
      '#ffe9a8', 'Nouveau territoire');
  }

  function cadrer(immediat) {
    const cx = clamp(joueur.x - W / 2, 0, Math.max(0, zone.largeur - W));
    const cy = clamp(joueur.y - H / 2, 0, Math.max(0, zone.hauteur - H));
    if (immediat) { cam.x = cx; cam.y = cy; return; }
    cam.x += (cx - cam.x) * 0.14;
    cam.y += (cy - cam.y) * 0.14;
  }

  /* ==================================================== boucle =========== */

  function surveillerCadence(dt) {
    if (palier >= PALIERS.length - 1) return;
    fenetre.push(dt);
    if (fenetre.length < 90) return;
    const median = [...fenetre].sort((a, b) => a - b)[45];
    fenetre = [];
    if (median > 0.022) { palier++; redimensionner(); }
  }

  function redimensionner() {
    DPR = Math.min(window.devicePixelRatio || 1, PALIERS[palier]);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    lum.width = Math.ceil(canvas.width * QLUM);
    lum.height = Math.ceil(canvas.height * QLUM);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    D = dims();
  }

  let dernier = performance.now();

  function boucle(maintenant) {
    requestAnimationFrame(boucle);
    const dt = Math.min((maintenant - dernier) / 1000, 1 / 30);
    dernier = maintenant;
    const temps = maintenant / 1000;
    if (!zone) return;

    if (manche.actif) surveillerCadence(dt);
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) elToast.classList.remove('on'); }

    if (!flashEnCours) {
      majPortes(dt);              // avant tout le reste : `solide` doit être stable
      majJoueur(dt);
      const eclaires = propager();
      majPersos(dt, temps, eclaires);
      majRegles(dt);
      majCailloux(dt);
      majParticules(dt);
      cadrer(false);
      majInterface();
      dessiner(temps, eclaires);
    } else {
      dessiner(temps, new Set());
    }
  }

  /* ==================================================== entrées ========== */

  // Joystick flottant : il naît exactement sous le doigt, où qu'on le pose.
  function pointCanvas(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function majManche(p) {
    const dx = p.x - manche.ox, dy = p.y - manche.oy;
    const d = Math.hypot(dx, dy);
    manche.force = clamp(d / RAYON_MANCHE, 0, 1);
    if (d > 0.01) { manche.dx = dx / d; manche.dy = dy / d; }
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (manche.id !== null) return;
    canvas.setPointerCapture(e.pointerId);
    const p = pointCanvas(e);
    manche.id = e.pointerId;
    manche.actif = true;
    manche.ox = p.x; manche.oy = p.y;
    manche.dx = 0; manche.dy = 0; manche.force = 0;
    elHint.style.opacity = '0';
  });

  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerId !== manche.id) return;
    majManche(pointCanvas(e));
  });

  ['pointerup', 'pointercancel'].forEach((t) =>
    canvas.addEventListener(t, (e) => {
      if (e.pointerId !== manche.id) return;
      manche.actif = false;
      manche.force = 0;
      manche.id = null;
    }));

  // Un seul bouton, et il garde le doigt : on appuie, on glisse pour viser, on
  // relâche pour lancer. Mesuré, un `click` n'agirait qu'au relâchement — ici
  // c'est voulu, puisque c'est le relâchement qui valide la direction.
  elCaillou.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    if (elCaillou.disabled || visee.id !== null) return;
    elCaillou.setPointerCapture(e.pointerId);
    visee.id = e.pointerId; visee.actif = true;
    visee.ox = e.clientX; visee.oy = e.clientY;
    visee.dx = Math.cos(joueur.regard); visee.dy = Math.sin(joueur.regard);
    visee.force = 0.55;
  });
  elCaillou.addEventListener('pointermove', (e) => {
    if (e.pointerId !== visee.id) return;
    const dx = e.clientX - visee.ox, dy = e.clientY - visee.oy;
    const d = Math.hypot(dx, dy);
    if (d > 8) { visee.dx = dx / d; visee.dy = dy / d; visee.force = clamp(d / 110, 0.15, 1); }
  });
  // Le lancer part au RELÂCHEMENT, jamais à l'appui : c'est ce qui laisse
  // ajuster la direction tant que le doigt est posé.
  elCaillou.addEventListener('pointerup', (e) => {
    if (e.pointerId !== visee.id) return;
    visee.id = null; visee.actif = false;
    lancerCaillou(Math.atan2(visee.dy, visee.dx), visee.force);
  });
  // Une annulation n'est pas un lâcher : on abandonne la visée sans rien lancer.
  elCaillou.addEventListener('pointercancel', (e) => {
    if (e.pointerId !== visee.id) return;
    visee.id = null; visee.actif = false;
  });
  elCaillou.addEventListener('click', (e) => e.preventDefault());

  window.addEventListener('resize', () => {
    redimensionner();
    if (zone) cadrer(true);
  });

  redimensionner();
  chargerZone(1);
  requestAnimationFrame(boucle);

  // Exposé pour les mesures automatisées. L'accessibilité du plan se vérifie
  // exactement — parcours en largeur sur la grille — et c'est précisément ce
  // que le solveur de lumière du mode puzzle ne savait qu'approximer.
  window.__lux = {
    info: () => zone && {
      zone: zone.numero, grain: zone.grain,
      cols: zone.cols, lignes: zone.lignes, salles: zone.salles.length,
      lueurs: zone.lueurs.length, requis: zone.requis,
      ames: zone.sortie.ames, convoi: zone.persos.filter((q) => q.suit && !q.livre).length,
      calmables: zone.persos.filter((q) => q.emotion !== EMOTIONS.COLERE && !q.livre).length,
      speciales: zone.lueurs.filter((l) => l.type !== 'eclat').length,
      persos: zone.persos.length, longueur: zone.longueur,
      niveau: joueur.niveau, eclat: Math.round(joueur.eclat), prises: priseCount,
      galets: joueur.galets, posees: zone.braises.length,
      souffle: +joueur.souffle.toFixed(2),
    },
    accessible: () => {
      const d = distances(zone, { cx: Math.floor(zone.depart.x / CASE), cy: Math.floor(zone.depart.y / CASE) });
      const ok = (p) => {
        const cx = Math.floor(p.x / CASE), cy = Math.floor(p.y / CASE);
        return d[cy] && d[cy][cx] >= 0;
      };
      return { sortie: ok(zone.sortie), lueurs: zone.lueurs.every(ok), persos: zone.persos.every(ok) };
    },
    charger: chargerZone,
    graine: (g) => { grain = g; chargerZone(1); },
    joueur: () => ({ ...joueur }),
    toast: () => elToast.classList.contains('on'),
    // pousse le joystick vers un point du monde, comme un doigt le ferait
    viser: (wx, wy) => {
      const dx = wx - joueur.x, dy = wy - joueur.y;
      const d = Math.hypot(dx, dy) || 1;
      manche.actif = true; manche.id = -1;
      manche.ox = W / 2; manche.oy = H / 2;
      manche.dx = dx / d; manche.dy = dy / d;
      manche.force = 1;
    },
    lacher: () => { manche.actif = false; manche.force = 0; manche.id = null; },
    manche: () => ({ ...manche }),
    monter: (n) => {
      joueur.sommet = joueur.eclat = n;
      joueur.niveau = 0;
      for (let i = 0; i < FORMES.length; i++) evoluer();
      elFlash.classList.remove('on'); flashEnCours = false;
      majBoutons();
    },
    humeurJoueur: humeurDuJoueur,
    // dessine un visage agrandi sur le canvas du jeu, avec le vrai code
    dessinerVisageTest: (ecranX, ecranY, taille, humeur, couleur) =>
      dessinerTete({ x: cam.x + ecranX, y: cam.y + ecranY, sx: 1, sy: 1,
                     regard: -Math.PI / 2, tremble: 0, aveugle: 0, cligne: 0 },
                   couleur, taille, true, 1, humeur, 0.3),
    menace: () => menace,
    solide: (x, y) => solide(Math.floor(x / CASE), Math.floor(y / CASE)),
    vueLibre,
    lancerCaillou,
    // fait retomber un caillou à un endroit précis : c'est le vrai code
    // d'impact, pas une imitation
    bruit: (x, y) => toucherLeSol({ x1: x, y1: y, rang: rangCaillou() }),
    visee: () => ({ ...visee }),
    recharger: () => { joueur.galets = rangCaillou().reserve; joueur.caillouDispo = 0; majBoutons(); },
    cailloux: () => cailloux,
    porteesCone: portéesCone,
    CASE: () => CASE,
    regarder: (a) => { joueur.regard = a; },
    cheminInterne: (x0, y0, x1, y1) => routeVers(x0, y0, x1, y1),
    fil: () => fil,
    estEclaire,
    // pour chaque PNJ à portée d'écran : ses yeux sont-ils dessinés, et sinon pourquoi
    diagYeux: () => zone.persos.map((p) => {
      const dj = Math.hypot(p.x - joueur.x, p.y - joueur.y);
      const cache = !vueLibre(p.x, p.y, joueur.x, joueur.y);
      const portee = cache ? CASE * 5 : CASE * 9;
      return {
        emotion: p.emotion, cases: +(dj / CASE).toFixed(1), cache,
        horsPortee: dj > portee,
        dejaEclaire: p.eclaire || estEclaire(p.x, p.y),
        cligne: p.cligne > 0, aveugle: p.aveugle > 0,
        aEcran: Math.abs(p.x - joueur.x) < W / 2 + 40 && Math.abs(p.y - joueur.y) < H / 2 + 40,
      };
    }),
    soigner: () => { joueur.souffle = 1; joueur.repit = 0; },
    poser: (x, y) => { joueur.x = x; joueur.y = y; joueur.vx = joueur.vy = 0; cadrer(true); },
    // ce que la boucle de drain calcule réellement, pour un perso donné
    sonde: (q) => ({
      emotion: q.emotion, aveugle: +q.aveugle.toFixed(1), alerte: +q.alerte.toFixed(2),
      regard: +q.regard.toFixed(3),
      angleVersJoueur: +Math.atan2(joueur.y - q.y, joueur.x - q.x).toFixed(3),
      ecart: +Math.abs(ecartAngle(q.regard, Math.atan2(joueur.y - q.y, joueur.x - q.x))).toFixed(3),
      dist: Math.round(Math.hypot(joueur.x - q.x, joueur.y - q.y)),
      dansCone: dansLeCone(q.x, q.y, q.regard, joueur.x, joueur.y, PORTEE_VUE, 0.42),
      vueLibre: vueLibre(q.x, q.y, joueur.x, joueur.y),
      abri: prochedUneBraise(joueur.x, joueur.y, 1),
    }),
    tuer: () => eteindre(),
    chemin: (wx, wy) => {
      const dep = { cx: Math.floor(joueur.x / CASE), cy: Math.floor(joueur.y / CASE) };
      const d = distances(zone, dep);
      let cx = Math.floor(wx / CASE), cy = Math.floor(wy / CASE);
      if (!d[cy] || d[cy][cx] < 0) return null;
      const route = [];
      while (d[cy][cx] > 0) {
        route.push([(cx + 0.5) * CASE, (cy + 0.5) * CASE]);
        const n = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]
          .filter(([x, y]) => d[y] !== undefined && d[y][x] >= 0);
        const suivant = n.reduce((a, [x, y]) => (d[y][x] < d[a[1]][a[0]] ? [x, y] : a), n[0]);
        cx = suivant[0]; cy = suivant[1];
      }
      return route.reverse();
    },
    etat: () => zone,
  };
})();
</script>
</body>
</html>

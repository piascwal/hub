<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lux &amp; Paranoia</title>
<meta name="description" content="Aventure procédurale dans le noir : un petit peureux qui grandit en lumière, change de couleur et gagne un faisceau.">
<meta name="theme-color" content="#08080e">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    background: #08080e;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #e8e8f0;
    -webkit-user-select: none;
    user-select: none;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---- interface ---- */

  .hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: max(0.7rem, env(safe-area-inset-top)) 0.8rem 0.7rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    pointer-events: none;
    z-index: 10;
  }

  .hud > * { pointer-events: auto; }

  .back {
    color: rgba(232, 232, 240, 0.55);
    text-decoration: none;
    font-size: 0.95rem;
    padding: 0.35rem 0.55rem;
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.05);
  }

  .zone {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: rgba(232, 232, 240, 0.4);
    font-variant-numeric: tabular-nums;
  }

  .btn {
    font: inherit;
    font-size: 0.85rem;
    color: #e8e8f0;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    padding: 0.4rem 0.85rem;
    cursor: pointer;
  }

  .btn:active { background: rgba(255, 255, 255, 0.14); }

  /* jauge d'éclat : la seule ressource du jeu */
  .jauge {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .forme {
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    transition: color 0.4s ease;
  }

  .barre {
    width: 92px;
    height: 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.09);
    overflow: hidden;
  }

  .barre i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 999px;
    transition: width 0.18s linear, background 0.4s ease;
  }

  /* bouton de charge, apparaît à la troisième forme */
  .charge {
    position: fixed;
    right: max(1rem, env(safe-area-inset-right));
    bottom: max(1.6rem, env(safe-area-inset-bottom));
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border: 2px solid rgba(255, 154, 107, 0.5);
    background: rgba(255, 154, 107, 0.12);
    color: #ff9a6b;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    z-index: 12;
    display: none;
    cursor: pointer;
  }

  .charge.on { display: block; }
  .charge:disabled { opacity: 0.32; }
  .charge:active:not(:disabled) { background: rgba(255, 154, 107, 0.3); }

  .hint {
    position: fixed;
    left: 0; right: 0;
    bottom: max(1.1rem, env(safe-area-inset-bottom));
    /* dégagé du bouton de charge, qui occupe le coin bas droit */
    padding: 0 6.5rem 0 1.2rem;
    text-align: center;
    font-size: 0.85rem;
    line-height: 1.45;
    color: rgba(232, 232, 240, 0.5);
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.5s ease;
  }

  /* bandeau passager : il informe sans arrêter le jeu */
  .toast {
    position: fixed;
    left: 50%;
    top: 22%;
    transform: translateX(-50%);
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    background: rgba(255, 122, 107, 0.16);
    border: 1px solid rgba(255, 122, 107, 0.4);
    color: #ffb4a8;
    font-size: 0.85rem;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 14;
  }

  .toast.on { opacity: 1; }

  /* bandeau d'évolution et de passage de zone */
  .flash {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    text-align: center;
    padding: 2rem;
    background: rgba(8, 8, 14, 0.74);
    backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .flash.on { opacity: 1; pointer-events: auto; }
  .flash strong { font-size: 1.7rem; letter-spacing: 0.02em; }
  .flash p { font-size: 0.92rem; color: rgba(232, 232, 240, 0.6); max-width: 22rem; }
</style>
</head>
<body>

<canvas id="jeu"></canvas>

<div class="hud">
  <a class="back" href="../index.html" aria-label="Retour au hub">←</a>
  <span class="zone" id="zone">ZONE 1</span>
  <span class="jauge">
    <span class="forme" id="forme">Peureux</span>
    <span class="barre"><i id="barre"></i></span>
  </span>
</div>

<button type="button" class="charge" id="charge">CHARGE</button>

<p class="hint" id="hint">
  Pose le doigt : tu vas vers lui.<br>
  Ramasse les lueurs. Fuis les regards rouges, ils te vident.
</p>

<div class="toast" id="toast"></div>

<div class="flash" id="flash">
  <strong id="flash-titre"></strong>
  <p id="flash-texte"></p>
  <button type="button" class="btn" id="flash-ok">Continuer</button>
</div>

<script>
(() => {
  'use strict';

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function grainDepuisTexte(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  function ecartAngle(a, b) {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }

  function melange(hex, vers, t) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255]
      .map((v) => Math.round(v + (vers - v) * t));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }
  const eclaircir = (hex, t) => melange(hex, 255, t);
  const assombrir = (hex, t) => melange(hex, 0, t);

  /* ==================================================== formes =========== */

  // Le fil du jeu : on commence peureux, minuscule et aveugle, et on monte.
  // Chaque palier change la couleur, le halo, et donne un verbe de plus.
  const FORMES = [
    { nom: 'Peureux',  couleur: '#8fd0ff', seuil: 0,  halo: 1.00, portee: 0,    cone: 0,
      texte: "Tu n'as qu'un halo. Ramasse les lueurs, évite les regards." },
    { nom: 'Curieux',  couleur: '#ffd479', seuil: 24, halo: 1.35, portee: 5.2,  cone: 0.34,
      texte: "Un faisceau s'ouvre devant toi. Il porte loin, il réveille les autres — un bonhomme éclairé relaie ta lumière." },
    { nom: 'Ardent',   couleur: '#ff9a6b', seuil: 72, halo: 1.75, portee: 7.4,  cone: 0.30,
      texte: "Ton faisceau brûle, et tu peux charger : le bouton en bas repousse tout ce qui t'approche." },
  ];

  const EMOTIONS = { PEUR: 'peur', COLERE: 'colere', CURIEUX: 'curieux' };
  const COULEURS = {
    [EMOTIONS.PEUR]: '#8fd0ff',
    [EMOTIONS.COLERE]: '#ff7a6b',
    [EMOTIONS.CURIEUX]: '#ffd479',
  };

  /* ==================================================== le monde ========= */

  const CASE = 74;                 // côté d'une case de la grille, en pixels monde

  // Une zone est un plan de salles reliées par des couloirs. C'est volontairement
  // une grille : la seule chose qu'il faut garantir ici, c'est « peut-on aller
  // d'ici à là », et sur une grille un parcours en largeur y répond exactement.
  // (Le mode puzzle précédent demandait de valider un système physique continu ;
  // c'était approximatif, et c'est ce qui l'a coulé.)
  function construireZone(rnd, numero) {
    const cols = 15 + Math.min(6, numero);
    const lignes = 20 + Math.min(8, numero * 2);
    const mur = [];
    for (let y = 0; y < lignes; y++) mur.push(new Array(cols).fill(1));

    const salles = [];
    const vise = 6 + Math.min(5, Math.floor(numero * 0.8));
    for (let essai = 0; essai < 220 && salles.length < vise; essai++) {
      const w = 3 + Math.floor(rnd() * 4);
      const h = 3 + Math.floor(rnd() * 4);
      const x = 1 + Math.floor(rnd() * (cols - w - 2));
      const y = 1 + Math.floor(rnd() * (lignes - h - 2));
      const chevauche = salles.some((s) =>
        x < s.x + s.w + 1 && x + w + 1 > s.x && y < s.y + s.h + 1 && y + h + 1 > s.y);
      if (chevauche) continue;
      salles.push({ x, y, w, h, cx: x + (w >> 1), cy: y + (h >> 1) });
    }
    if (salles.length < 3) return null;

    for (const s of salles) {
      for (let y = s.y; y < s.y + s.h; y++)
        for (let x = s.x; x < s.x + s.w; x++) mur[y][x] = 0;
    }

    const couloir = (a, b) => {
      let x = a.cx, y = a.cy;
      while (x !== b.cx) { mur[y][x] = 0; x += x < b.cx ? 1 : -1; }
      while (y !== b.cy) { mur[y][x] = 0; y += y < b.cy ? 1 : -1; }
      mur[y][x] = 0;
    };
    for (let i = 1; i < salles.length; i++) couloir(salles[i - 1], salles[i]);
    // deux raccourcis : sans ça le plan est un couloir unique et se parcourt bêtement
    for (let i = 0; i < 2; i++) {
      const a = salles[Math.floor(rnd() * salles.length)];
      const b = salles[Math.floor(rnd() * salles.length)];
      if (a !== b) couloir(a, b);
    }

    return { mur, cols, lignes, salles };
  }

  // Parcours en largeur sur les cases libres. Exact, et c'est tout l'intérêt :
  // ce que la génération promet, on le vérifie vraiment.
  function distances(zone, depart) {
    const { mur, cols, lignes } = zone;
    const d = [];
    for (let y = 0; y < lignes; y++) d.push(new Array(cols).fill(-1));
    if (mur[depart.cy][depart.cx]) return d;
    d[depart.cy][depart.cx] = 0;
    const file = [depart.cx, depart.cy];
    for (let i = 0; i < file.length; i += 2) {
      const x = file[i], y = file[i + 1];
      const n = [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]];
      for (const [nx, ny] of n) {
        if (nx < 0 || ny < 0 || nx >= cols || ny >= lignes) continue;
        if (mur[ny][nx] || d[ny][nx] !== -1) continue;
        d[ny][nx] = d[y][x] + 1;
        file.push(nx, ny);
      }
    }
    return d;
  }

  function genererZone(grainTexte, numero) {
    const base = grainDepuisTexte(grainTexte);
    for (let variante = 0; variante < 30; variante++) {
      const rnd = mulberry32(base + variante * 7919 + numero * 104729);
      const zone = construireZone(rnd, numero);
      if (!zone) continue;

      const depart = zone.salles[0];
      const d = distances(zone, depart);

      // la sortie va dans la salle la plus loin du départ, au sens du parcours
      let sortie = null, loin = -1;
      for (const s of zone.salles) {
        const dist = d[s.cy][s.cx];
        if (dist > loin) { loin = dist; sortie = s; }
      }
      if (!sortie || loin < 12) continue;      // trop court, ce n'est pas une zone

      // les lueurs : réparties dans les salles, jamais celle du départ
      const lueurs = [];
      for (const s of zone.salles) {
        if (s === depart) continue;
        const combien = 2 + Math.floor(rnd() * 3);
        for (let i = 0; i < combien; i++) {
          const cx = s.x + Math.floor(rnd() * s.w);
          const cy = s.y + Math.floor(rnd() * s.h);
          if (d[cy][cx] < 0) continue;         // inatteignable : on jette
          lueurs.push({ x: (cx + 0.5) * CASE, y: (cy + 0.5) * CASE, prise: false, phase: rnd() * TAU });
        }
      }
      if (lueurs.length < 8) continue;

      // les bonhommes : jamais dans la salle de départ, on laisse respirer
      const persos = [];
      const emotionsPossibles = numero === 1
        ? [EMOTIONS.PEUR, EMOTIONS.CURIEUX, EMOTIONS.COLERE]
        : [EMOTIONS.PEUR, EMOTIONS.CURIEUX, EMOTIONS.COLERE, EMOTIONS.COLERE];
      for (const s of zone.salles) {
        if (s === depart) continue;
        const combien = 1 + Math.floor(rnd() * 2);
        for (let i = 0; i < combien; i++) {
          const cx = s.x + Math.floor(rnd() * s.w);
          const cy = s.y + Math.floor(rnd() * s.h);
          if (d[cy][cx] < 0) continue;
          const x = (cx + 0.5) * CASE, y = (cy + 0.5) * CASE;
          const emotion = emotionsPossibles[Math.floor(rnd() * emotionsPossibles.length)];
          const regard = rnd() * TAU;
          persos.push({
            x, y, baseX: x, baseY: y, vx: 0, vy: 0,
            sx: 1, sy: 1, vsx: 0, vsy: 0,
            regard, regardRepos: regard,
            balayage: (rnd() < 0.5 ? 1 : -1) * (0.35 + rnd() * 0.5),
            amplitude: 0.5 + rnd() * 0.9,
            phase: rnd() * TAU,
            emotion, eclaire: false, calme: false,
            tremble: rnd() * TAU,
          });
        }
      }

      // Vérification finale, exacte : la sortie et chaque lueur sont-elles
      // vraiment atteignables depuis le départ ?
      const caseLibre = (p) => d[Math.floor(p.y / CASE)] && d[Math.floor(p.y / CASE)][Math.floor(p.x / CASE)] >= 0;
      if (!lueurs.every(caseLibre)) continue;

      return {
        ...zone,
        numero,
        grain: grainTexte,
        lueurs,
        persos,
        depart: { x: (depart.cx + 0.5) * CASE, y: (depart.cy + 0.5) * CASE },
        sortie: { x: (sortie.cx + 0.5) * CASE, y: (sortie.cy + 0.5) * CASE, r: CASE * 0.42 },
        requis: Math.min(lueurs.length, 5 + numero * 2),
        largeur: zone.cols * CASE,
        hauteur: zone.lignes * CASE,
        longueur: loin,
      };
    }
    return null;
  }

  /* ==================================================== état ============= */

  const canvas = document.getElementById('jeu');
  const ctx = canvas.getContext('2d');

  // Le calque d'obscurité n'est que du dégradé : demi-résolution, invisible à
  // l'œil et quatre fois moins cher à rastériser.
  const QLUM = 0.5;
  const lum = document.createElement('canvas');
  const lctx = lum.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  const PALIERS = [2, 1.5, 1];
  let palier = 0, fenetre = [];

  let zone = null;
  let vues = null;                 // mémoire du terrain : les cases déjà éclairées
  const cam = { x: 0, y: 0 };

  const joueur = {
    x: 0, y: 0, vx: 0, vy: 0,
    sx: 1, sy: 1, vsx: 0, vsy: 0,
    regard: -Math.PI / 2,
    eclat: 0, sommet: 0, niveau: 0,
    souffle: 1,                    // la santé : ce que les regards rouges vident
    repit: 0,                      // courte immunité après une extinction
    vu: 0,                         // intensité du regard subi, pour le rendu
    chargeDispo: 1, chargeT: 0,
  };

  const doigt = { x: 0, y: 0, actif: false };
  let numeroZone = 1;
  let grain = 'LUX-1042';
  let priseCount = 0;

  const elZone = document.getElementById('zone');
  const elForme = document.getElementById('forme');
  const elBarre = document.getElementById('barre');
  const elHint = document.getElementById('hint');
  const elCharge = document.getElementById('charge');
  const elToast = document.getElementById('toast');
  const elFlash = document.getElementById('flash');
  const elFlashTitre = document.getElementById('flash-titre');
  const elFlashTexte = document.getElementById('flash-texte');

  const forme = () => FORMES[joueur.niveau];

  function dims() {
    const t = clamp(Math.min(W, H) * 0.095, 30, 54);   // côté d'un bonhomme
    return { taille: t, halo: Math.min(W, H) * 0.17, portee: CASE, cone: 0.20 };
  }
  let D = dims();

  // Rayon réellement éclairé : il suit la forme, mais aussi l'éclat courant.
  // Se faire vider par un regard rouge fait littéralement rétrécir sa lumière.
  // Le halo EST la jauge de santé : se faire fixer le fait rétrécir, se cacher
  // le fait revenir. Plus lisible qu'une deuxième barre, et ça dit la règle du
  // jeu sans un mot — dans le noir tu récupères, dans un regard tu t'éteins.
  function rayonHalo() {
    const f = forme();
    return D.halo * f.halo * (0.5 + joueur.souffle * 0.5);
  }

  /* ==================================================== collisions ======= */

  const solide = (cx, cy) =>
    cx < 0 || cy < 0 || cx >= zone.cols || cy >= zone.lignes || zone.mur[cy][cx] === 1;

  // Repousse un corps carré hors des cases pleines qu'il touche.
  function degager(p, demi) {
    const c0x = Math.floor((p.x - demi) / CASE), c1x = Math.floor((p.x + demi) / CASE);
    const c0y = Math.floor((p.y - demi) / CASE), c1y = Math.floor((p.y + demi) / CASE);
    for (let cy = c0y; cy <= c1y; cy++) {
      for (let cx = c0x; cx <= c1x; cx++) {
        if (!solide(cx, cy)) continue;
        const mx = cx * CASE, my = cy * CASE;
        const gauche = (mx - demi) - p.x, droite = (mx + CASE + demi) - p.x;
        const haut = (my - demi) - p.y, bas = (my + CASE + demi) - p.y;
        const dx = Math.abs(gauche) < Math.abs(droite) ? gauche : droite;
        const dy = Math.abs(haut) < Math.abs(bas) ? haut : bas;
        if (Math.abs(dx) < Math.abs(dy)) { p.x += dx; p.vx = 0; }
        else { p.y += dy; p.vy = 0; }
      }
    }
  }

  /* ==================================================== vision =========== */

  // Une case est vue si elle est dans le halo, ou dans le faisceau. On garde la
  // mémoire : le terrain déjà traversé reste faiblement dessiné, sinon on
  // explore à l'aveugle et on tourne en rond.
  function marquerVu() {
    const f = forme();
    const r = rayonHalo();
    const portee = f.portee * CASE;
    const rmax = Math.max(r, portee) + CASE;
    const c0x = Math.max(0, Math.floor((joueur.x - rmax) / CASE));
    const c1x = Math.min(zone.cols - 1, Math.floor((joueur.x + rmax) / CASE));
    const c0y = Math.max(0, Math.floor((joueur.y - rmax) / CASE));
    const c1y = Math.min(zone.lignes - 1, Math.floor((joueur.y + rmax) / CASE));
    for (let cy = c0y; cy <= c1y; cy++) {
      for (let cx = c0x; cx <= c1x; cx++) {
        if (vues[cy][cx]) continue;
        const px = (cx + 0.5) * CASE, py = (cy + 0.5) * CASE;
        const d = Math.hypot(px - joueur.x, py - joueur.y);
        if (d < r + CASE * 0.5) { vues[cy][cx] = 1; continue; }
        if (portee && d < portee) {
          const a = Math.atan2(py - joueur.y, px - joueur.x);
          if (Math.abs(ecartAngle(joueur.regard, a)) < f.cone + 0.12) vues[cy][cx] = 1;
        }
      }
    }
  }

  // Ligne de vue sur la grille : un pas de demi-case suffit et coûte peu.
  function vueLibre(x1, y1, x2, y2) {
    const d = Math.hypot(x2 - x1, y2 - y1);
    const pas = Math.max(1, Math.ceil(d / (CASE * 0.45)));
    for (let i = 1; i < pas; i++) {
      const t = i / pas;
      const x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t;
      if (solide(Math.floor(x / CASE), Math.floor(y / CASE))) return false;
    }
    return true;
  }

  const dansLeCone = (sx, sy, angle, tx, ty, portee, demi) => {
    const d = Math.hypot(tx - sx, ty - sy);
    if (d > portee || d < 1) return false;
    const a = Math.atan2(ty - sy, tx - sx);
    return Math.abs(ecartAngle(angle, a)) <= demi + Math.min(0.45, 30 / Math.max(d, 1));
  };

  // Relais : ton faisceau réveille un bonhomme, qui éclaire à son tour dans la
  // direction de son regard. C'est ce qui reste du mode puzzle — mais ici ça ne
  // décide de rien, ça sert seulement à voir plus loin. Donc rien à valider.
  function propager() {
    const f = forme();
    const eclaires = new Set();
    if (!f.portee) return eclaires;
    const portee = f.portee * CASE;

    for (const p of zone.persos) {
      if (p.emotion === EMOTIONS.COLERE) continue;
      if (!dansLeCone(joueur.x, joueur.y, joueur.regard, p.x, p.y, portee, f.cone)) continue;
      if (!vueLibre(joueur.x, joueur.y, p.x, p.y)) continue;
      eclaires.add(p);
    }
    for (let tour = 0; tour < 4; tour++) {
      let ajout = false;
      for (const src of [...eclaires]) {
        for (const cible of zone.persos) {
          if (cible === src || eclaires.has(cible)) continue;
          if (cible.emotion === EMOTIONS.COLERE) continue;
          if (!dansLeCone(src.x, src.y, src.regard, cible.x, cible.y, D.portee * 5, D.cone)) continue;
          if (!vueLibre(src.x, src.y, cible.x, cible.y)) continue;
          eclaires.add(cible);
          ajout = true;
        }
      }
      if (!ajout) break;
    }
    return eclaires;
  }

  /* ==================================================== physique ========= */

  function majJoueur(dt) {
    const demi = D.taille * 0.5;

    if (doigt.actif) {
      const cx = doigt.x + cam.x, cy = doigt.y + cam.y;
      const dx = cx - joueur.x, dy = cy - joueur.y;
      const d = Math.hypot(dx, dy);
      if (d > 4) {
        const force = 1500 * clamp(d / 90, 0.25, 1);
        joueur.vx += (dx / d) * force * dt;
        joueur.vy += (dy / d) * force * dt;
      }
    }

    // décharge : une poussée nette, puis on retombe dans le frottement normal
    if (joueur.chargeT > 0) {
      joueur.chargeT -= dt;
      const a = joueur.regard;
      joueur.vx += Math.cos(a) * 2600 * dt;
      joueur.vy += Math.sin(a) * 2600 * dt;
    }

    const frottement = Math.pow(0.0009, dt);
    joueur.vx *= frottement;
    joueur.vy *= frottement;

    const vmax = 340 + joueur.niveau * 40 + (joueur.chargeT > 0 ? 420 : 0);
    const v = Math.hypot(joueur.vx, joueur.vy);
    if (v > vmax) { joueur.vx = (joueur.vx / v) * vmax; joueur.vy = (joueur.vy / v) * vmax; }

    joueur.x += joueur.vx * dt;
    joueur.y += joueur.vy * dt;
    joueur.x = clamp(joueur.x, demi, zone.largeur - demi);
    joueur.y = clamp(joueur.y, demi, zone.hauteur - demi);
    degager(joueur, demi);

    if (v > 26) joueur.regard += ecartAngle(joueur.regard, Math.atan2(joueur.vy, joueur.vx)) * Math.min(1, 12 * dt);

    majJelly(joueur, dt);
  }

  function majJelly(p, dt) {
    const cibleX = clamp(1 + p.vy * 0.00055 - p.vx * 0.00055, 0.84, 1.19);
    const cibleY = clamp(1 + p.vx * 0.00055 - p.vy * 0.00055, 0.84, 1.19);
    const RAIDEUR = 190, AMORTI = 13;
    p.vsx += (cibleX - p.sx) * RAIDEUR * dt;
    p.vsy += (cibleY - p.sy) * RAIDEUR * dt;
    p.vsx -= p.vsx * AMORTI * dt;
    p.vsy -= p.vsy * AMORTI * dt;
    p.sx += p.vsx * dt;
    p.sy += p.vsy * dt;
  }

  function majPersos(dt, temps, eclaires) {
    const demi = D.taille * 0.5;
    for (const p of zone.persos) {
      p.eclaire = eclaires.has(p);
      const dx = joueur.x - p.x, dy = joueur.y - p.y;
      const d = Math.hypot(dx, dy) || 1;
      const voit = d < CASE * 5 && vueLibre(p.x, p.y, joueur.x, joueur.y);

      if (p.emotion === EMOTIONS.CURIEUX) {
        // balaye largement — ici on peut se le permettre, aucun solveur ne
        // dépend de son angle. Éclairé, il ralentit : c'est comme ça qu'on fige
        // un relais dans la bonne direction.
        p.phase += p.balayage * (p.eclaire ? 0.18 : 1) * dt;
        p.regard = p.regardRepos + Math.sin(p.phase) * p.amplitude;

      } else if (p.emotion === EMOTIONS.PEUR) {
        if (p.calme) {
          p.regard += ecartAngle(p.regard, Math.atan2(dy, dx)) * 2.4 * dt;   // il te suit du regard
        } else if (voit && d < CASE * 2.6) {
          p.vx -= (dx / d) * 300 * dt;
          p.vy -= (dy / d) * 300 * dt;
          p.regard = Math.atan2(-dy, -dx);
        } else {
          p.vx += (p.baseX - p.x) * 1.6 * dt;
          p.vy += (p.baseY - p.y) * 1.6 * dt;
          p.phase += p.balayage * 0.5 * dt;
          p.regard = p.regardRepos + Math.sin(p.phase) * 0.5;
        }

      } else {
        // Coléreux : il fixe le joueur dès qu'il le voit, et il charge — mais
        // pas au-delà de son territoire. Mesuré sans laisse : un seul rouge
        // suivait le joueur à travers toute la zone, le rattrapait jusqu'au
        // point de réapparition et le revidait en boucle.
        const loin = Math.hypot(p.x - p.baseX, p.y - p.baseY) > CASE * 5.5;
        if (voit && !loin) {
          p.regard += ecartAngle(p.regard, Math.atan2(dy, dx)) * 5 * dt;
          if (d < CASE * 4.2) {
            const vitesse = 210 + zone.numero * 12;
            p.vx += (dx / d) * vitesse * dt;
            p.vy += (dy / d) * vitesse * dt;
          }
        } else {
          p.vx += (p.baseX - p.x) * 1.1 * dt;
          p.vy += (p.baseY - p.y) * 1.1 * dt;
          p.phase += p.balayage * 0.6 * dt;
          p.regard = p.regardRepos + Math.sin(p.phase) * 0.7;
        }
      }

      const f = Math.pow(0.0016, dt);
      p.vx *= f; p.vy *= f;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.x = clamp(p.x, demi, zone.largeur - demi);
      p.y = clamp(p.y, demi, zone.hauteur - demi);
      degager(p, demi);

      // séparation d'avec le joueur : un rouge collé dedans est illisible
      const sx = p.x - joueur.x, sy = p.y - joueur.y;
      const sd = Math.hypot(sx, sy);
      const mini = D.taille * 0.95;
      if (sd > 0.01 && sd < mini) {
        const k = (mini - sd) * 0.5;
        p.x += (sx / sd) * k; p.y += (sy / sd) * k;
        joueur.x -= (sx / sd) * k; joueur.y -= (sy / sd) * k;
        degager(joueur, demi);
      }

      majJelly(p, dt);
    }
  }

  /* ==================================================== règles =========== */

  function evoluer() {
    const suivant = FORMES[joueur.niveau + 1];
    if (!suivant || joueur.sommet < suivant.seuil) return;
    joueur.niveau++;
    elCharge.classList.toggle('on', joueur.niveau >= 2);
    montrerFlash(suivant.nom, suivant.texte, suivant.couleur);
  }

  function gagnerEclat(n) {
    joueur.eclat += n;
    joueur.sommet = Math.max(joueur.sommet, joueur.eclat);
    evoluer();
  }

  function etouffer(n) {
    joueur.souffle = Math.max(0, joueur.souffle - n);
    if (joueur.souffle > 0) return;
    // Éteint : on repose au seuil de la zone. L'éclat n'est JAMAIS repris — la
    // progression ne se perd pas, sinon la mort punit deux fois. Et c'est un
    // bandeau qui s'efface, pas une fenêtre à valider : ça casserait le rythme.
    joueur.souffle = 0.62;
    joueur.x = zone.depart.x; joueur.y = zone.depart.y;
    joueur.vx = joueur.vy = 0;
    joueur.repit = 1.6;                 // sans ce répit on se fait revider à l'arrivée
    for (const p of zone.persos) {      // et les rouges retournent à leur poste
      if (p.emotion !== EMOTIONS.COLERE) continue;
      p.x = p.baseX; p.y = p.baseY; p.vx = p.vy = 0;
    }
    montrerToast('Éteint — tu repars du seuil');
  }

  function majRegles(dt) {
    // lueurs ramassées
    for (const l of zone.lueurs) {
      if (l.prise) continue;
      if (Math.hypot(l.x - joueur.x, l.y - joueur.y) > D.taille * 0.9) continue;
      l.prise = true;
      priseCount++;
      gagnerEclat(4);
    }

    // calmer un peureux avec son faisceau : il donne de l'éclat, une fois
    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.PEUR || p.calme || !p.eclaire) continue;
      p.compteCalme = (p.compteCalme || 0) + dt;
      if (p.compteCalme > 0.9) { p.calme = true; gagnerEclat(6); }
    }

    // les regards rouges vident le souffle ; le noir le rend
    let vide = 0;
    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE) continue;
      const d = Math.hypot(joueur.x - p.x, joueur.y - p.y);
      if (d > CASE * 4.6) continue;
      if (!dansLeCone(p.x, p.y, p.regard, joueur.x, joueur.y, CASE * 4.6, 0.42)) continue;
      if (!vueLibre(p.x, p.y, joueur.x, joueur.y)) continue;
      vide += 0.4 * dt;
      if (d < CASE * 1.4) vide += 0.5 * dt;
    }
    if (joueur.repit > 0) { joueur.repit -= dt; vide = 0; }
    joueur.vu += ((vide > 0 ? 1 : 0) - joueur.vu) * Math.min(1, 6 * dt);
    if (vide > 0) etouffer(vide);
    else joueur.souffle = Math.min(1, joueur.souffle + 0.26 * dt);

    // recharge de la charge
    if (joueur.chargeDispo < 1) {
      joueur.chargeDispo = Math.min(1, joueur.chargeDispo + dt / 3.4);
      elCharge.disabled = joueur.chargeDispo < 1;
    }

    // sortie
    if (priseCount >= zone.requis &&
        Math.hypot(zone.sortie.x - joueur.x, zone.sortie.y - joueur.y) < zone.sortie.r) {
      zoneSuivante();
    }
  }

  function decharger() {
    if (joueur.niveau < 2 || joueur.chargeDispo < 1) return;
    joueur.chargeDispo = 0;
    joueur.chargeT = 0.22;
    elCharge.disabled = true;
    for (const p of zone.persos) {
      const dx = p.x - joueur.x, dy = p.y - joueur.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d > CASE * 2.2) continue;
      p.vx += (dx / d) * 620;
      p.vy += (dy / d) * 620;
    }
  }

  /* ==================================================== rendu ============ */

  function carreArrondi(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function dessinerCorps(p, couleur, taille, allume, opacite) {
    const w = taille * p.sx, h = taille * p.sy;
    const arrondi = Math.min(w, h) * 0.32;
    ctx.save();
    ctx.translate(p.x - cam.x, p.y - cam.y);
    ctx.globalAlpha = opacite;

    const corps = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    if (allume) {
      corps.addColorStop(0, eclaircir(couleur, 0.42));
      corps.addColorStop(0.55, couleur);
      corps.addColorStop(1, assombrir(couleur, 0.3));
    } else {
      corps.addColorStop(0, '#23232f');
      corps.addColorStop(1, '#12121a');
    }
    ctx.fillStyle = corps;
    carreArrondi(ctx, -w / 2, -h / 2, w, h, arrondi);
    ctx.fill();
    ctx.strokeStyle = allume ? 'rgba(255,255,255,0.7)' : couleur;
    ctx.lineWidth = allume ? 2 : 1.5;
    ctx.stroke();

    const reflet = ctx.createRadialGradient(-w * 0.2, -h * 0.28, 0, -w * 0.2, -h * 0.28, w * 0.42);
    reflet.addColorStop(0, `rgba(255,255,255,${allume ? 0.45 : 0.1})`);
    reflet.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = reflet;
    carreArrondi(ctx, -w / 2, -h / 2, w, h, arrondi);
    ctx.fill();

    // --- visage ---
    const demi = taille * 0.5;
    const ecart = demi * 0.38 * p.sx;
    const oeilY = -demi * 0.08 * p.sy;
    const rOeil = demi * 0.23;
    const px = Math.cos(p.regard) * rOeil * 0.42;
    const py = Math.sin(p.regard) * rOeil * 0.42;
    for (const dx of [-ecart, ecart]) {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(dx, oeilY, rOeil, 0, TAU); ctx.fill();
      ctx.fillStyle = '#0a0a10';
      ctx.beginPath(); ctx.arc(dx + px, oeilY + py, rOeil * 0.5, 0, TAU); ctx.fill();
    }
    ctx.restore();
    return { ecart, oeilY, rOeil };
  }

  function dessinerSourcils(p, emotion, taille, allume, opacite, temps) {
    const demi = taille * 0.5;
    const ecart = demi * 0.38 * p.sx;
    const oeilY = -demi * 0.08 * p.sy;
    const rOeil = demi * 0.23;
    ctx.save();
    ctx.translate(p.x - cam.x, p.y - cam.y);
    ctx.globalAlpha = opacite;
    ctx.strokeStyle = allume ? '#0a0a10' : COULEURS[emotion];
    ctx.lineWidth = Math.max(2, demi * 0.13);
    ctx.lineCap = 'round';
    const sy = oeilY - rOeil * 1.5;
    const lg = rOeil * 1.15;

    if (emotion === EMOTIONS.PEUR) {
      const t = Math.sin(temps * 16 + p.tremble) * rOeil * 0.12;
      for (const [dx, sens] of [[-ecart, 1], [ecart, -1]]) {
        ctx.beginPath();
        ctx.moveTo(dx - lg * 0.5 * sens, sy - rOeil * 0.15 + t);
        ctx.lineTo(dx + lg * 0.5 * sens, sy - rOeil * 0.5 + t);
        ctx.stroke();
      }
    } else if (emotion === EMOTIONS.COLERE) {
      for (const [dx, sens] of [[-ecart, 1], [ecart, -1]]) {
        ctx.beginPath();
        ctx.moveTo(dx - lg * 0.5 * sens, sy - rOeil * 0.45);
        ctx.lineTo(dx + lg * 0.5 * sens, sy + rOeil * 0.28);
        ctx.stroke();
      }
    } else {
      ctx.beginPath();
      ctx.moveTo(-ecart - lg * 0.5, sy - rOeil * 0.55);
      ctx.lineTo(-ecart + lg * 0.5, sy - rOeil * 0.15);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ecart - lg * 0.5, sy);
      ctx.lineTo(ecart + lg * 0.5, sy);
      ctx.stroke();
    }
    ctx.restore();
  }

  function percerCone(c, x, y, angle, portee, demiAngle, force) {
    const g = c.createRadialGradient(x, y, 0, x, y, portee);
    g.addColorStop(0, `rgba(0,0,0,${force})`);
    g.addColorStop(0.6, `rgba(0,0,0,${force * 0.7})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(x, y);
    c.arc(x, y, portee, angle - demiAngle, angle + demiAngle);
    c.closePath();
    c.fill();
  }

  // Sol + arêtes. Une arête n'est tracée que là où une case creusée touche un
  // mur : c'est ce qui donne les contours de salle.
  function dessinerSol(c0x, c1x, c0y, c1y, fond, trait) {
    ctx.fillStyle = fond;
    for (let cy = c0y; cy <= c1y; cy++) {
      for (let cx = c0x; cx <= c1x; cx++) {
        if (zone.mur[cy][cx] || !vues[cy][cx]) continue;
        ctx.fillRect(cx * CASE - cam.x, cy * CASE - cam.y, CASE + 1, CASE + 1);
      }
    }
    ctx.strokeStyle = trait;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let cy = c0y; cy <= c1y; cy++) {
      for (let cx = c0x; cx <= c1x; cx++) {
        if (zone.mur[cy][cx] || !vues[cy][cx]) continue;
        const x = cx * CASE - cam.x, y = cy * CASE - cam.y;
        if (solide(cx, cy - 1)) { ctx.moveTo(x, y); ctx.lineTo(x + CASE, y); }
        if (solide(cx, cy + 1)) { ctx.moveTo(x, y + CASE); ctx.lineTo(x + CASE, y + CASE); }
        if (solide(cx - 1, cy)) { ctx.moveTo(x, y); ctx.lineTo(x, y + CASE); }
        if (solide(cx + 1, cy)) { ctx.moveTo(x + CASE, y); ctx.lineTo(x + CASE, y + CASE); }
      }
    }
    ctx.stroke();
  }

  function dessiner(temps, eclaires) {
    const f = forme();
    const r = rayonHalo();

    ctx.fillStyle = '#08080e';
    ctx.fillRect(0, 0, W, H);

    // --- le sol, limité à ce qui est à l'écran ---
    // On dessine les cases CREUSÉES, pas les murs : en peignant les murs on
    // obtenait des tuiles isolées qui se lisaient comme des plateformes
    // flottantes. Sol clair, murs restés noirs, arêtes soulignées : ça se lit
    // comme des salles et des couloirs.
    const c0x = Math.max(0, Math.floor(cam.x / CASE));
    const c1x = Math.min(zone.cols - 1, Math.floor((cam.x + W) / CASE));
    const c0y = Math.max(0, Math.floor(cam.y / CASE));
    const c1y = Math.min(zone.lignes - 1, Math.floor((cam.y + H) / CASE));
    dessinerSol(c0x, c1x, c0y, c1y, '#14141e', 'rgba(255,255,255,0.11)');

    // --- sortie ---
    const ouverte = priseCount >= zone.requis;
    const pulse = 1 + Math.sin(temps * 3) * 0.07;
    ctx.save();
    ctx.translate(zone.sortie.x - cam.x, zone.sortie.y - cam.y);
    ctx.strokeStyle = ouverte ? '#ffe9a8' : 'rgba(255,233,168,0.22)';
    ctx.lineWidth = ouverte ? 3.5 : 2;
    ctx.beginPath(); ctx.arc(0, 0, zone.sortie.r * pulse, 0, TAU); ctx.stroke();
    ctx.fillStyle = ouverte ? 'rgba(255,233,168,0.34)' : 'rgba(255,233,168,0.06)';
    ctx.beginPath(); ctx.arc(0, 0, zone.sortie.r * 0.5, 0, TAU); ctx.fill();
    ctx.restore();

    // --- lueurs ---
    for (const l of zone.lueurs) {
      if (l.prise) continue;
      const s = 1 + Math.sin(temps * 4 + l.phase) * 0.18;
      ctx.fillStyle = 'rgba(255,240,200,0.9)';
      ctx.beginPath();
      ctx.arc(l.x - cam.x, l.y - cam.y, 4.5 * s, 0, TAU);
      ctx.fill();
    }

    // --- bonhommes, coléreux au-dessus ---
    const ordre = [...zone.persos].sort((a, b) =>
      (a.emotion === EMOTIONS.COLERE ? 1 : 0) - (b.emotion === EMOTIONS.COLERE ? 1 : 0));
    for (const p of ordre) {
      const couleur = p.calme ? '#a8f0c8' : COULEURS[p.emotion];
      dessinerCorps(p, couleur, D.taille, p.eclaire || p.calme, 1);
      dessinerSourcils(p, p.emotion, D.taille, p.eclaire || p.calme, 1, temps);
    }

    // --- le joueur ---
    dessinerCorps(joueur, f.couleur, D.taille * 1.06, true, 1);
    dessinerSourcils(joueur, joueur.niveau === 0 ? EMOTIONS.PEUR
      : joueur.niveau === 1 ? EMOTIONS.CURIEUX : EMOTIONS.COLERE, D.taille * 1.06, true, 1, temps);

    /* ---- calque d'obscurité ---- */
    lctx.setTransform(DPR * QLUM, 0, 0, DPR * QLUM, 0, 0);
    lctx.globalCompositeOperation = 'source-over';
    lctx.fillStyle = 'rgba(8,8,14,0.965)';
    lctx.fillRect(0, 0, W, H);
    lctx.globalCompositeOperation = 'destination-out';

    const jx = joueur.x - cam.x, jy = joueur.y - cam.y;
    const g = lctx.createRadialGradient(jx, jy, 0, jx, jy, r);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(0.62, 'rgba(0,0,0,0.88)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = g;
    lctx.beginPath(); lctx.arc(jx, jy, r, 0, TAU); lctx.fill();

    if (f.portee) percerCone(lctx, jx, jy, joueur.regard, f.portee * CASE, f.cone, 0.95);
    for (const p of eclaires) {
      percerCone(lctx, p.x - cam.x, p.y - cam.y, p.regard, D.portee * 5, D.cone + 0.05, 0.85);
    }
    // les regards rouges restent visibles même hors de ta lumière : la menace
    // doit se voir venir, sinon se faire vider est arbitraire
    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE) continue;
      const d = Math.hypot(p.x - joueur.x, p.y - joueur.y);
      if (d > CASE * 7) continue;
      percerCone(lctx, p.x - cam.x, p.y - cam.y, p.regard, CASE * 4.6, 0.42, 0.3);
    }
    lctx.globalCompositeOperation = 'source-over';

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(lum, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    // --- rappel du terrain déjà vu, par-dessus le voile ---
    // Sans ça on explore à l'aveugle et on tourne en rond : le plan déjà
    // traversé reste faiblement dessiné.
    ctx.save();
    dessinerSol(c0x, c1x, c0y, c1y, 'rgba(255,255,255,0.022)', 'rgba(255,255,255,0.08)');
    for (const l of zone.lueurs) {
      if (l.prise) continue;
      const cx = Math.floor(l.x / CASE), cy = Math.floor(l.y / CASE);
      if (!vues[cy] || !vues[cy][cx]) continue;
      ctx.fillStyle = 'rgba(255,240,200,0.4)';
      ctx.beginPath();
      ctx.arc(l.x - cam.x, l.y - cam.y, 3, 0, TAU);
      ctx.fill();
    }
    if (vues[Math.floor(zone.sortie.y / CASE)] && vues[Math.floor(zone.sortie.y / CASE)][Math.floor(zone.sortie.x / CASE)]) {
      ctx.strokeStyle = ouverte ? 'rgba(255,233,168,0.6)' : 'rgba(255,233,168,0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(zone.sortie.x - cam.x, zone.sortie.y - cam.y, zone.sortie.r * pulse, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();

    // --- halo chaud par-dessus ---
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const chaud = ctx.createRadialGradient(jx, jy, 0, jx, jy, r);
    chaud.addColorStop(0, melange(f.couleur, 255, 0.3).replace('rgb', 'rgba').replace(')', ',0.15)'));
    chaud.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = chaud;
    ctx.beginPath(); ctx.arc(jx, jy, r, 0, TAU); ctx.fill();

    if (f.portee) {
      const portee = f.portee * CASE;
      const gf = ctx.createRadialGradient(jx, jy, 0, jx, jy, portee);
      gf.addColorStop(0, melange(f.couleur, 255, 0.2).replace('rgb', 'rgba').replace(')', ',0.13)'));
      gf.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gf;
      ctx.beginPath();
      ctx.moveTo(jx, jy);
      ctx.arc(jx, jy, portee, joueur.regard - f.cone, joueur.regard + f.cone);
      ctx.closePath();
      ctx.fill();
    }
    for (const p of eclaires) {
      const portee = D.portee * 5;
      const gp = ctx.createRadialGradient(p.x - cam.x, p.y - cam.y, 0, p.x - cam.x, p.y - cam.y, portee);
      gp.addColorStop(0, COULEURS[p.emotion] + '2a');
      gp.addColorStop(1, COULEURS[p.emotion] + '00');
      ctx.fillStyle = gp;
      ctx.beginPath();
      ctx.moveTo(p.x - cam.x, p.y - cam.y);
      ctx.arc(p.x - cam.x, p.y - cam.y, portee, p.regard - D.cone, p.regard + D.cone);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // on se fait fixer : le bord de l'écran rougit, et d'autant plus que le
    // souffle baisse. C'est le seul retour d'information sur la santé.
    const alerte = joueur.vu * (1 - joueur.souffle * 0.55);
    if (alerte > 0.02) {
      const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28, W / 2, H / 2, Math.max(W, H) * 0.72);
      v.addColorStop(0, 'rgba(255,60,50,0)');
      v.addColorStop(1, `rgba(255,60,50,${clamp(alerte * 0.5, 0, 0.5)})`);
      ctx.fillStyle = v;
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ==================================================== interface ======== */

  let toastT = 0;
  function montrerToast(texte) {
    elToast.textContent = texte;
    elToast.classList.add('on');
    toastT = 2.4;
  }

  let flashEnCours = false;
  function montrerFlash(titre, texte, couleur) {
    elFlashTitre.textContent = titre;
    elFlashTitre.style.color = couleur;
    elFlashTexte.textContent = texte;
    elFlash.classList.add('on');
    flashEnCours = true;
    doigt.actif = false;
  }
  document.getElementById('flash-ok').addEventListener('click', () => {
    elFlash.classList.remove('on');
    flashEnCours = false;
  });

  function majInterface() {
    const f = forme();
    const suivant = FORMES[joueur.niveau + 1];
    const bas = f.seuil;
    const haut = suivant ? suivant.seuil : f.seuil + 40;
    elForme.textContent = f.nom;
    elForme.style.color = f.couleur;
    elBarre.firstChild || null;
    elBarre.style.width = `${clamp((joueur.eclat - bas) / (haut - bas), 0, 1) * 100}%`;
    elBarre.style.background = f.couleur;
    elZone.textContent = `ZONE ${zone.numero} · ${priseCount}/${zone.requis}`;
  }

  /* ==================================================== zones ============ */

  function chargerZone(numero) {
    const z = genererZone(grain, numero);
    if (!z) return;
    zone = z;
    numeroZone = numero;
    priseCount = 0;
    vues = [];
    for (let y = 0; y < zone.lignes; y++) vues.push(new Array(zone.cols).fill(0));
    joueur.x = zone.depart.x;
    joueur.y = zone.depart.y;
    joueur.vx = joueur.vy = 0;
    cadrer(true);
    marquerVu();
    majInterface();
  }

  function zoneSuivante() {
    const n = numeroZone + 1;
    montrerFlash(`Zone ${n}`, 'Plus grand, plus peuplé. Ta forme et ton éclat te suivent.', '#ffe9a8');
    chargerZone(n);
  }

  function cadrer(immediat) {
    const cx = clamp(joueur.x - W / 2, 0, Math.max(0, zone.largeur - W));
    const cy = clamp(joueur.y - H / 2, 0, Math.max(0, zone.hauteur - H));
    if (immediat) { cam.x = cx; cam.y = cy; return; }
    cam.x += (cx - cam.x) * 0.14;
    cam.y += (cy - cam.y) * 0.14;
  }

  /* ==================================================== boucle =========== */

  function surveillerCadence(dt) {
    if (palier >= PALIERS.length - 1) return;
    fenetre.push(dt);
    if (fenetre.length < 90) return;
    const median = [...fenetre].sort((a, b) => a - b)[45];
    fenetre = [];
    if (median > 0.022) { palier++; redimensionner(); }
  }

  function redimensionner() {
    DPR = Math.min(window.devicePixelRatio || 1, PALIERS[palier]);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    lum.width = Math.ceil(canvas.width * QLUM);
    lum.height = Math.ceil(canvas.height * QLUM);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    D = dims();
  }

  let dernier = performance.now();

  function boucle(maintenant) {
    requestAnimationFrame(boucle);
    const dt = Math.min((maintenant - dernier) / 1000, 1 / 30);
    dernier = maintenant;
    const temps = maintenant / 1000;
    if (!zone) return;

    if (doigt.actif) surveillerCadence(dt);

    if (toastT > 0) {
      toastT -= dt;
      if (toastT <= 0) elToast.classList.remove('on');
    }

    if (!flashEnCours) {
      majJoueur(dt);
      const eclaires = propager();
      majPersos(dt, temps, eclaires);
      majRegles(dt);
      marquerVu();
      cadrer(false);
      majInterface();
      dessiner(temps, eclaires);
    } else {
      dessiner(temps, new Set());
    }
  }

  /* ==================================================== entrées ========== */

  function position(e) {
    const r = canvas.getBoundingClientRect();
    doigt.x = e.clientX - r.left;
    doigt.y = e.clientY - r.top;
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    position(e);
    doigt.actif = true;
    elHint.style.opacity = '0';
  });
  canvas.addEventListener('pointermove', (e) => { if (doigt.actif) position(e); });
  ['pointerup', 'pointercancel'].forEach((t) =>
    canvas.addEventListener(t, () => { doigt.actif = false; }));

  elCharge.addEventListener('click', decharger);

  window.addEventListener('resize', () => {
    redimensionner();
    if (zone) cadrer(true);
  });

  redimensionner();
  chargerZone(1);
  requestAnimationFrame(boucle);

  // Exposé pour les mesures automatisées : l'accessibilité du plan se vérifie
  // exactement (parcours en largeur sur la grille), contrairement au solveur de
  // lumière du mode puzzle qui n'en donnait qu'une approximation.
  window.__lux = {
    info: () => zone && {
      zone: zone.numero, grain: zone.grain,
      cols: zone.cols, lignes: zone.lignes, salles: zone.salles.length,
      lueurs: zone.lueurs.length, requis: zone.requis,
      persos: zone.persos.length, longueur: zone.longueur,
      niveau: joueur.niveau, eclat: Math.round(joueur.eclat), prises: priseCount,
    },
    // vrai si la sortie et toutes les lueurs sont atteignables depuis le départ
    accessible: () => {
      const d = distances(zone, { cx: Math.floor(zone.depart.x / CASE), cy: Math.floor(zone.depart.y / CASE) });
      const ok = (p) => {
        const cx = Math.floor(p.x / CASE), cy = Math.floor(p.y / CASE);
        return d[cy] && d[cy][cx] >= 0;
      };
      return { sortie: ok(zone.sortie), lueurs: zone.lueurs.every(ok), persos: zone.persos.every(ok) };
    },
    charger: chargerZone,
    graine: (g) => { grain = g; chargerZone(1); },
    joueur: () => ({ ...joueur }),
    toast: () => elToast.classList.contains('on'),
    // vise un point du monde comme le ferait un doigt posé à l'écran
    viser: (wx, wy) => { doigt.x = wx - cam.x; doigt.y = wy - cam.y; doigt.actif = true; },
    lacher: () => { doigt.actif = false; },
    // chemin sur la grille, pour qu'un pilote automatique puisse jouer la zone
    chemin: (wx, wy) => {
      const dep = { cx: Math.floor(joueur.x / CASE), cy: Math.floor(joueur.y / CASE) };
      const d = distances(zone, dep);
      let cx = Math.floor(wx / CASE), cy = Math.floor(wy / CASE);
      if (!d[cy] || d[cy][cx] < 0) return null;
      const route = [];
      while (d[cy][cx] > 0) {
        route.push([(cx + 0.5) * CASE, (cy + 0.5) * CASE]);
        const n = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]
          .filter(([x, y]) => d[y] !== undefined && d[y][x] >= 0);
        const suivant = n.reduce((a, [x, y]) => (d[y][x] < d[a[1]][a[0]] ? [x, y] : a), n[0]);
        cx = suivant[0]; cy = suivant[1];
      }
      return route.reverse();
    },
    poser: (x, y) => { joueur.x = x; joueur.y = y; joueur.vx = joueur.vy = 0; cadrer(true); marquerVu(); },
    monter: (n) => { joueur.sommet = joueur.eclat = n; joueur.niveau = 0; evoluer(); evoluer();
                     elFlash.classList.remove('on'); flashEnCours = false; },
    etat: () => zone,
  };
})();
</script>
</body>
</html>

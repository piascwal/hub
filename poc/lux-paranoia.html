<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lux &amp; Paranoia</title>
<meta name="description" content="Puzzle de lumière : éclairez des carrés émotifs pour relayer un faisceau jusqu'à la sortie.">
<meta name="theme-color" content="#0a0a10">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    background: #0a0a10;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #e8e8f0;
    -webkit-user-select: none;
    user-select: none;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---- interface ---- */

  .hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: max(0.7rem, env(safe-area-inset-top)) 0.8rem 0.7rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    pointer-events: none;
    z-index: 10;
  }

  .hud > * { pointer-events: auto; }

  .back {
    color: rgba(232, 232, 240, 0.55);
    text-decoration: none;
    font-size: 0.95rem;
    padding: 0.35rem 0.55rem;
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.05);
  }

  .seed {
    margin-right: auto;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: rgba(232, 232, 240, 0.4);
    font-variant-numeric: tabular-nums;
    padding-left: 0.2rem;
  }

  .btn {
    font: inherit;
    font-size: 0.78rem;
    color: #e8e8f0;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.13);
    border-radius: 999px;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .btn:hover { border-color: rgba(255, 255, 255, 0.3); }
  .btn:active { background: rgba(255, 255, 255, 0.12); }

  .hint {
    position: fixed;
    left: 0; right: 0;
    bottom: max(0.8rem, env(safe-area-inset-bottom));
    text-align: center;
    font-size: 0.76rem;
    color: rgba(232, 232, 240, 0.32);
    pointer-events: none;
    z-index: 10;
    padding: 0 1rem;
    transition: opacity 0.4s ease;
  }

  /* ---- écran de victoire ---- */

  .win {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    background: rgba(10, 10, 16, 0.72);
    backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  .win.on { opacity: 1; pointer-events: auto; }

  .win strong {
    font-size: clamp(1.6rem, 7vw, 2.4rem);
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #ffe9a8;
  }

  .win p { color: rgba(232, 232, 240, 0.5); font-size: 0.9rem; }
  .win-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
  .win-astuce { font-size: 0.78rem !important; opacity: 0.6; }

  .win .btn {
    font-size: 0.95rem;
    padding: 0.7rem 1.5rem;
    background: rgba(255, 233, 168, 0.14);
    border-color: rgba(255, 233, 168, 0.45);
    color: #ffe9a8;
  }
</style>
</head>
<body>

<canvas id="jeu"></canvas>

<div class="hud">
  <a class="back" href="../index.html#/t/poc" aria-label="Retour au hub">←</a>
  <span class="seed" id="seed">LUX-0000</span>
  <button type="button" class="btn" id="reset">Reset</button>
  <button type="button" class="btn" id="next">Niveau suivant</button>
</div>

<p class="hint" id="hint">Pose le doigt : la lumière suit. Les carrés éclairés relaient leur regard.</p>

<div class="win" id="win">
  <strong>Lumière atteinte</strong>
  <p id="win-detail"></p>
  <div class="win-actions">
    <button type="button" class="btn" id="win-rejouer">Rejouer</button>
    <button type="button" class="btn" id="win-next">Niveau suivant</button>
  </div>
  <p class="win-astuce">Touche le fond pour revoir le niveau</p>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('jeu');
  const ctx = canvas.getContext('2d');
  // calque d'obscurité séparé : on y perce des trous en destination-out, puis
  // on le pose sur la scène. Tout ce qui n'a pas été percé reste dans la nuit.
  // Le calque d'obscurité n'est fait que de dégradés très doux : le rendre à la
  // moitié de la résolution puis l'étirer ne se voit pas, et sa rastérisation
  // coûte quatre fois moins. Mesuré sous throttle CPU ×4 : dessin 23.1 ms -> 8.2 ms.
  const QLUM = 0.5;
  const lum = document.createElement('canvas');
  const lctx = lum.getContext('2d');

  let W = 0, H = 0, DPR = 1;

  /* ==================================================== aléatoire ======== */

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function grainDepuisTexte(txt) {
    let h = 2166136261;
    for (let i = 0; i < txt.length; i++) {
      h ^= txt.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  /* ==================================================== géométrie ======== */

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // écart angulaire signé le plus court
  function ecartAngle(a, b) {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }

  // intersection segment / rectangle aligné (dalle opaque)
  function segmentCoupeRect(x1, y1, x2, y2, r) {
    const gauche = r.x, droite = r.x + r.w, haut = r.y, bas = r.y + r.h;
    if (Math.max(x1, x2) < gauche || Math.min(x1, x2) > droite) return false;
    if (Math.max(y1, y2) < haut || Math.min(y1, y2) > bas) return false;
    // test de séparation : les quatre coins du même côté de la droite ?
    const dx = x2 - x1, dy = y2 - y1;
    let signe = 0;
    for (const [cx, cy] of [[gauche, haut], [droite, haut], [droite, bas], [gauche, bas]]) {
      const s = Math.sign(dx * (cy - y1) - dy * (cx - x1));
      if (s === 0) continue;
      if (signe === 0) signe = s;
      else if (s !== signe) return true;
    }
    return signe === 0;
  }

  /* ==================================================== le niveau ======== */

  const EMOTIONS = { PEUR: 'peur', COLERE: 'colere', CURIEUX: 'curieux' };

  let niveau = null;
  let numero = 1;

  function dims() {
    const t = clamp(Math.min(W, H) * 0.105, 26, 52);   // côté d'un carré
    return {
      taille: t,
      portee: Math.min(W, H) * 0.62,                    // longueur d'un faisceau
      lanterne: Math.min(W, H) * 0.19,                  // rayon du doigt
      cone: 0.20,                                       // demi-angle du faisceau
    };
  }

  // ---------------------------------------------------------------------
  // Génération en marche arrière : on part de la sortie et on remonte en
  // plaçant des relais dont le regard au repos vise le maillon précédent.
  // La solution est donc construite, pas cherchée — le solver ne fait que
  // la vérifier, et rejette ce qui est trop court ou injouable.
  // ---------------------------------------------------------------------
  function construire(rnd, D) {
    const marge = D.taille * 1.5;
    const hautZone = marge + 40;
    const basZone = H - marge - 90;
    if (basZone - hautZone < D.taille * 5) return null;

    const nbRelais = 3 + Math.floor(rnd() * 3);          // 3 à 5
    const pasY = (basZone - hautZone) / (nbRelais + 0.6);

    const sortie = {
      x: marge + rnd() * (W - marge * 2),
      y: hautZone,
      r: D.taille * 0.62,
    };

    const persos = [];
    let cible = { x: sortie.x, y: sortie.y };

    for (let i = 0; i < nbRelais; i++) {
      const y = hautZone + pasY * (i + 1);
      // décalage latéral : assez pour que la chaîne serpente, pas trop pour
      // que le faisceau reste dans sa portée
      const ecart = (rnd() * 2 - 1) * Math.min(W * 0.34, D.portee * 0.55);
      const x = clamp(cible.x + ecart, marge, W - marge);

      const p = {
        x, y,
        baseX: x, baseY: y,
        vx: 0, vy: 0,
        sx: 1, sy: 1, vsx: 0, vsy: 0,
        regard: Math.atan2(cible.y - y, cible.x - x),
        eclaire: false,
        tremble: rnd() * TAU,
      };
      p.regardRepos = p.regard;
      persos.push(p);
      cible = { x, y };
    }

    // Le dernier maillon doit rester à portée de doigt : c'est par lui que le
    // joueur entre dans la chaîne.
    const entree = persos[persos.length - 1];
    if (entree.y < H * 0.45) return null;

    // --- émotions ---
    // La chaîne alterne curieux (le regard vagabonde, le faisceau tremble) et
    // peureux (se décalent quand on les éclaire).
    // L'amplitude du balayage est volontairement faible (~±9°) face au demi-cône
    // de 0.20 rad : mesuré à ±1.3 rad, un maillon n'était aligné que 10 % du
    // temps et une chaîne de quatre ne s'alignait jamais — le solver validait
    // un graphe que la physique démolissait en 200 ms. Le balayage reste de la
    // vie, la difficulté est ailleurs (placement de la lanterne, coléreux).
    persos.forEach((p, i) => {
      p.emotion = (i === persos.length - 1 || rnd() < 0.45) ? EMOTIONS.PEUR : EMOTIONS.CURIEUX;
      p.balayage = (rnd() < 0.5 ? 1 : -1) * (0.5 + rnd() * 0.45);
      p.amplitude = 0.10 + rnd() * 0.09;
    });

    // --- coléreux : ils chargent la lumière et bloquent les faisceaux ---
    const nbColere = rnd() < 0.65 ? 1 : 2;
    for (let i = 0; i < nbColere; i++) {
      for (let essai = 0; essai < 30; essai++) {
        const x = marge + rnd() * (W - marge * 2);
        const y = hautZone + rnd() * (basZone - hautZone);
        // il ne doit gêner aucun maillon dès le départ, sinon le niveau est
        // mort-né
        if (persos.some((p) => Math.hypot(p.x - x, p.y - y) < D.taille * 2.6)) continue;
        if (Math.hypot(sortie.x - x, sortie.y - y) < D.taille * 3) continue;
        const c = {
          x, y, baseX: x, baseY: y, vx: 0, vy: 0,
          sx: 1, sy: 1, vsx: 0, vsy: 0,
          regard: rnd() * TAU, emotion: EMOTIONS.COLERE,
          eclaire: false, tremble: rnd() * TAU,
          balayage: 0, amplitude: 0,
        };
        c.regardRepos = c.regard;
        persos.push(c);
        break;
      }
    }

    // --- dalles opaques, posées hors des lignes de vue de la chaîne ---
    const murs = [];
    const nbMurs = 2 + Math.floor(rnd() * 3);
    for (let i = 0; i < nbMurs; i++) {
      for (let essai = 0; essai < 40; essai++) {
        const w = D.taille * (0.7 + rnd() * 2.2);
        const h = D.taille * (0.7 + rnd() * 2.2);
        const m = {
          x: marge * 0.3 + rnd() * (W - w - marge * 0.6),
          y: hautZone + rnd() * (basZone - hautZone - h),
          w, h,
        };
        if (persos.some((p) => segmentCoupeRect(p.x, p.y, p.x, p.y, m))) continue;
        if (bloqueLaChaine(persos, sortie, m, nbRelais)) continue;
        if (persos.some((p) => Math.hypot(p.x - (m.x + w / 2), p.y - (m.y + h / 2)) < D.taille * 1.6)) continue;
        murs.push(m);
        break;
      }
    }

    return { persos, murs, sortie, nbRelais, chaine: persos.slice(0, nbRelais) };
  }

  function bloqueLaChaine(persos, sortie, mur, nbRelais) {
    for (let i = 0; i < nbRelais; i++) {
      const a = persos[i];
      const b = i === 0 ? sortie : persos[i - 1];
      if (segmentCoupeRect(a.x, a.y, b.x, b.y, mur)) return true;
    }
    return false;
  }

  /* ============================================== propagation lumière ==== */

  // Un carré est éclairé s'il tombe dans le cône d'un faisceau, à portée, et
  // qu'aucune dalle ni aucun coléreux ne coupe la ligne de vue.
  function vueLibre(x1, y1, x2, y2, murs, bloqueurs) {
    for (const m of murs) if (segmentCoupeRect(x1, y1, x2, y2, m)) return false;
    for (const b of bloqueurs) {
      const demi = b.demi;
      const r = { x: b.x - demi, y: b.y - demi, w: demi * 2, h: demi * 2 };
      if (segmentCoupeRect(x1, y1, x2, y2, r)) return false;
    }
    return true;
  }

  function dansLeCone(sx, sy, angle, tx, ty, portee, demiAngle) {
    const d = Math.hypot(tx - sx, ty - sy);
    if (d > portee || d < 1) return false;
    const a = Math.atan2(ty - sy, tx - sx);
    // le cône s'élargit un peu de près, sinon rien n'est jamais touché
    const tolerance = demiAngle + Math.min(0.5, 26 / Math.max(d, 1));
    return Math.abs(ecartAngle(angle, a)) <= tolerance;
  }

  // Calcule qui est éclairé, à partir d'un point de lanterne. Renvoie aussi le
  // nombre de relais traversés : c'est ce qui sert au solver.
  function propager(etat, lanterneX, lanterneY, D, rayonLanterne) {
    const { persos, murs, sortie } = etat;
    const eclaires = new Set();
    let profondeur = new Map();

    const bloqueurs = persos
      .filter((p) => p.emotion === EMOTIONS.COLERE)
      .map((p) => ({ x: p.x, y: p.y, demi: D.taille * 0.5 }));

    // Premier cercle : la lanterne du joueur.
    // Marge d'hystérésis sur ce qui est déjà allumé : mesuré, un peureux reculait
    // de 4 px, sortait du halo de 1 px, s'éteignait, cessait donc de fuir,
    // revenait, se rallumait — le maillon clignotait en boucle et la chaîne ne
    // tenait jamais les 0.45 s. Élargir le seuil de sortie casse le cycle sans
    // déplacer personne (déplacer un maillon casserait la géométrie en aval).
    for (const p of persos) {
      if (p.emotion === EMOTIONS.COLERE) continue;
      if (Math.hypot(p.x - lanterneX, p.y - lanterneY) > rayonLanterne * (p.eclaire ? 1.3 : 1)) continue;
      if (!vueLibre(lanterneX, lanterneY, p.x, p.y, murs, bloqueurs.filter((b) => b.x !== p.x || b.y !== p.y))) continue;
      eclaires.add(p);
      profondeur.set(p, 1);
    }

    // relais en chaîne, jusqu'au point fixe
    for (let tour = 0; tour < 8; tour++) {
      let ajout = false;
      for (const src of [...eclaires]) {
        for (const cible of persos) {
          if (cible === src || eclaires.has(cible)) continue;
          if (cible.emotion === EMOTIONS.COLERE) continue;
          const m = cible.eclaire ? 1.22 : 1;
          if (!dansLeCone(src.x, src.y, src.regard, cible.x, cible.y, D.portee * m, D.cone * m)) continue;
          const autres = bloqueurs.filter((b) => !(b.x === cible.x && b.y === cible.y));
          if (!vueLibre(src.x, src.y, cible.x, cible.y, murs, autres)) continue;
          eclaires.add(cible);
          profondeur.set(cible, (profondeur.get(src) || 1) + 1);
          ajout = true;
        }
      }
      if (!ajout) break;
    }

    // la sortie est-elle touchée ?
    let sortieTouchee = 0;
    for (const src of eclaires) {
      if (!dansLeCone(src.x, src.y, src.regard, sortie.x, sortie.y, D.portee, D.cone)) continue;
      if (!vueLibre(src.x, src.y, sortie.x, sortie.y, murs, bloqueurs)) continue;
      sortieTouchee = Math.max(sortieTouchee, profondeur.get(src) || 1);
    }
    // la lanterne peut aussi toucher la sortie directement : c'est justement ce
    // qu'il faut interdire, un niveau doit passer par des relais
    const directe = Math.hypot(sortie.x - lanterneX, sortie.y - lanterneY) <= rayonLanterne
      && vueLibre(lanterneX, lanterneY, sortie.x, sortie.y, murs, bloqueurs);

    return { eclaires, relais: sortieTouchee, directe };
  }

  /* ==================================================== le solver ======== */

  // Vérifie le niveau sur sa configuration au repos : depuis une grille de
  // positions de doigt, la lumière atteint-elle la sortie, et en combien de
  // relais ? En dessous de 3, le niveau est trop pauvre et la graine part à la
  // poubelle. C'est une vérification du graphe de lumière, pas une simulation
  // de la physique : celle-ci vient se superposer ensuite.
  function resoudre(etat, D) {
    let meilleur = 0;
    let solutions = 0;
    const pas = Math.max(28, Math.min(W, H) / 14);

    for (let y = H * 0.45; y < H - 30; y += pas) {
      for (let x = 20; x < W - 20; x += pas) {
        const r = propager(etat, x, y, D, D.lanterne);
        if (r.directe) continue;          // trop facile : on ignore ce point
        if (r.relais >= 1) {
          solutions++;
          meilleur = Math.max(meilleur, r.relais);
        }
      }
    }
    return { relais: meilleur, solutions };
  }

  function genererNiveau(grainTexte) {
    const rnd = mulberry32(grainDepuisTexte(grainTexte));
    const D = dims();
    const t0 = performance.now();
    let rejets = 0;

    for (let essai = 0; essai < 120; essai++) {
      const etat = construire(rnd, D);
      if (!etat) { rejets++; continue; }
      const verdict = resoudre(etat, D);
      // au moins 3 relais traversés, et assez de positions gagnantes pour que
      // ce ne soit pas un coup de chance au pixel près
      if (verdict.relais >= 3 && verdict.solutions >= 3) {
        etat.grain = grainTexte;
        etat.verdict = verdict;
        etat.msSolver = performance.now() - t0;
        etat.rejets = rejets;
        return etat;
      }
      rejets++;
    }

    // repli : on rend le dernier construit plutôt que rien
    const secours = construire(rnd, D) || construire(mulberry32(1), D);
    if (secours) {
      secours.grain = grainTexte;
      secours.verdict = { relais: 0, solutions: 0 };
      secours.msSolver = performance.now() - t0;
      secours.rejets = rejets;
    }
    return secours;
  }

  /* ==================================================== physique ========= */

  // Jelly : l'échelle vise une cible dictée par la vitesse (formule du spec),
  // et un ressort la ramène vers 1. D'où l'écrasement à l'impact puis le
  // ballotement qui suit.
  function majJelly(p, dt) {
    const cibleX = clamp(1 + p.vy * 0.02 - p.vx * 0.02, 0.62, 1.42);
    const cibleY = clamp(1 + p.vx * 0.02 - p.vy * 0.02, 0.62, 1.42);
    const RAIDEUR = 190, AMORTI = 13;
    p.vsx += (cibleX - p.sx) * RAIDEUR * dt;
    p.vsy += (cibleY - p.sy) * RAIDEUR * dt;
    p.vsx -= p.vsx * AMORTI * dt;
    p.vsy -= p.vsy * AMORTI * dt;
    p.sx += p.vsx * dt;
    p.sy += p.vsy * dt;
  }

  function majPhysique(etat, D, dt, doigt, temps) {
    const { persos, murs } = etat;

    for (const p of persos) {
      const eclaire = p.eclaire;

      if (p.emotion === EMOTIONS.CURIEUX) {
        // phare : balaye autour de son regard de repos. Éclairé, il ralentit —
        // c'est le levier du joueur pour le figer au bon angle.
        const vitesse = p.balayage * (eclaire ? 0.28 : 1);
        p.phase = (p.phase || 0) + vitesse * dt;
        p.regard = p.regardRepos + Math.sin(p.phase) * p.amplitude;
        // il reste immobile, mais frissonne quand on le regarde
        if (eclaire) {
          p.vx += Math.cos(temps * 9 + p.tremble) * 8 * dt;
          p.vy += Math.sin(temps * 11 + p.tremble) * 8 * dt;
        }

      } else if (p.emotion === EMOTIONS.PEUR) {
        // fuit le doigt, mais garde son regard : il continue de relayer
        if (eclaire && doigt.actif) {
          const dx = p.x - doigt.x, dy = p.y - doigt.y;
          const d = Math.hypot(dx, dy) || 1;
          const force = 260 * clamp(1 - d / (D.lanterne * 1.6), 0, 1);
          p.vx += (dx / d) * force * dt;
          p.vy += (dy / d) * force * dt;
          p.regard = p.regardRepos + Math.sin(temps * 14 + p.tremble) * 0.09;
        } else {
          // il revient tranquillement à sa place
          p.vx += (p.baseX - p.x) * 2.4 * dt;
          p.vy += (p.baseY - p.y) * 2.4 * dt;
          p.regard += ecartAngle(p.regard, p.regardRepos) * 3 * dt;
        }

      } else if (p.emotion === EMOTIONS.COLERE) {
        // charge la source de lumière pour la bloquer
        if (doigt.actif) {
          const dx = doigt.x - p.x, dy = doigt.y - p.y;
          const d = Math.hypot(dx, dy) || 1;
          if (d < D.portee) {
            p.vx += (dx / d) * 170 * dt;
            p.vy += (dy / d) * 170 * dt;
          }
          p.regard = Math.atan2(dy, dx);
        } else {
          p.vx += (p.baseX - p.x) * 1.6 * dt;
          p.vy += (p.baseY - p.y) * 1.6 * dt;
        }
      }

      // frottement
      const f = Math.pow(0.0016, dt);
      p.vx *= f; p.vy *= f;

      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // laisse : un coléreux mesuré parcourait 79 px et venait couper la chaîne
      // au milieu du plateau. Il charge toujours, mais sans quitter son poste :
      // le graphe de lumière validé par le solver reste valable.
      const laisse = D.taille * 1.15;
      const ex = p.x - p.baseX, ey = p.y - p.baseY;
      const d = Math.hypot(ex, ey);
      if (d > laisse) {
        p.x = p.baseX + (ex / d) * laisse;
        p.y = p.baseY + (ey / d) * laisse;
        p.vx *= 0.4; p.vy *= 0.4;
      }

      // bords
      const demi = D.taille * 0.5;
      if (p.x < demi) { p.x = demi; p.vx = Math.abs(p.vx) * 0.55; }
      if (p.x > W - demi) { p.x = W - demi; p.vx = -Math.abs(p.vx) * 0.55; }
      if (p.y < demi + 44) { p.y = demi + 44; p.vy = Math.abs(p.vy) * 0.55; }
      if (p.y > H - demi) { p.y = H - demi; p.vy = -Math.abs(p.vy) * 0.55; }

      // dalles
      for (const m of murs) {
        if (p.x + demi < m.x || p.x - demi > m.x + m.w) continue;
        if (p.y + demi < m.y || p.y - demi > m.y + m.h) continue;
        const gauche = (m.x - demi) - p.x, droite = (m.x + m.w + demi) - p.x;
        const haut = (m.y - demi) - p.y, bas = (m.y + m.h + demi) - p.y;
        const dx = Math.abs(gauche) < Math.abs(droite) ? gauche : droite;
        const dy = Math.abs(haut) < Math.abs(bas) ? haut : bas;
        if (Math.abs(dx) < Math.abs(dy)) { p.x += dx; p.vx = -p.vx * 0.5; }
        else { p.y += dy; p.vy = -p.vy * 0.5; }
      }
    }

    // collisions entre carrés : rebond élastique, d'où l'écrasement mutuel
    for (let i = 0; i < persos.length; i++) {
      for (let j = i + 1; j < persos.length; j++) {
        const a = persos[i], b = persos[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy);
        const mini = D.taille * 0.95;
        if (d >= mini || d === 0) continue;
        const nx = dx / d, ny = dy / d;
        const chevauche = (mini - d) * 0.5;
        a.x -= nx * chevauche; a.y -= ny * chevauche;
        b.x += nx * chevauche; b.y += ny * chevauche;
        const impact = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (impact < 0) {
          const j2 = impact * 1.25;
          a.vx += nx * j2; a.vy += ny * j2;
          b.vx -= nx * j2; b.vy -= ny * j2;
        }
      }
    }

    for (const p of persos) majJelly(p, dt);
  }

  /* ==================================================== rendu ============ */

  function carreArrondi(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  const COULEURS = {
    [EMOTIONS.PEUR]: '#8fd0ff',
    [EMOTIONS.COLERE]: '#ff7a6b',
    [EMOTIONS.CURIEUX]: '#ffd479',
  };

  function dessinerPerso(p, D, temps, opacite) {
    const demi = D.taille * 0.5;
    const w = D.taille * p.sx, h = D.taille * p.sy;
    const base = opacite === undefined ? 1 : opacite;

    ctx.save();
    ctx.translate(p.x, p.y);

    const couleur = COULEURS[p.emotion];
    ctx.fillStyle = p.eclaire ? couleur : '#1b1b26';
    ctx.strokeStyle = p.eclaire ? '#ffffff' : couleur;
    ctx.lineWidth = p.eclaire ? 2 : 1.6;
    ctx.globalAlpha = base * (p.eclaire ? 1 : 0.85);

    carreArrondi(ctx, -w / 2, -h / 2, w, h, Math.min(w, h) * 0.32);
    ctx.fill();
    ctx.stroke();
    ctx.globalAlpha = base;

    // --- visage ---
    const ecart = demi * 0.38 * p.sx;
    const oeilY = -demi * 0.08 * p.sy;
    const rOeil = demi * 0.23;
    const rPupille = rOeil * 0.5;
    // la pupille indique le vecteur du regard
    const px = Math.cos(p.regard) * rOeil * 0.42;
    const py = Math.sin(p.regard) * rOeil * 0.42;

    for (const dx of [-ecart, ecart]) {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(dx, oeilY, rOeil, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#0a0a10';
      ctx.beginPath();
      ctx.arc(dx + px, oeilY + py, rPupille, 0, TAU);
      ctx.fill();
    }

    // --- sourcils, dessinés selon l'émotion ---
    ctx.strokeStyle = p.eclaire ? '#0a0a10' : couleur;
    ctx.lineWidth = Math.max(2, demi * 0.13);
    ctx.lineCap = 'round';
    const sy = oeilY - rOeil * 1.5;
    const lg = rOeil * 1.15;

    if (p.emotion === EMOTIONS.PEUR) {
      // levés et tremblants
      const t = Math.sin(temps * 16 + p.tremble) * rOeil * 0.12;
      for (const [dx, sens] of [[-ecart, 1], [ecart, -1]]) {
        ctx.beginPath();
        ctx.moveTo(dx - lg * 0.5 * sens, sy - rOeil * 0.15 + t);
        ctx.lineTo(dx + lg * 0.5 * sens, sy - rOeil * 0.5 + t);
        ctx.stroke();
      }
    } else if (p.emotion === EMOTIONS.COLERE) {
      // froncés en V
      for (const [dx, sens] of [[-ecart, 1], [ecart, -1]]) {
        ctx.beginPath();
        ctx.moveTo(dx - lg * 0.5 * sens, sy - rOeil * 0.45);
        ctx.lineTo(dx + lg * 0.5 * sens, sy + rOeil * 0.28);
        ctx.stroke();
      }
    } else {
      // asymétriques : un levé, un droit
      ctx.beginPath();
      ctx.moveTo(-ecart - lg * 0.5, sy - rOeil * 0.55);
      ctx.lineTo(-ecart + lg * 0.5, sy - rOeil * 0.15);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ecart - lg * 0.5, sy);
      ctx.lineTo(ecart + lg * 0.5, sy);
      ctx.stroke();
    }

    ctx.restore();
  }

  function percerFaisceau(c, x, y, angle, portee, demiAngle, force) {
    const g = c.createRadialGradient(x, y, 0, x, y, portee);
    g.addColorStop(0, `rgba(0,0,0,${force})`);
    g.addColorStop(0.55, `rgba(0,0,0,${force * 0.75})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(x, y);
    c.arc(x, y, portee, angle - demiAngle, angle + demiAngle);
    c.closePath();
    c.fill();
  }

  // Le voile d'obscurité est posé à 0.94 : tout ce qu'il recouvre disparaît
  // complètement. Sans ce rappel dessiné par-dessus, un niveau non éclairé est
  // un écran noir et le joueur n'a rien à viser. On garde donc une trace ténue
  // du décor et des personnages dans le noir — assez pour planifier la chaîne,
  // pas assez pour tuer le contraste quand la lumière arrive.
  function rappelAmbiant(etat, D, temps) {
    const { persos, murs, sortie } = etat;

    ctx.save();
    ctx.lineWidth = 1;
    for (const m of murs) {
      ctx.fillStyle = 'rgba(255,255,255,0.025)';
      ctx.strokeStyle = 'rgba(255,255,255,0.10)';
      carreArrondi(ctx, m.x, m.y, m.w, m.h, 6);
      ctx.fill();
      ctx.stroke();
    }

    if (!etat.sortieTouchee) {
      const pulse = 1 + Math.sin(temps * 3) * 0.06;
      ctx.strokeStyle = 'rgba(255,233,168,0.34)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sortie.x, sortie.y, sortie.r * pulse, 0, TAU);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,233,168,0.12)';
      ctx.beginPath();
      ctx.arc(sortie.x, sortie.y, sortie.r * 0.52, 0, TAU);
      ctx.fill();
    }

    for (const p of persos) if (!p.eclaire) dessinerPerso(p, D, temps, 0.4);
    ctx.restore();
  }

  function dessiner(etat, D, doigt, temps, eclaires) {
    const { persos, murs, sortie } = etat;

    ctx.fillStyle = '#0a0a10';
    ctx.fillRect(0, 0, W, H);

    // --- dalles ---
    for (const m of murs) {
      ctx.fillStyle = '#14141d';
      ctx.strokeStyle = 'rgba(255,255,255,0.07)';
      ctx.lineWidth = 1;
      carreArrondi(ctx, m.x, m.y, m.w, m.h, 6);
      ctx.fill();
      ctx.stroke();
    }

    // --- sortie ---
    const actif = etat.sortieTouchee;
    const pulse = 1 + Math.sin(temps * 3) * 0.06;
    ctx.save();
    ctx.translate(sortie.x, sortie.y);
    ctx.strokeStyle = actif ? '#ffe9a8' : 'rgba(255,233,168,0.32)';
    ctx.lineWidth = actif ? 3.5 : 2;
    ctx.beginPath();
    ctx.arc(0, 0, sortie.r * pulse, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = actif ? 'rgba(255,233,168,0.5)' : 'rgba(255,233,168,0.09)';
    ctx.beginPath();
    ctx.arc(0, 0, sortie.r * 0.52, 0, TAU);
    ctx.fill();
    ctx.restore();

    for (const p of persos) dessinerPerso(p, D, temps);

    // --- calque d'obscurité : on perce, puis on pose ---
    lctx.setTransform(DPR * QLUM, 0, 0, DPR * QLUM, 0, 0);
    lctx.globalCompositeOperation = 'source-over';
    lctx.fillStyle = 'rgba(10,10,16,0.94)';
    lctx.fillRect(0, 0, W, H);

    lctx.globalCompositeOperation = 'destination-out';
    if (doigt.actif) {
      const g = lctx.createRadialGradient(doigt.x, doigt.y, 0, doigt.x, doigt.y, D.lanterne);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(0.6, 'rgba(0,0,0,0.85)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      lctx.fillStyle = g;
      lctx.beginPath();
      lctx.arc(doigt.x, doigt.y, D.lanterne, 0, TAU);
      lctx.fill();
    }
    for (const p of eclaires) {
      percerFaisceau(lctx, p.x, p.y, p.regard, D.portee, D.cone + 0.05, 0.95);
    }
    lctx.globalCompositeOperation = 'source-over';

    // on repasse en pixels device pour étirer le calque demi-résolution
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(lum, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    rappelAmbiant(etat, D, temps);

    // --- halo chaud par-dessus, pour que la lumière ait une couleur ---
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    if (doigt.actif) {
      const g = ctx.createRadialGradient(doigt.x, doigt.y, 0, doigt.x, doigt.y, D.lanterne);
      g.addColorStop(0, 'rgba(255,240,200,0.16)');
      g.addColorStop(1, 'rgba(255,240,200,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(doigt.x, doigt.y, D.lanterne, 0, TAU);
      ctx.fill();
    }
    for (const p of eclaires) {
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, D.portee);
      const c = COULEURS[p.emotion];
      g.addColorStop(0, c + '30');
      g.addColorStop(1, c + '00');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.arc(p.x, p.y, D.portee, p.regard - D.cone, p.regard + D.cone);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  /* ==================================================== boucle =========== */

  const doigt = { x: 0, y: 0, actif: false };
  let D = dims();
  let dernier = performance.now();
  let tempsGagne = 0;
  let gagne = false;

  // Garde-fou de cadence. Le jeu est limité par le remplissage : le coût suit
  // directement le nombre de pixels du canvas (mesuré : 780x1688 -> 66 ms/frame,
  // 390x844 -> 21 ms sur la même machine bridée). Impossible de vérifier les
  // 60 fps sur un vrai téléphone depuis ici, donc on mesure la cadence pendant
  // le jeu et on descend d'un palier de résolution si elle décroche. Cliquet à
  // sens unique : jamais de va-et-vient entre deux résolutions.
  const PALIERS = [2, 1.5, 1];
  let palier = 0;
  let fenetre = [];

  function surveillerCadence(dt) {
    if (palier >= PALIERS.length - 1) return;
    fenetre.push(dt);
    if (fenetre.length < 90) return;
    const median = [...fenetre].sort((a, b) => a - b)[45];
    fenetre = [];
    if (median > 0.022) { palier++; redimensionner(); }
  }

  function redimensionner() {
    DPR = Math.min(window.devicePixelRatio || 1, PALIERS[palier]);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    lum.width = Math.ceil(canvas.width * QLUM);
    lum.height = Math.ceil(canvas.height * QLUM);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    D = dims();
  }

  function boucle(maintenant) {
    requestAnimationFrame(boucle);
    const dt = Math.min((maintenant - dernier) / 1000, 1 / 30);
    dernier = maintenant;
    const temps = maintenant / 1000;
    if (!niveau) return;

    if (doigt.actif) surveillerCadence(dt);

    majPhysique(niveau, D, dt, doigt, temps);

    const r = doigt.actif
      ? propager(niveau, doigt.x, doigt.y, D, D.lanterne)
      : { eclaires: new Set(), relais: 0, directe: false };

    for (const p of niveau.persos) p.eclaire = r.eclaires.has(p);
    niveau.sortieTouchee = r.relais > 0;

    // il faut tenir la lumière un court instant : ça évite de gagner sur un
    // alignement d'une seule frame
    if (niveau.sortieTouchee && !gagne) {
      tempsGagne += dt;
      if (tempsGagne > 0.45) victoire(r.relais);
    } else if (!niveau.sortieTouchee) {
      tempsGagne = 0;
    }

    dessiner(niveau, D, doigt, temps, r.eclaires);
  }

  /* ==================================================== parties ========== */

  const elSeed = document.getElementById('seed');
  const elWin = document.getElementById('win');
  const elWinDetail = document.getElementById('win-detail');
  const elHint = document.getElementById('hint');

  function charger(grain) {
    const n = genererNiveau(grain);
    if (!n) return;
    niveau = n;
    gagne = false;
    tempsGagne = 0;
    elWin.classList.remove('on');
    elSeed.textContent = grain;
    elHint.style.opacity = '1';
  }

  function nouvelleSeed() {
    numero++;
    return 'LUX-' + String(1000 + numero * 7 + Math.floor(Math.random() * 900)).slice(0, 4);
  }

  function victoire(relais) {
    gagne = true;
    elWinDetail.textContent = `${relais} relais traversés · ${niveau.grain}`;
    elWin.classList.add('on');
  }

  let grainCourant = 'LUX-1042';

  document.getElementById('reset').addEventListener('click', () => charger(grainCourant));
  const suivant = () => { grainCourant = nouvelleSeed(); charger(grainCourant); };
  document.getElementById('next').addEventListener('click', suivant);
  document.getElementById('win-next').addEventListener('click', suivant);
  document.getElementById('win-rejouer').addEventListener('click', () => charger(grainCourant));
  elWin.addEventListener('click', (e) => { if (e.target === elWin) elWin.classList.remove('on'); });

  /* ==================================================== entrées ========== */

  function position(e) {
    const r = canvas.getBoundingClientRect();
    doigt.x = e.clientX - r.left;
    doigt.y = e.clientY - r.top;
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    position(e);
    doigt.actif = true;
    elHint.style.opacity = '0';
  });
  canvas.addEventListener('pointermove', (e) => { if (doigt.actif) position(e); });
  ['pointerup', 'pointercancel'].forEach((t) =>
    canvas.addEventListener(t, () => { doigt.actif = false; }));

  window.addEventListener('resize', () => {
    redimensionner();
    charger(grainCourant);   // les positions sont en pixels : on régénère
  });

  redimensionner();
  charger(grainCourant);
  requestAnimationFrame(boucle);

  // Exposé pour les mesures automatisées : temps du solver, validité d'une
  // graine, et état vivant pour vérifier qu'un niveau reste gagnable une fois
  // la physique en marche (c'est comme ça qu'on a trouvé le peureux clignotant).
  window.__lux = {
    info: () => niveau && {
      grain: niveau.grain,
      relais: niveau.verdict.relais,
      solutions: niveau.verdict.solutions,
      msSolver: niveau.msSolver,
      rejets: niveau.rejets,
      persos: niveau.persos.length,
      murs: niveau.murs.length,
    },
    charger,
    tester: (x, y) => propager(niveau, x, y, D, D.lanterne).relais,
    etat: () => niveau,
    doigt: () => ({ ...doigt }),
  };
})();
</script>
</body>
</html>

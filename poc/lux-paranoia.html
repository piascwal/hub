<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lux &amp; Paranoia</title>
<meta name="description" content="Aventure procédurale dans le noir : un petit peureux qui grandit en lumière, gagne un faisceau, des braises et des formes nouvelles.">
<meta name="theme-color" content="#08080e">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    background: #08080e;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #e8e8f0;
    -webkit-user-select: none;
    user-select: none;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---- interface ---- */

  .hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: max(0.7rem, env(safe-area-inset-top)) 0.8rem 0.7rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    pointer-events: none;
    z-index: 10;
  }

  .hud > * { pointer-events: auto; }

  .back {
    color: rgba(232, 232, 240, 0.55);
    text-decoration: none;
    font-size: 0.95rem;
    padding: 0.35rem 0.55rem;
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.05);
  }

  .zone {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: rgba(232, 232, 240, 0.4);
    font-variant-numeric: tabular-nums;
  }

  .btn {
    font: inherit;
    font-size: 0.85rem;
    color: #e8e8f0;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    padding: 0.4rem 0.85rem;
    cursor: pointer;
  }

  .btn:active { background: rgba(255, 255, 255, 0.14); }

  .jauge {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .forme {
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    transition: color 0.4s ease;
  }

  .barre {
    width: 80px;
    height: 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.09);
    overflow: hidden;
  }

  .barre i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 999px;
    transition: width 0.18s linear, background 0.4s ease;
  }

  /* bonus temporaire en cours */
  .bonus {
    position: fixed;
    left: 50%;
    top: 3.6rem;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 0.45rem;
    padding: 0.3rem 0.75rem;
    border-radius: 999px;
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    z-index: 11;
    pointer-events: none;
  }

  .bonus.on { display: flex; }

  .bonus b { font-weight: 600; }

  .bonus s {
    display: block;
    height: 3px;
    width: 46px;
    border-radius: 999px;
    background: currentColor;
    opacity: 0.55;
  }

  /* boutons d'action : ils n'apparaissent qu'une fois la forme débloquée */
  .actions {
    position: fixed;
    right: max(0.9rem, env(safe-area-inset-right));
    bottom: max(1.4rem, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column-reverse;
    gap: 0.6rem;
    z-index: 12;
  }

  .rond {
    position: relative;
    overflow: hidden;
    touch-action: manipulation;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 2px solid;
    background: rgba(255, 255, 255, 0.06);
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    display: none;
    cursor: pointer;
    font-family: inherit;
    line-height: 1.25;
  }

  .rond.on { display: block; }
  .rond:disabled { opacity: 0.34; }
  /* anneau de recharge : sans lui, un bouton indisponible ressemble à un bouton
     cassé — c'est la même sensation que « ça ne marche pas » */
  .rond::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    background: conic-gradient(currentColor calc(var(--recharge, 1) * 360deg), transparent 0);
    opacity: 0.18;
    pointer-events: none;
  }

  #braise { border-color: rgba(255, 196, 120, 0.55); color: #ffc478; }
  #charge { border-color: rgba(255, 154, 107, 0.55); color: #ff9a6b; }
  #eclair { border-color: rgba(255, 246, 214, 0.6); color: #fff6d6; }

  .rond:active:not(:disabled) { background: rgba(255, 255, 255, 0.16); }

  .hint {
    position: fixed;
    left: 0; right: 0;
    bottom: max(1.1rem, env(safe-area-inset-bottom));
    padding: 0 6.5rem 0 1.2rem;
    text-align: center;
    font-size: 0.85rem;
    line-height: 1.45;
    color: rgba(232, 232, 240, 0.5);
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.5s ease;
  }

  /* bandeau passager : il informe sans arrêter le jeu */
  .toast {
    position: fixed;
    left: 50%;
    top: 22%;
    transform: translateX(-50%);
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    background: rgba(255, 122, 107, 0.16);
    border: 1px solid rgba(255, 122, 107, 0.4);
    color: #ffb4a8;
    font-size: 0.85rem;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 14;
  }

  .toast.on { opacity: 1; }

  /* bandeau d'évolution et de passage de zone */
  .flash {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    text-align: center;
    padding: 2rem;
    background: rgba(8, 8, 14, 0.74);
    backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .flash.on { opacity: 1; pointer-events: auto; }
  .flash strong { font-size: 1.7rem; letter-spacing: 0.02em; }
  .flash em { font-style: normal; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.55; }
  .flash p { font-size: 0.92rem; color: rgba(232, 232, 240, 0.62); max-width: 22rem; line-height: 1.5; }
</style>
</head>
<body>

<canvas id="jeu"></canvas>

<div class="hud">
  <a class="back" href="../index.html" aria-label="Retour au hub">←</a>
  <span class="zone" id="zone">ZONE 1</span>
  <span class="jauge">
    <span class="forme" id="forme">Peureux</span>
    <span class="barre"><i id="barre"></i></span>
  </span>
</div>

<div class="bonus" id="bonus"><b id="bonus-nom"></b><s id="bonus-jauge"></s></div>

<div class="actions">
  <button type="button" class="rond" id="braise">BRAISE<br><span id="braise-n">0</span></button>
  <button type="button" class="rond" id="charge">CHARGE</button>
  <button type="button" class="rond" id="eclair">ÉCLAT</button>
</div>

<p class="hint" id="hint">
  Pose le doigt n'importe où : un joystick apparaît sous lui.<br>
  Ramasse les lueurs. Fuis les regards rouges.
</p>

<div class="toast" id="toast"></div>

<div class="flash" id="flash">
  <em id="flash-sur"></em>
  <strong id="flash-titre"></strong>
  <p id="flash-texte"></p>
  <button type="button" class="btn" id="flash-ok">Continuer</button>
</div>

<script>
(() => {
  'use strict';

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function grainDepuisTexte(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  function ecartAngle(a, b) {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }

  function melange(hex, vers, t) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255]
      .map((v) => Math.round(v + (vers - v) * t));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }
  const eclaircir = (hex, t) => melange(hex, 255, t);
  const assombrir = (hex, t) => melange(hex, 0, t);
  const rgba = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  };

  /* ==================================================== formes =========== */

  // Une forme = une couleur, un halo, et EXACTEMENT UN verbe de plus. C'est la
  // règle : on ne découvre jamais deux mécaniques à la fois, sinon on n'en
  // comprend aucune.
  const FORMES = [
    { nom: 'Peureux', couleur: '#8fd0ff', seuil: 0, halo: 1.00, portee: 0, cone: 0,
      verbe: 'Le fil',
      texte: "Tu n'as qu'un halo minuscule. Mais ton chemin reste tracé derrière toi : tu ne peux pas te perdre, même sans voir les murs." },
    { nom: 'Curieux', couleur: '#ffd479', seuil: 22, halo: 1.28, portee: 5.2, cone: 0.34,
      verbe: 'Le faisceau',
      texte: "Un faisceau s'ouvre devant toi. Il porte loin, et il réveille les autres : un bonhomme éclairé relaie ta lumière avec son regard." },
    { nom: 'Veilleur', couleur: '#a8f0c8', seuil: 58, halo: 1.45, portee: 6.0, cone: 0.32,
      verbe: 'Les braises',
      texte: "Tu peux poser des braises. Elles éclairent pour toujours, et les rouges ne supportent pas leur lumière : une braise, c'est un abri." },
    { nom: 'Ardent', couleur: '#ff9a6b', seuil: 108, halo: 1.62, portee: 7.0, cone: 0.30,
      verbe: 'La charge',
      texte: "La charge est ta sortie de secours : une ruée où AUCUN regard ne peut te vider, et qui étourdit ce qu'elle bouscule. C'est comme ça qu'on traverse le cône d'une sentinelle." },
    { nom: 'Solaire', couleur: '#fff2c4', seuil: 170, halo: 1.9, portee: 8.2, cone: 0.30,
      verbe: "L'éclat",
      texte: "Un éclat circulaire qui aveugle tous les rouges autour de toi : quelques secondes où plus aucun regard ne te vide." },
  ];

  const EMOTIONS = { PEUR: 'peur', COLERE: 'colere', CURIEUX: 'curieux' };
  const COULEURS = {
    [EMOTIONS.PEUR]: '#8fd0ff',
    [EMOTIONS.COLERE]: '#ff7a6b',
    [EMOTIONS.CURIEUX]: '#ffd479',
  };

  // Les lueurs à effet. Chacune n'apparaît qu'à partir d'une forme donnée :
  // on n'introduit jamais un bonus avant que le joueur ait digéré le précédent.
  // Chaque bonus porte sa propre phrase : un nom seul ne dit rien. Et chacun se
  // VOIT sur le personnage — couleur du corps, du halo, particules — parce que
  // le mot dans la barre du haut n'est pas là où le joueur regarde.
  const BONUS = {
    eclat:   { couleur: '#ffe9a8', forme: 0, duree: 0,  nom: 'Lueur',
               phrase: '' },
    souffle: { couleur: '#8fd0ff', forme: 1, duree: 7,  nom: 'Voilé',
               phrase: 'Voilé — les sentinelles ne te voient plus' },
    braise:  { couleur: '#ffc478', forme: 2, duree: 0,  nom: 'Braise',
               phrase: '+1 braise à poser' },
    hate:    { couleur: '#a8f0c8', forme: 3, duree: 8,  nom: 'Hâte',
               phrase: 'Hâte — tu files bien plus vite' },
    prisme:  { couleur: '#d7b4ff', forme: 4, duree: 10, nom: 'Prisme',
               phrase: 'Prisme — ton faisceau s\'élargit et porte plus loin' },
  };

  /* ==================================================== le monde ========= */

  const CASE = 74;                 // côté d'une case de la grille, en pixels monde

  // Une zone est un plan de salles reliées par des couloirs. C'est volontairement
  // une grille : la seule chose à garantir ici, c'est « peut-on aller d'ici à
  // là », et sur une grille un parcours en largeur y répond exactement.
  function construireZone(rnd, numero) {
    const cols = 15 + Math.min(6, numero);
    const lignes = 20 + Math.min(8, numero * 2);
    const mur = [];
    for (let y = 0; y < lignes; y++) mur.push(new Array(cols).fill(1));

    const salles = [];
    const vise = 6 + Math.min(5, Math.floor(numero * 0.8));
    for (let essai = 0; essai < 220 && salles.length < vise; essai++) {
      const w = 3 + Math.floor(rnd() * 4);
      const h = 3 + Math.floor(rnd() * 4);
      const x = 1 + Math.floor(rnd() * (cols - w - 2));
      const y = 1 + Math.floor(rnd() * (lignes - h - 2));
      const chevauche = salles.some((s) =>
        x < s.x + s.w + 1 && x + w + 1 > s.x && y < s.y + s.h + 1 && y + h + 1 > s.y);
      if (chevauche) continue;
      salles.push({ x, y, w, h, cx: x + (w >> 1), cy: y + (h >> 1) });
    }
    if (salles.length < 3) return null;

    for (const s of salles) {
      for (let y = s.y; y < s.y + s.h; y++)
        for (let x = s.x; x < s.x + s.w; x++) mur[y][x] = 0;
    }

    const couloir = (a, b) => {
      let x = a.cx, y = a.cy;
      while (x !== b.cx) { mur[y][x] = 0; x += x < b.cx ? 1 : -1; }
      while (y !== b.cy) { mur[y][x] = 0; y += y < b.cy ? 1 : -1; }
      mur[y][x] = 0;
    };
    for (let i = 1; i < salles.length; i++) couloir(salles[i - 1], salles[i]);
    // deux raccourcis : sans ça le plan est un couloir unique et se parcourt bêtement
    for (let i = 0; i < 2; i++) {
      const a = salles[Math.floor(rnd() * salles.length)];
      const b = salles[Math.floor(rnd() * salles.length)];
      if (a !== b) couloir(a, b);
    }

    return { mur, cols, lignes, salles };
  }

  // Parcours en largeur sur les cases libres. Exact, et c'est tout l'intérêt :
  // ce que la génération promet, on le vérifie vraiment.
  function distances(z, depart) {
    const { mur, cols, lignes } = z;
    const d = [];
    for (let y = 0; y < lignes; y++) d.push(new Array(cols).fill(-1));
    if (mur[depart.cy][depart.cx]) return d;
    d[depart.cy][depart.cx] = 0;
    const file = [depart.cx, depart.cy];
    for (let i = 0; i < file.length; i += 2) {
      const x = file[i], y = file[i + 1];
      for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
        if (nx < 0 || ny < 0 || nx >= cols || ny >= lignes) continue;
        if (mur[ny][nx] || d[ny][nx] !== -1) continue;
        d[ny][nx] = d[y][x] + 1;
        file.push(nx, ny);
      }
    }
    return d;
  }

  function genererZone(grainTexte, numero, formeJoueur) {
    const base = grainDepuisTexte(grainTexte);
    // types de lueurs disponibles à ce stade de la progression
    const types = Object.keys(BONUS).filter((k) => BONUS[k].forme <= formeJoueur);

    for (let variante = 0; variante < 30; variante++) {
      const rnd = mulberry32(base + variante * 7919 + numero * 104729);
      const z = construireZone(rnd, numero);
      if (!z) continue;

      const depart = z.salles[0];
      const d = distances(z, depart);

      let sortie = null, loin = -1;
      for (const s of z.salles) {
        if (d[s.cy][s.cx] > loin) { loin = d[s.cy][s.cx]; sortie = s; }
      }
      if (!sortie || loin < 12) continue;

      const lueurs = [];
      for (const s of z.salles) {
        if (s === depart) continue;
        const combien = 2 + Math.floor(rnd() * 3);
        for (let i = 0; i < combien; i++) {
          const cx = s.x + Math.floor(rnd() * s.w);
          const cy = s.y + Math.floor(rnd() * s.h);
          if (d[cy][cx] < 0) continue;
          // une lueur sur cinq est spéciale, tirée parmi ce qui est débloqué
          const special = types.length > 1 && rnd() < 0.22;
          const type = special ? types[1 + Math.floor(rnd() * (types.length - 1))] : 'eclat';
          lueurs.push({ x: (cx + 0.5) * CASE, y: (cy + 0.5) * CASE, type, prise: false, vue: false, phase: rnd() * TAU });
        }
      }
      if (lueurs.length < 8) continue;

      const persos = [];
      const palette = numero === 1
        ? [EMOTIONS.PEUR, EMOTIONS.CURIEUX, EMOTIONS.COLERE]
        : [EMOTIONS.PEUR, EMOTIONS.CURIEUX, EMOTIONS.COLERE, EMOTIONS.COLERE];
      for (const s of z.salles) {
        if (s === depart) continue;
        const combien = 1 + Math.floor(rnd() * 2);
        for (let i = 0; i < combien; i++) {
          const cx = s.x + Math.floor(rnd() * s.w);
          const cy = s.y + Math.floor(rnd() * s.h);
          if (d[cy][cx] < 0) continue;
          const x = (cx + 0.5) * CASE, y = (cy + 0.5) * CASE;
          const regard = rnd() * TAU;
          persos.push({
            x, y, baseX: x, baseY: y, vx: 0, vy: 0,
            sx: 1, sy: 1, vsx: 0, vsy: 0,
            regard, regardRepos: regard,
            balayage: (rnd() < 0.5 ? 1 : -1) * (0.35 + rnd() * 0.5),
            amplitude: 0.5 + rnd() * 0.9,
            phase: rnd() * TAU,
            emotion: palette[Math.floor(rnd() * palette.length)],
            eclaire: false, calme: false, aveugle: 0, compteCalme: 0,
            tremble: rnd() * TAU, humeur: 0,
            alerte: 0, etape: 0, charge: 0,
            // Les sentinelles clignent des yeux : quelques dixièmes de seconde
            // où elles ne voient rien. C'est ce qui rend l'observation des yeux
            // dans le noir réellement utile, et donne une fenêtre pour passer.
            cligne: 0, prochainCligne: 1.5 + rnd() * 3.5,
            // points de passage de la ronde, pris dans les cases libres autour
            ronde: (() => {
              const pts = [];
              for (let k = 0; k < 24 && pts.length < 3; k++) {
                const ox = cx + Math.floor(rnd() * 9) - 4;
                const oy = cy + Math.floor(rnd() * 9) - 4;
                if (ox < 0 || oy < 0 || ox >= z.cols || oy >= z.lignes) continue;
                if (z.mur[oy][ox] || d[oy][ox] < 0) continue;
                pts.push({ x: (ox + 0.5) * CASE, y: (oy + 0.5) * CASE });
              }
              return pts;
            })(),
          });
        }
      }

      const joignable = (p) => {
        const cx = Math.floor(p.x / CASE), cy = Math.floor(p.y / CASE);
        return d[cy] && d[cy][cx] >= 0;
      };
      if (!lueurs.every(joignable)) continue;

      // Torches fixées aux murs : gratuites mais temporaires, contrairement aux
      // braises qu'on porte. En passant devant, on les allume pour un moment.
      const torches = [];
      for (const sl of z.salles) {
        for (let essai = 0; essai < 14 && torches.length < 3 + numero; essai++) {
          const cx = sl.x + Math.floor(rnd() * sl.w);
          const cy = sl.y + Math.floor(rnd() * sl.h);
          if (z.mur[cy][cx] || d[cy][cx] < 0) continue;
          // il faut un mur juste à côté : une torche se fixe à une paroi
          const cotes = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([ox, oy]) => {
            const nx = cx + ox, ny = cy + oy;
            return nx < 0 || ny < 0 || nx >= z.cols || ny >= z.lignes || z.mur[ny][nx];
          });
          if (!cotes.length) continue;
          const [ox, oy] = cotes[Math.floor(rnd() * cotes.length)];
          torches.push({
            x: (cx + 0.5 + ox * 0.36) * CASE,
            y: (cy + 0.5 + oy * 0.36) * CASE,
            r: CASE * 2.1, duree: 26, reste: 0, phase: rnd() * TAU,
          });
          break;
        }
      }

      return {
        ...z, numero, grain: grainTexte, lueurs, persos, torches,
        braises: [],
        depart: { x: (depart.cx + 0.5) * CASE, y: (depart.cy + 0.5) * CASE },
        sortie: { x: (sortie.cx + 0.5) * CASE, y: (sortie.cy + 0.5) * CASE, r: CASE * 0.42, vue: false },
        requis: Math.min(lueurs.length, 4 + numero * 2),
        largeur: z.cols * CASE, hauteur: z.lignes * CASE, longueur: loin,
      };
    }
    return null;
  }

  /* ==================================================== état ============= */

  const canvas = document.getElementById('jeu');
  const ctx = canvas.getContext('2d');

  // Le calque d'obscurité n'est que du dégradé : demi-résolution, invisible à
  // l'œil et quatre fois moins cher à rastériser.
  const QLUM = 0.5;
  const lum = document.createElement('canvas');
  const lctx = lum.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  const PALIERS = [2, 1.5, 1];
  let palier = 0, fenetre = [];

  let zone = null;
  const cam = { x: 0, y: 0 };
  let particules = [];
  let ondes = [];                  // ondes de choc de la charge et de l'éclat
  let fil = [];                    // la trace du joueur : sa seule mémoire du terrain

  const joueur = {
    x: 0, y: 0, vx: 0, vy: 0,
    sx: 1, sy: 1, vsx: 0, vsy: 0,
    regard: -Math.PI / 2,
    eclat: 0, sommet: 0, niveau: 0,
    souffle: 1, repit: 0, vu: 0,
    braises: 0,
    chargeDispo: 1, chargeT: 0,
    eclairDispo: 1,
    bonus: null, bonusT: 0,
  };

  // Joystick flottant : il naît sous le doigt, où qu'on le pose.
  const manche = { actif: false, ox: 0, oy: 0, dx: 0, dy: 0, force: 0, id: null };
  const RAYON_MANCHE = 56;

  let numeroZone = 1;
  let grain = 'LUX-1042';
  let priseCount = 0;

  const el = (id) => document.getElementById(id);
  const elZone = el('zone'), elForme = el('forme'), elBarre = el('barre');
  const elHint = el('hint'), elToast = el('toast'), elFlash = el('flash');
  const elBraise = el('braise'), elBraiseN = el('braise-n');
  const elCharge = el('charge'), elEclair = el('eclair');
  const elBonus = el('bonus'), elBonusNom = el('bonus-nom'), elBonusJauge = el('bonus-jauge');

  const forme = () => FORMES[joueur.niveau];
  const aBonus = (k) => joueur.bonus === k && joueur.bonusT > 0;

  function dims() {
    const t = clamp(Math.min(W, H) * 0.095, 30, 54);
    // Le halo se mesure en CASES, pas en pixels d'écran : à 0.17 du petit côté
    // il valait 66 px pour des cases de 74, donc on ne voyait même pas les murs
    // de son propre couloir. Il faut au minimum une case et demie pour que
    // l'obscurité soit une contrainte et pas un aveuglement.
    return { taille: t, halo: CASE * 1.5, portee: CASE, cone: 0.20 };
  }
  let D = dims();

  // Le halo EST la jauge de santé : se faire fixer le fait rétrécir, se cacher
  // le fait revenir. Ça dit la règle sans un mot, et évite une deuxième barre.
  // Le plancher est haut (0.68) : à jauge presque pleine on doit encore y voir
  // assez pour s'enfuir. Mesuré à 0.5, le halo tombait sous une case pile au
  // moment où il fallait courir.
  const rayonHalo = () => D.halo * forme().halo * (0.68 + joueur.souffle * 0.32);
  const porteeFaisceau = () => forme().portee * CASE * (aBonus('prisme') ? 1.5 : 1);
  const coneFaisceau = () => forme().cone * (aBonus('prisme') ? 1.6 : 1);

  /* ==================================================== collisions ======= */

  const solide = (cx, cy) =>
    cx < 0 || cy < 0 || cx >= zone.cols || cy >= zone.lignes || zone.mur[cy][cx] === 1;

  function degager(p, demi) {
    const c0x = Math.floor((p.x - demi) / CASE), c1x = Math.floor((p.x + demi) / CASE);
    const c0y = Math.floor((p.y - demi) / CASE), c1y = Math.floor((p.y + demi) / CASE);
    for (let cy = c0y; cy <= c1y; cy++) {
      for (let cx = c0x; cx <= c1x; cx++) {
        if (!solide(cx, cy)) continue;
        const mx = cx * CASE, my = cy * CASE;
        const gauche = (mx - demi) - p.x, droite = (mx + CASE + demi) - p.x;
        const haut = (my - demi) - p.y, bas = (my + CASE + demi) - p.y;
        const dx = Math.abs(gauche) < Math.abs(droite) ? gauche : droite;
        const dy = Math.abs(haut) < Math.abs(bas) ? haut : bas;
        if (Math.abs(dx) < Math.abs(dy)) { p.x += dx; p.vx = 0; }
        else { p.y += dy; p.vy = 0; }
      }
    }
  }

  /* ==================================================== vision =========== */

  function vueLibre(x1, y1, x2, y2) {
    const d = Math.hypot(x2 - x1, y2 - y1);
    const pas = Math.max(1, Math.ceil(d / (CASE * 0.45)));
    for (let i = 1; i < pas; i++) {
      const t = i / pas;
      if (solide(Math.floor((x1 + (x2 - x1) * t) / CASE), Math.floor((y1 + (y2 - y1) * t) / CASE))) return false;
    }
    return true;
  }

  const dansLeCone = (sx, sy, angle, tx, ty, portee, demi) => {
    const d = Math.hypot(tx - sx, ty - sy);
    if (d > portee || d < 1) return false;
    const a = Math.atan2(ty - sy, tx - sx);
    return Math.abs(ecartAngle(angle, a)) <= demi + Math.min(0.45, 30 / Math.max(d, 1));
  };

  // Relais : ton faisceau réveille un bonhomme, qui éclaire à son tour dans la
  // direction de son regard. Ça ne décide de rien — ça sert à voir plus loin.
  function propager() {
    const eclaires = new Set();
    // un calmé brille tout seul, faisceau ou pas
    for (const p of zone.persos) if (p.calme) eclaires.add(p);
    const portee = porteeFaisceau();
    if (!portee) return eclaires;
    const cone = coneFaisceau();

    for (const p of zone.persos) {
      if (p.emotion === EMOTIONS.COLERE) continue;
      if (!dansLeCone(joueur.x, joueur.y, joueur.regard, p.x, p.y, portee, cone)) continue;
      if (!vueLibre(joueur.x, joueur.y, p.x, p.y)) continue;
      eclaires.add(p);
    }
    for (let tour = 0; tour < 4; tour++) {
      let ajout = false;
      for (const src of [...eclaires]) {
        for (const cible of zone.persos) {
          if (cible === src || eclaires.has(cible)) continue;
          if (cible.emotion === EMOTIONS.COLERE) continue;
          if (!dansLeCone(src.x, src.y, src.regard, cible.x, cible.y, D.portee * 5, D.cone)) continue;
          if (!vueLibre(src.x, src.y, cible.x, cible.y)) continue;
          eclaires.add(cible);
          ajout = true;
        }
      }
      if (!ajout) break;
    }
    return eclaires;
  }

  // Une braise tient les rouges à distance : c'est ce qui en fait un abri et
  // pas seulement un lampadaire.
  const prochedUneBraise = (x, y, marge) =>
    zone.braises.some((b) => Math.hypot(b.x - x, b.y - y) < b.r * (marge || 1));

  const procheDuneTorche = (x, y) =>
    zone.torches.some((t) => t.reste > 0 && Math.hypot(t.x - x, t.y - y) < t.r);

  /* ==================================================== particules ======= */

  // Petites particules au-dessus de la tête : c'est le canal qui dit l'émotion
  // sans texte — danger, joie, peur.
  function emettre(x, y, couleur, n, vitesse, forme2) {
    for (let i = 0; i < n && particules.length < 140; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
      particules.push({
        x, y, vx: Math.cos(a) * vitesse * (0.5 + Math.random()),
        vy: Math.sin(a) * vitesse * (0.5 + Math.random()),
        vie: 0.5 + Math.random() * 0.5, max: 1, couleur, forme: forme2 || 'point',
      });
    }
  }

  function majParticules(dt) {
    for (let i = particules.length - 1; i >= 0; i--) {
      const q = particules[i];
      q.x += q.vx * dt; q.y += q.vy * dt;
      q.vy += 32 * dt;
      q.vie -= dt;
      if (q.vie <= 0) particules.splice(i, 1);
    }
    for (let i = ondes.length - 1; i >= 0; i--) {
      const o = ondes[i];
      o.r += (o.max - o.r) * Math.min(1, 7 * dt) + 40 * dt;
      if (o.r >= o.max * 0.97) ondes.splice(i, 1);
    }
  }

  /* ==================================================== physique ========= */

  function majJelly(p, dt) {
    const cibleX = clamp(1 + p.vy * 0.00055 - p.vx * 0.00055, 0.84, 1.19);
    const cibleY = clamp(1 + p.vx * 0.00055 - p.vy * 0.00055, 0.84, 1.19);
    p.vsx += (cibleX - p.sx) * 190 * dt;
    p.vsy += (cibleY - p.sy) * 190 * dt;
    p.vsx -= p.vsx * 13 * dt;
    p.vsy -= p.vsy * 13 * dt;
    p.sx += p.vsx * dt;
    p.sy += p.vsy * dt;
  }

  let filDernier = { x: 0, y: 0 };

  function majJoueur(dt) {
    const demi = D.taille * 0.5;

    if (manche.actif && manche.force > 0.06) {
      const accel = 1700 * manche.force;
      joueur.vx += manche.dx * accel * dt;
      joueur.vy += manche.dy * accel * dt;
    }

    if (joueur.chargeT > 0) {
      joueur.chargeT -= dt;
      joueur.vx += Math.cos(joueur.regard) * 2600 * dt;
      joueur.vy += Math.sin(joueur.regard) * 2600 * dt;
    }

    const frottement = Math.pow(0.0009, dt);
    joueur.vx *= frottement;
    joueur.vy *= frottement;

    let vmax = 300 + joueur.niveau * 26;
    if (aBonus('hate')) vmax *= 1.55;
    if (joueur.chargeT > 0) vmax += 420;
    const v = Math.hypot(joueur.vx, joueur.vy);
    if (v > vmax) { joueur.vx = (joueur.vx / v) * vmax; joueur.vy = (joueur.vy / v) * vmax; }

    joueur.x += joueur.vx * dt;
    joueur.y += joueur.vy * dt;
    joueur.x = clamp(joueur.x, demi, zone.largeur - demi);
    joueur.y = clamp(joueur.y, demi, zone.hauteur - demi);
    degager(joueur, demi);

    if (v > 26) joueur.regard += ecartAngle(joueur.regard, Math.atan2(joueur.vy, joueur.vx)) * Math.min(1, 12 * dt);

    // le fil : un point tous les vingt pixels parcourus
    if (Math.hypot(joueur.x - filDernier.x, joueur.y - filDernier.y) > 20) {
      fil.push({ x: joueur.x, y: joueur.y });
      filDernier = { x: joueur.x, y: joueur.y };
      if (fil.length > 900) fil.shift();
    }

    majJelly(joueur, dt);
  }

  // Un calmé n'est pas une statue : il flâne autour de son poste et son regard
  // dérive doucement. Sa lumière reste allumée — c'est ça qui compte — mais il
  // continue de vivre.
  function flaner(p, dt) {
    p.flane = (p.flane === undefined ? Math.random() * TAU : p.flane) + 0.32 * dt;
    const cx = p.baseX + Math.cos(p.flane) * CASE * 0.85;
    const cy = p.baseY + Math.sin(p.flane * 0.7) * CASE * 0.85;
    p.vx += (cx - p.x) * 2.4 * dt;
    p.vy += (cy - p.y) * 2.4 * dt;
    p.phase += 0.3 * dt;
    p.regard = p.regardRepos + Math.sin(p.phase) * 0.42;
    p.humeur = 1;
  }

  function majPersos(dt, temps, eclaires) {
    const demi = D.taille * 0.5;
    for (const p of zone.persos) {
      p.eclaire = eclaires.has(p);
      if (p.aveugle > 0) p.aveugle -= dt;
      if (p.emotion === EMOTIONS.COLERE) {
        p.cligne = (p.cligne || 0) - dt;
        p.prochainCligne -= dt;
        if (p.prochainCligne <= 0) { p.cligne = 0.42; p.prochainCligne = 2.2 + Math.random() * 3.6; }
      }
      const dx = joueur.x - p.x, dy = joueur.y - p.y;
      const d = Math.hypot(dx, dy) || 1;
      // Un peureux ou un curieux te remarque de partout : ils ne te chassent pas.
      // Un coléreux, lui, est une SENTINELLE : il ne te voit que dans son cône.
      const voit = p.emotion === EMOTIONS.COLERE
        ? dansLeCone(p.x, p.y, p.regard, joueur.x, joueur.y, CASE * 4.6, 0.42)
            && vueLibre(p.x, p.y, joueur.x, joueur.y)
        : d < CASE * 5 && vueLibre(p.x, p.y, joueur.x, joueur.y);

      if (p.emotion === EMOTIONS.CURIEUX) {
        if (p.calme) {
          flaner(p, dt);
        } else {
          p.phase += p.balayage * (p.eclaire ? 0.18 : 1) * dt;
          p.regard = p.regardRepos + Math.sin(p.phase) * p.amplitude;
          p.humeur = p.eclaire ? 1 : 0;
        }

      } else if (p.emotion === EMOTIONS.PEUR) {
        if (p.calme) { flaner(p, dt); } else if (voit && d < CASE * 2.6) {
          p.vx -= (dx / d) * 300 * dt;
          p.vy -= (dy / d) * 300 * dt;
          p.regard = Math.atan2(-dy, -dx);
          p.humeur = -1;
          if (Math.random() < dt * 3) emettre(p.x, p.y - D.taille * 0.7, '#8fd0ff', 1, 26);
        } else {
          p.vx += (p.baseX - p.x) * 1.6 * dt;
          p.vy += (p.baseY - p.y) * 1.6 * dt;
          p.phase += p.balayage * 0.5 * dt;
          p.regard = p.regardRepos + Math.sin(p.phase) * 0.5;
          p.humeur = 0;
        }

      } else {
        // SENTINELLE. Elle fait sa ronde et balaye du regard. Elle ne te
        // détecte QUE si tu entres dans son cône — donc on peut la contourner,
        // passer dans son dos, attendre que son balayage s'éloigne. La laisse
        // reste : sans elle, un seul rouge suivait le joueur à travers toute la
        // zone et le revidait à chaque réapparition.
        const loin = Math.hypot(p.x - p.baseX, p.y - p.baseY) > CASE * 5.5;
        const gene = p.aveugle > 0 || prochedUneBraise(p.x, p.y, 1);
        if (voit && !loin && !gene) p.alerte = 2.6;      // elle t'a vu : elle poursuit
        else if (p.alerte > 0) p.alerte -= dt;
        if (gene) p.alerte = 0;

        if (p.alerte > 0) {
          p.regard += ecartAngle(p.regard, Math.atan2(dy, dx)) * 5 * dt;
          if (d < CASE * 4.6) {
            const vitesse = 210 + zone.numero * 12;
            p.vx += (dx / d) * vitesse * dt;
            p.vy += (dy / d) * vitesse * dt;
          }
          p.humeur = -1;
          if (Math.random() < dt * 4) emettre(p.x, p.y - D.taille * 0.75, '#ff7a6b', 1, 34, 'trait');

        } else {
          // ronde : elle va d'un point de passage au suivant, et le regard
          // balaye autour de sa direction de marche
          const b = zone.braises.find((q) => Math.hypot(q.x - p.x, q.y - p.y) < q.r);
          if (b) {
            const bx = p.x - b.x, by = p.y - b.y, bd = Math.hypot(bx, by) || 1;
            p.vx += (bx / bd) * 260 * dt;
            p.vy += (by / bd) * 260 * dt;
            p.humeur = 0;
          } else if (p.ronde && p.ronde.length) {
            const c = p.ronde[p.etape % p.ronde.length];
            const rx = c.x - p.x, ry = c.y - p.y;
            const rd = Math.hypot(rx, ry) || 1;
            if (rd < CASE * 0.5) p.etape++;
            // 95 donnait 13 px/s : une ronde qu'on ne voyait pas bouger
            else { p.vx += (rx / rd) * 430 * dt; p.vy += (ry / rd) * 430 * dt; }
            p.cap = Math.atan2(ry, rd > 1 ? rx : 1);
            p.humeur = p.aveugle > 0 ? 0 : -1;
          }
          p.phase += p.balayage * 0.8 * dt;
          const cap = p.cap === undefined ? p.regardRepos : p.cap;
          p.regard += ecartAngle(p.regard, cap + Math.sin(p.phase) * 0.9) * 3.2 * dt;
        }

        // aveuglée : elle ferme les yeux et stresse
        if (p.aveugle > 0 && Math.random() < dt * 9) {
          emettre(p.x + (Math.random() - 0.5) * D.taille, p.y - D.taille * 0.8,
                  Math.random() < 0.5 ? '#ffffff' : '#ff7a6b', 1, 30);
        }
      }

      const f = Math.pow(0.0016, dt);
      p.vx *= f; p.vy *= f;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.x = clamp(p.x, demi, zone.largeur - demi);
      p.y = clamp(p.y, demi, zone.hauteur - demi);
      degager(p, demi);

      // séparation d'avec le joueur : un rouge logé dedans est illisible
      const sx = p.x - joueur.x, sy = p.y - joueur.y;
      const sd = Math.hypot(sx, sy);
      const mini = D.taille * 0.95;
      if (sd > 0.01 && sd < mini) {
        const k = (mini - sd) * 0.5;
        p.x += (sx / sd) * k; p.y += (sy / sd) * k;
        joueur.x -= (sx / sd) * k; joueur.y -= (sy / sd) * k;
        degager(joueur, demi);
      }

      majJelly(p, dt);
    }
  }

  /* ==================================================== règles =========== */

  function evoluer() {
    const suivant = FORMES[joueur.niveau + 1];
    if (!suivant || joueur.sommet < suivant.seuil) return;
    joueur.niveau++;
    if (joueur.niveau === 2) joueur.braises = Math.max(joueur.braises, 3);
    majBoutons();
    emettre(joueur.x, joueur.y - D.taille * 0.7, suivant.couleur, 16, 90);
    montrerFlash(suivant.nom, suivant.texte, suivant.couleur, suivant.verbe);
  }

  function majBoutons() {
    elBraise.classList.toggle('on', joueur.niveau >= 2);
    elCharge.classList.toggle('on', joueur.niveau >= 3);
    elEclair.classList.toggle('on', joueur.niveau >= 4);
    elBraiseN.textContent = joueur.braises;
    elBraise.disabled = joueur.braises <= 0;
    elCharge.disabled = joueur.chargeDispo < 1;
    elEclair.disabled = joueur.eclairDispo < 1;
    elCharge.style.setProperty('--recharge', joueur.chargeDispo.toFixed(2));
    elEclair.style.setProperty('--recharge', joueur.eclairDispo.toFixed(2));
  }

  function gagnerEclat(n) {
    joueur.eclat += n;
    joueur.sommet = Math.max(joueur.sommet, joueur.eclat);
    evoluer();
  }

  function eteindre() {
    // L'éclat n'est JAMAIS repris : la progression ne se perd pas, sinon la
    // mort punit deux fois. Et c'est un bandeau qui s'efface, pas une fenêtre à
    // valider : ça casserait le rythme.
    joueur.souffle = 1;
    for (const p of zone.persos) p.charge = 0;
    joueur.x = zone.depart.x; joueur.y = zone.depart.y;
    joueur.vx = joueur.vy = 0;
    joueur.repit = 1.6;
    fil.push(null);                     // coupure : on ne relie pas la mort au seuil
    filDernier = { x: zone.depart.x, y: zone.depart.y };
    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE) continue;
      p.x = p.baseX; p.y = p.baseY; p.vx = p.vy = 0;
    }
    montrerToast('Éteint — tu repars du seuil');
  }

  function ramasser(l) {
    l.prise = true;
    const b = BONUS[l.type];
    emettre(l.x, l.y, b.couleur, 10, 70);
    if (l.type === 'eclat') { priseCount++; gagnerEclat(4); return; }
    priseCount++;
    if (l.type === 'braise') { joueur.braises++; majBoutons(); montrerToast(b.phrase, b.couleur); return; }
    if (l.type === 'souffle') joueur.souffle = 1;
    joueur.bonus = l.type;
    joueur.bonusT = b.duree;
    montrerToast(b.phrase, b.couleur);
    gagnerEclat(2);
  }

  function majRegles(dt) {
    for (const l of zone.lueurs) {
      if (l.prise) continue;
      if (Math.hypot(l.x - joueur.x, l.y - joueur.y) < D.taille * 0.9) { ramasser(l); continue; }
      // mémoire des points d'intérêt : on se souvient des objets, pas du terrain
      if (!l.vue && estEclaire(l.x, l.y)) l.vue = true;
    }
    if (!zone.sortie.vue && estEclaire(zone.sortie.x, zone.sortie.y)) zone.sortie.vue = true;

    for (const t of zone.torches) {
      if (t.reste > 0) t.reste -= dt;
      if (Math.hypot(t.x - joueur.x, t.y - joueur.y) < CASE * 0.75 && t.reste < t.duree * 0.6) {
        if (t.reste <= 0) emettre(t.x, t.y, '#ffb45c', 8, 55);
        t.reste = t.duree;
      }
    }

    // Regarder un bonhomme assez longtemps le calme — n'importe lequel, pas
    // seulement les peureux. Il passe au vert et SON FAISCEAU DEVIENT
    // PERMANENT : c'est ce qui donne enfin un rôle aux personnages non joués.
    // Une lampe qu'on gagne en la regardant, et qu'on choisit où allumer.
    for (const p of zone.persos) {
      if (p.emotion === EMOTIONS.COLERE || p.calme || !p.eclaire) continue;
      p.compteCalme += dt;
      if (p.compteCalme > 1.1) {
        p.calme = true;
        p.regardRepos = p.regard;      // il fige sa direction : c'est un phare
        gagnerEclat(6);
        emettre(p.x, p.y - D.taille * 0.7, '#a8f0c8', 12, 80);
        montrerToast('Calmé — son faisceau reste allumé', '#a8f0c8');
      }
    }

    // Chaque sentinelle a sa propre jauge, qui se remplit tant que tu es dans
    // son cône et se vide dès que tu en sors. Pleine, elle t'élimine. Avant, la
    // perte était une valeur invisible : rien ne disait combien de temps il
    // restait. Maintenant le cône lui-même se remplit sous tes yeux.
    if (joueur.repit > 0) joueur.repit -= dt;
    const abri = prochedUneBraise(joueur.x, joueur.y, 1) || procheDuneTorche(joueur.x, joueur.y);
    let pire = 0, traque = false;

    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE) continue;
      const vise = !aBonus('souffle') && !abri && joueur.repit <= 0
        && p.aveugle <= 0 && p.cligne <= 0
        && Math.hypot(joueur.x - p.x, joueur.y - p.y) <= CASE * 4.6
        && dansLeCone(p.x, p.y, p.regard, joueur.x, joueur.y, CASE * 4.6, 0.42)
        && vueLibre(p.x, p.y, joueur.x, joueur.y);

      if (vise) {
        traque = true;
        const pres = Math.hypot(joueur.x - p.x, joueur.y - p.y) < CASE * 1.6;
        p.charge = Math.min(1, p.charge + (pres ? 0.62 : 0.38) * dt);
      } else {
        // hors du cône ça redescend ; derrière un mur, plus vite encore
        const cache = !vueLibre(p.x, p.y, joueur.x, joueur.y);
        p.charge = Math.max(0, p.charge - (cache ? 0.55 : 0.32) * dt);
      }
      pire = Math.max(pire, p.charge);
      if (p.charge >= 1) { eteindre(); return; }
    }

    // Le halo suit la jauge la plus pleine : la lumière rétrécit à mesure qu'une
    // sentinelle te verrouille, et revient quand tu lui échappes. Une seule
    // idée, deux lectures.
    joueur.souffle = 1 - pire;
    joueur.vu += ((traque ? 1 : 0) - joueur.vu) * Math.min(1, 6 * dt);
    if (traque && Math.random() < dt * 6) {
      emettre(joueur.x, joueur.y - D.taille * 0.75, '#ff7a6b', 1, 40, 'trait');
    }

    if (joueur.bonusT > 0) {
      joueur.bonusT -= dt;
      // traînée continue à la couleur du bonus : on voit qu'il est actif même
      // sans regarder la barre du haut
      if (Math.random() < dt * 14) {
        emettre(joueur.x + (Math.random() - 0.5) * D.taille,
                joueur.y + (Math.random() - 0.5) * D.taille,
                BONUS[joueur.bonus].couleur, 1, 18);
      }
      if (joueur.bonusT <= 0) { joueur.bonus = null; montrerToast('Le bonus s\'éteint', '#9aa1ac'); }
    }

    if (joueur.chargeDispo < 1) { joueur.chargeDispo = Math.min(1, joueur.chargeDispo + dt / 3.4); majBoutons(); }
    if (joueur.eclairDispo < 1) { joueur.eclairDispo = Math.min(1, joueur.eclairDispo + dt / 9); majBoutons(); }

    if (priseCount >= zone.requis &&
        Math.hypot(zone.sortie.x - joueur.x, zone.sortie.y - joueur.y) < zone.sortie.r) {
      zoneSuivante();
    }
  }

  // « est-ce que ce point est actuellement éclairé » — sert à la mémoire des objets
  function estEclaire(x, y) {
    if (Math.hypot(x - joueur.x, y - joueur.y) < rayonHalo()) return true;
    const portee = porteeFaisceau();
    if (portee && dansLeCone(joueur.x, joueur.y, joueur.regard, x, y, portee, coneFaisceau())
        && vueLibre(joueur.x, joueur.y, x, y)) return true;
    if (prochedUneBraise(x, y, 1) || procheDuneTorche(x, y)) return true;
    // un calmé éclaire en permanence : ce qu'il vise est visible pour toujours
    return zone.persos.some((p) => p.calme
      && dansLeCone(p.x, p.y, p.regard, x, y, D.portee * 5, D.cone)
      && vueLibre(p.x, p.y, x, y));
  }

  function poserBraise() {
    if (joueur.niveau < 2 || joueur.braises <= 0) return;
    joueur.braises--;
    zone.braises.push({ x: joueur.x, y: joueur.y, r: CASE * 2.3, phase: Math.random() * TAU });
    emettre(joueur.x, joueur.y, '#ffc478', 10, 60);
    majBoutons();
  }

  function decharger() {
    if (joueur.niveau < 3 || joueur.chargeDispo < 1) return;
    joueur.chargeDispo = 0;
    joueur.chargeT = 0.22;
    // Le vrai rôle de la charge : traverser. Pendant la ruée et juste après,
    // aucun regard ne peut vider — sans ça on ne comprend pas à quoi elle sert.
    joueur.repit = Math.max(joueur.repit, 0.75);
    majBoutons();
    ondes.push({ x: joueur.x, y: joueur.y, r: 0, max: CASE * 2.4, couleur: '#ff9a6b' });
    for (const p of zone.persos) {
      const dx = p.x - joueur.x, dy = p.y - joueur.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d > CASE * 2.2) continue;
      p.vx += (dx / d) * 620;
      p.vy += (dy / d) * 620;
      if (p.emotion === EMOTIONS.COLERE) { p.aveugle = Math.max(p.aveugle, 1.8); p.alerte = 0; }
    }
    emettre(joueur.x, joueur.y, '#ff9a6b', 12, 120);
  }

  function lancerEclat() {
    if (joueur.niveau < 4 || joueur.eclairDispo < 1) return;
    joueur.eclairDispo = 0;
    majBoutons();
    ondes.push({ x: joueur.x, y: joueur.y, r: 0, max: CASE * 6, couleur: '#fff2c4' });
    for (const p of zone.persos) {
      if (Math.hypot(p.x - joueur.x, p.y - joueur.y) > CASE * 6) continue;
      if (p.emotion === EMOTIONS.COLERE) { p.aveugle = 5; p.alerte = 0; }
    }
    emettre(joueur.x, joueur.y, '#fff2c4', 26, 200);
    montrerToast('Éclat — les rouges sont aveuglés');
  }

  /* ==================================================== rendu ============ */

  function carreArrondi(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  // Un visage = deux yeux, deux sourcils, une bouche. La bouche fait presque
  // tout le travail d'expression pour trois traits de plus.
  function dessinerTete(p, couleur, taille, allume, opacite, emotion, humeur, temps) {
    const w = taille * p.sx, h = taille * p.sy;
    const arrondi = Math.min(w, h) * 0.32;
    const demi = taille * 0.5;

    ctx.save();
    ctx.translate(p.x - cam.x, p.y - cam.y);
    ctx.globalAlpha = opacite;

    const corps = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    if (allume) {
      corps.addColorStop(0, eclaircir(couleur, 0.42));
      corps.addColorStop(0.55, couleur);
      corps.addColorStop(1, assombrir(couleur, 0.3));
    } else {
      corps.addColorStop(0, '#23232f');
      corps.addColorStop(1, '#12121a');
    }
    ctx.fillStyle = corps;
    carreArrondi(ctx, -w / 2, -h / 2, w, h, arrondi);
    ctx.fill();
    ctx.strokeStyle = allume ? 'rgba(255,255,255,0.7)' : couleur;
    ctx.lineWidth = allume ? 2 : 1.5;
    ctx.stroke();

    const reflet = ctx.createRadialGradient(-w * 0.2, -h * 0.28, 0, -w * 0.2, -h * 0.28, w * 0.42);
    reflet.addColorStop(0, `rgba(255,255,255,${allume ? 0.45 : 0.1})`);
    reflet.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = reflet;
    carreArrondi(ctx, -w / 2, -h / 2, w, h, arrondi);
    ctx.fill();

    // --- yeux ---
    const ecart = demi * 0.36 * p.sx;
    const oeilY = -demi * 0.14 * p.sy;
    const rOeil = demi * 0.22;
    const px = Math.cos(p.regard) * rOeil * 0.42;
    const py = Math.sin(p.regard) * rOeil * 0.42;
    const encre = allume ? '#0a0a10' : couleur;
    if (p.aveugle > 0 || p.cligne > 0) {
      // aveuglée : les yeux se ferment. C'est le seul signe qui dit « elle ne
      // te voit plus » — sans lui, l'éclat n'a aucun effet visible.
      ctx.strokeStyle = encre;
      ctx.lineWidth = Math.max(2, demi * 0.12);
      ctx.lineCap = 'round';
      for (const dx of [-ecart, ecart]) {
        ctx.beginPath();
        ctx.arc(dx, oeilY - rOeil * 0.35, rOeil, 0.5, Math.PI - 0.5);
        ctx.stroke();
      }
    } else {
      for (const dx of [-ecart, ecart]) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(dx, oeilY, rOeil, 0, TAU); ctx.fill();
        ctx.fillStyle = '#0a0a10';
        ctx.beginPath(); ctx.arc(dx + px, oeilY + py, rOeil * 0.5, 0, TAU); ctx.fill();
      }
    }

    // --- sourcils ---
    ctx.strokeStyle = encre;
    ctx.lineWidth = Math.max(2, demi * 0.12);
    ctx.lineCap = 'round';
    const sy = oeilY - rOeil * 1.55;
    const lg = rOeil * 1.1;
    if (humeur < 0) {                       // froncés
      for (const [dx, sens] of [[-ecart, 1], [ecart, -1]]) {
        ctx.beginPath();
        ctx.moveTo(dx - lg * 0.5 * sens, sy - rOeil * 0.4);
        ctx.lineTo(dx + lg * 0.5 * sens, sy + rOeil * 0.3);
        ctx.stroke();
      }
    } else if (humeur > 0) {                // levés
      for (const [dx, sens] of [[-ecart, 1], [ecart, -1]]) {
        ctx.beginPath();
        ctx.moveTo(dx - lg * 0.5 * sens, sy + rOeil * 0.1);
        ctx.lineTo(dx + lg * 0.5 * sens, sy - rOeil * 0.45);
        ctx.stroke();
      }
    } else {                                 // l'un levé, l'autre droit
      ctx.beginPath();
      ctx.moveTo(-ecart - lg * 0.5, sy - rOeil * 0.45);
      ctx.lineTo(-ecart + lg * 0.5, sy - rOeil * 0.1);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ecart - lg * 0.5, sy - rOeil * 0.1);
      ctx.lineTo(ecart + lg * 0.5, sy - rOeil * 0.1);
      ctx.stroke();
    }

    // --- bouche ---
    const by = oeilY + rOeil * 2.5;
    const bl = demi * 0.42;
    ctx.lineWidth = Math.max(1.8, demi * 0.1);
    ctx.strokeStyle = encre;
    ctx.beginPath();
    if (emotion === EMOTIONS.PEUR && humeur < 0) {
      // petite bouche ouverte qui tremble
      const t = Math.sin(temps * 18 + p.tremble) * demi * 0.03;
      ctx.ellipse(0, by + t, bl * 0.34, bl * 0.42, 0, 0, TAU);
    } else if (humeur > 0) {
      ctx.arc(0, by - bl * 0.42, bl * 0.72, 0.68, Math.PI - 0.68);      // sourire
    } else if (humeur < 0) {
      ctx.arc(0, by + bl * 0.62, bl * 0.72, Math.PI + 0.72, -0.72);     // moue
    } else {
      ctx.moveTo(-bl * 0.42, by); ctx.lineTo(bl * 0.42, by);            // trait
    }
    ctx.stroke();
    ctx.restore();
  }

  function percerCone(c, x, y, angle, portee, demiAngle, force) {
    const g = c.createRadialGradient(x, y, 0, x, y, portee);
    g.addColorStop(0, `rgba(0,0,0,${force})`);
    g.addColorStop(0.6, `rgba(0,0,0,${force * 0.7})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(x, y);
    c.arc(x, y, portee, angle - demiAngle, angle + demiAngle);
    c.closePath();
    c.fill();
  }

  function percerDisque(c, x, y, r, force) {
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${force})`);
    g.addColorStop(0.62, `rgba(0,0,0,${force * 0.88})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  }

  // Le sol de TOUTES les cases à l'écran : le voile se charge de ne montrer que
  // ce qui est éclairé. Pas de brouillard de guerre — seule la lumière révèle.
  function dessinerSol(c0x, c1x, c0y, c1y) {
    ctx.fillStyle = '#1a1a26';
    for (let cy = c0y; cy <= c1y; cy++)
      for (let cx = c0x; cx <= c1x; cx++)
        if (!zone.mur[cy][cx]) ctx.fillRect(cx * CASE - cam.x, cy * CASE - cam.y, CASE + 1, CASE + 1);

    ctx.strokeStyle = 'rgba(255,255,255,0.13)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let cy = c0y; cy <= c1y; cy++) {
      for (let cx = c0x; cx <= c1x; cx++) {
        if (zone.mur[cy][cx]) continue;
        const x = cx * CASE - cam.x, y = cy * CASE - cam.y;
        if (solide(cx, cy - 1)) { ctx.moveTo(x, y); ctx.lineTo(x + CASE, y); }
        if (solide(cx, cy + 1)) { ctx.moveTo(x, y + CASE); ctx.lineTo(x + CASE, y + CASE); }
        if (solide(cx - 1, cy)) { ctx.moveTo(x, y); ctx.lineTo(x, y + CASE); }
        if (solide(cx + 1, cy)) { ctx.moveTo(x + CASE, y); ctx.lineTo(x + CASE, y + CASE); }
      }
    }
    ctx.stroke();
  }

  function dessinerManche() {
    if (!manche.actif) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(manche.ox, manche.oy, RAYON_MANCHE, 0, TAU); ctx.stroke();
    const kx = manche.ox + manche.dx * manche.force * RAYON_MANCHE;
    const ky = manche.oy + manche.dy * manche.force * RAYON_MANCHE;
    const g = ctx.createRadialGradient(kx, ky, 0, kx, ky, 26);
    g.addColorStop(0, rgba(forme().couleur, 0.5));
    g.addColorStop(1, rgba(forme().couleur, 0.06));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(kx, ky, 26, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba(forme().couleur, 0.6);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(kx, ky, 22, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  function dessiner(temps, eclaires) {
    const f = forme();
    const r = rayonHalo();
    const portee = porteeFaisceau();
    const cone = coneFaisceau();

    ctx.fillStyle = '#08080e';
    ctx.fillRect(0, 0, W, H);

    const c0x = Math.max(0, Math.floor(cam.x / CASE));
    const c1x = Math.min(zone.cols - 1, Math.floor((cam.x + W) / CASE));
    const c0y = Math.max(0, Math.floor(cam.y / CASE));
    const c1y = Math.min(zone.lignes - 1, Math.floor((cam.y + H) / CASE));
    dessinerSol(c0x, c1x, c0y, c1y);

    // --- torches murales ---
    for (const t of zone.torches) {
      if (Math.hypot(t.x - joueur.x, t.y - joueur.y) < CASE * 3) t.vue = true;
      if (t.reste <= 0) continue;
      const k = clamp(t.reste / (t.duree * 0.35), 0, 1);
      const h = (14 + Math.sin(temps * 9 + t.phase) * 3) * (0.5 + k * 0.5);
      const g = ctx.createRadialGradient(t.x - cam.x, t.y - cam.y, 0, t.x - cam.x, t.y - cam.y, h * 1.9);
      g.addColorStop(0, 'rgba(255,235,190,0.95)');
      g.addColorStop(1, 'rgba(255,140,50,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(t.x - cam.x, t.y - cam.y, h * 1.9, 0, TAU); ctx.fill();
      if (Math.random() < 0.10) emettre(t.x, t.y, '#ffb45c', 1, 26);
    }

    // --- braises ---
    for (const b of zone.braises) {
      const s = 1 + Math.sin(temps * 5 + b.phase) * 0.12;
      const g = ctx.createRadialGradient(b.x - cam.x, b.y - cam.y, 0, b.x - cam.x, b.y - cam.y, 26 * s);
      g.addColorStop(0, 'rgba(255,226,170,0.95)');
      g.addColorStop(1, 'rgba(255,150,60,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x - cam.x, b.y - cam.y, 26 * s, 0, TAU); ctx.fill();
    }

    // --- sortie ---
    const ouverte = priseCount >= zone.requis;
    const pulse = 1 + Math.sin(temps * 3) * 0.07;
    ctx.save();
    ctx.translate(zone.sortie.x - cam.x, zone.sortie.y - cam.y);
    ctx.strokeStyle = ouverte ? '#ffe9a8' : 'rgba(255,233,168,0.24)';
    ctx.lineWidth = ouverte ? 3.5 : 2;
    ctx.beginPath(); ctx.arc(0, 0, zone.sortie.r * pulse, 0, TAU); ctx.stroke();
    ctx.fillStyle = ouverte ? 'rgba(255,233,168,0.34)' : 'rgba(255,233,168,0.06)';
    ctx.beginPath(); ctx.arc(0, 0, zone.sortie.r * 0.5, 0, TAU); ctx.fill();
    ctx.restore();

    // --- lueurs ---
    for (const l of zone.lueurs) {
      if (l.prise) continue;
      const b = BONUS[l.type];
      const s = 1 + Math.sin(temps * 4 + l.phase) * 0.18;
      const g = ctx.createRadialGradient(l.x - cam.x, l.y - cam.y, 0, l.x - cam.x, l.y - cam.y, 13 * s);
      g.addColorStop(0, rgba(b.couleur, 0.95));
      g.addColorStop(1, rgba(b.couleur, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(l.x - cam.x, l.y - cam.y, 13 * s, 0, TAU); ctx.fill();
      ctx.fillStyle = b.couleur;
      ctx.beginPath();
      if (l.type === 'eclat') ctx.arc(l.x - cam.x, l.y - cam.y, 4.5 * s, 0, TAU);
      else {                                   // les spéciales sont des losanges
        const k = 6.5 * s;
        ctx.moveTo(l.x - cam.x, l.y - cam.y - k);
        ctx.lineTo(l.x - cam.x + k, l.y - cam.y);
        ctx.lineTo(l.x - cam.x, l.y - cam.y + k);
        ctx.lineTo(l.x - cam.x - k, l.y - cam.y);
      }
      ctx.fill();
    }

    // --- bonhommes, coléreux au-dessus ---
    const ordre = [...zone.persos].sort((a, b) =>
      (a.emotion === EMOTIONS.COLERE ? 1 : 0) - (b.emotion === EMOTIONS.COLERE ? 1 : 0));
    for (const p of ordre) {
      const couleur = p.calme ? '#a8f0c8' : COULEURS[p.emotion];
      const repere = p.emotion === EMOTIONS.COLERE && (p.alerte > 0 || p.charge > 0.04);
      dessinerTete(p, couleur, D.taille, p.eclaire || p.calme || repere, 1, p.emotion, p.humeur, temps);
    }

    // --- le joueur : son humeur dit son état, c'est le retour de santé ---
    const humeurJoueur = joueur.vu > 0.35 ? -1 : joueur.souffle > 0.85 ? 1 : 0;
    const emotionJoueur = joueur.souffle < 0.4 ? EMOTIONS.PEUR : EMOTIONS.CURIEUX;
    // un bonus actif teinte le corps et, pour « voilé », le rend translucide :
    // c'est ce qui fait comprendre l'effet sans lire un mot
    const teinte = joueur.bonus ? BONUS[joueur.bonus].couleur : f.couleur;
    const opac = aBonus('souffle') ? 0.5 : 1;
    dessinerTete(joueur, teinte, D.taille * 1.06, true, opac, emotionJoueur, humeurJoueur, temps);

    // --- ondes de choc ---
    for (const o of ondes) {
      ctx.strokeStyle = rgba(o.couleur, clamp(1 - o.r / o.max, 0, 1) * 0.6);
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(o.x - cam.x, o.y - cam.y, o.r, 0, TAU); ctx.stroke();
    }

    // --- particules ---
    for (const q of particules) {
      const a = clamp(q.vie / q.max, 0, 1);
      ctx.fillStyle = rgba(q.couleur, a * 0.9);
      if (q.forme === 'trait') ctx.fillRect(q.x - cam.x - 1, q.y - cam.y - 4, 2, 8);
      else { ctx.beginPath(); ctx.arc(q.x - cam.x, q.y - cam.y, 2.6 * a + 0.7, 0, TAU); ctx.fill(); }
    }

    /* ---- calque d'obscurité ---- */
    lctx.setTransform(DPR * QLUM, 0, 0, DPR * QLUM, 0, 0);
    lctx.globalCompositeOperation = 'source-over';
    lctx.fillStyle = 'rgba(8,8,14,0.975)';
    lctx.fillRect(0, 0, W, H);
    lctx.globalCompositeOperation = 'destination-out';

    const jx = joueur.x - cam.x, jy = joueur.y - cam.y;
    percerDisque(lctx, jx, jy, r, 1);
    if (portee) percerCone(lctx, jx, jy, joueur.regard, portee, cone, 0.95);
    for (const p of eclaires) percerCone(lctx, p.x - cam.x, p.y - cam.y, p.regard, D.portee * 5, D.cone + 0.05, 0.85);
    for (const b of zone.braises) percerDisque(lctx, b.x - cam.x, b.y - cam.y, b.r, 0.92);
    // Un calmé n'est pas qu'un faisceau : son corps et un petit halo restent
    // éclairés, sinon on ne voit qu'un cône sortir du néant.
    for (const p of zone.persos) {
      if (p.calme) percerDisque(lctx, p.x - cam.x, p.y - cam.y, D.taille * 2.1, 0.95);
      // Une sentinelle qui t'a repéré se montre en entier : c'est le signal le
      // plus important du jeu, il ne doit pas rester caché dans le noir.
      else if (p.emotion === EMOTIONS.COLERE && (p.alerte > 0 || p.charge > 0.04)) {
        percerDisque(lctx, p.x - cam.x, p.y - cam.y, D.taille * 1.7, 0.95);
      }
    }
    for (const t of zone.torches) {
      if (t.reste <= 0) continue;
      const k = clamp(t.reste / (t.duree * 0.35), 0, 1);       // elle faiblit en mourant
      percerDisque(lctx, t.x - cam.x, t.y - cam.y, t.r * (0.55 + k * 0.45), 0.9);
    }
    // Le cône d'une sentinelle n'apparaît que DE PRÈS. De loin on ne voit que
    // ses yeux, et on ignore encore si c'est un ami ou une sentinelle : c'est
    // tout le suspense. D'assez près pour réagir, il se montre.
    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE || p.aveugle > 0 || p.cligne > 0) continue;
      const dj = Math.hypot(p.x - joueur.x, p.y - joueur.y);
      if (dj > CASE * 4.2) continue;
      const proximite = clamp(1 - (dj - CASE * 2.6) / (CASE * 1.6), 0, 1);
      percerCone(lctx, p.x - cam.x, p.y - cam.y, p.regard, CASE * 4.6, 0.42, 0.14 + proximite * 0.2);
    }
    lctx.globalCompositeOperation = 'source-over';

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(lum, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    /* ---- ce qui reste visible par-dessus l'obscurité ---- */
    // On se souvient des OBJETS, jamais du terrain : le fil qu'on a tracé, les
    // lueurs déjà aperçues, la sortie une fois trouvée. Assez pour ne pas être
    // perdu, trop peu pour connaître le plan.
    if (fil.length > 1) {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let i = 1; i < fil.length; i++) {
        // un `null` marque une téléportation (mort puis réapparition au seuil) :
        // relier les deux traçait un trait droit à travers les murs
        if (!fil[i] || !fil[i - 1]) continue;
        const t = i / fil.length;
        ctx.strokeStyle = rgba(f.couleur, 0.04 + t * 0.16);
        ctx.lineWidth = 1 + t * 1.6;
        ctx.beginPath();
        ctx.moveTo(fil[i - 1].x - cam.x, fil[i - 1].y - cam.y);
        ctx.lineTo(fil[i].x - cam.x, fil[i].y - cam.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    for (const l of zone.lueurs) {
      if (l.prise || !l.vue) continue;
      ctx.fillStyle = rgba(BONUS[l.type].couleur, 0.42);
      ctx.beginPath(); ctx.arc(l.x - cam.x, l.y - cam.y, 3.2, 0, TAU); ctx.fill();
    }
    for (const b of zone.braises) {
      ctx.strokeStyle = 'rgba(255,196,120,0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(b.x - cam.x, b.y - cam.y, 9, 0, TAU); ctx.stroke();
    }

    // Les torches éteintes restent devinables une fois croisées : ce sont des
    // repères, et savoir où rallumer fait partie du jeu.
    for (const t of zone.torches) {
      if (t.reste > 0 || !t.vue) continue;
      ctx.strokeStyle = 'rgba(255,180,92,0.22)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(t.x - cam.x, t.y - cam.y - 7);
      ctx.lineTo(t.x - cam.x, t.y - cam.y + 7);
      ctx.stroke();
    }

    // LES YEUX DANS LE NOIR. La seule chose qu'on distingue d'un inconnu. On
    // garde EXACTEMENT la géométrie des yeux éclairés — blanc de l'œil et
    // pupille décalée par le regard — pour que ce soit le même personnage, juste
    // sans son corps.
    // Mesuré : 57 % des PNJ à l'écran étaient masqués par un mur, ce qui vidait
    // l'effet. À travers une paroi ils restent perceptibles, mais bien plus
    // faibles et de moins loin : on sent une présence, on ne cartographie pas.
    for (const p of zone.persos) {
      const dj = Math.hypot(p.x - joueur.x, p.y - joueur.y);
      if (p.eclaire || estEclaire(p.x, p.y)) continue;
      if (p.cligne > 0 || p.aveugle > 0) continue;
      const cache = !vueLibre(p.x, p.y, joueur.x, joueur.y);
      const portee = cache ? CASE * 5 : CASE * 9;
      if (dj > portee) continue;

      const demi = D.taille * 0.5;
      const ecart = demi * 0.36;
      const oeilY = -demi * 0.14;
      const rOeil = demi * 0.22;
      const px = Math.cos(p.regard) * rOeil * 0.42;
      const py = Math.sin(p.regard) * rOeil * 0.42;
      const a = (clamp(1 - dj / portee, 0, 1) * 0.5 + 0.35) * (cache ? 0.34 : 1);

      for (const dx of [-ecart, ecart]) {
        const ox = p.x - cam.x + dx, oy = p.y - cam.y + oeilY;
        // la lueur autour de l'œil, qui le fait exister dans le noir
        const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, rOeil * 3.2);
        g.addColorStop(0, `rgba(226,232,246,${a * 0.55})`);
        g.addColorStop(1, 'rgba(226,232,246,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(ox, oy, rOeil * 3.2, 0, TAU); ctx.fill();
        // blanc de l'œil + pupille : la même forme que de jour
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.beginPath(); ctx.arc(ox, oy, rOeil, 0, TAU); ctx.fill();
        ctx.fillStyle = `rgba(10,10,16,${a})`;
        ctx.beginPath(); ctx.arc(ox + px, oy + py, rOeil * 0.5, 0, TAU); ctx.fill();
      }
    }

    // La jauge de chaque sentinelle, dessinée DANS son cône : il se remplit
    // depuis la pointe tant qu'on est dedans, et se vide dès qu'on en sort.
    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE || p.charge <= 0.01) continue;
      const portee = CASE * 4.6 * p.charge;
      const g = ctx.createRadialGradient(p.x - cam.x, p.y - cam.y, 0, p.x - cam.x, p.y - cam.y, portee);
      g.addColorStop(0, `rgba(255,60,50,${0.1 + p.charge * 0.3})`);
      g.addColorStop(1, `rgba(255,60,50,${0.03 + p.charge * 0.12})`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(p.x - cam.x, p.y - cam.y);
      ctx.arc(p.x - cam.x, p.y - cam.y, portee, p.regard - 0.42, p.regard + 0.42);
      ctx.closePath();
      ctx.fill();
      // le front qui avance : c'est lui qu'on regarde
      ctx.strokeStyle = `rgba(255,90,70,${0.35 + p.charge * 0.5})`;
      ctx.lineWidth = 2 + p.charge * 2;
      ctx.beginPath();
      ctx.arc(p.x - cam.x, p.y - cam.y, portee, p.regard - 0.42, p.regard + 0.42);
      ctx.stroke();
    }
    if (zone.sortie.vue) {
      ctx.strokeStyle = ouverte ? 'rgba(255,233,168,0.65)' : 'rgba(255,233,168,0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(zone.sortie.x - cam.x, zone.sortie.y - cam.y, zone.sortie.r * pulse, 0, TAU);
      ctx.stroke();
      // une fois le quota atteint, une flèche au bord de l'écran pour ne pas
      // finir la zone à errer
      if (ouverte) flecheVers(zone.sortie.x, zone.sortie.y, '#ffe9a8', temps);
    }

    /* ---- halo chaud ---- */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const couleurLumiere = joueur.bonus ? BONUS[joueur.bonus].couleur : f.couleur;
    const chaud = ctx.createRadialGradient(jx, jy, 0, jx, jy, r);
    chaud.addColorStop(0, rgba(couleurLumiere, 0.16));
    chaud.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = chaud;
    ctx.beginPath(); ctx.arc(jx, jy, r, 0, TAU); ctx.fill();

    if (portee) {
      const gf = ctx.createRadialGradient(jx, jy, 0, jx, jy, portee);
      gf.addColorStop(0, rgba(couleurLumiere, 0.14));
      gf.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gf;
      ctx.beginPath();
      ctx.moveTo(jx, jy);
      ctx.arc(jx, jy, portee, joueur.regard - cone, joueur.regard + cone);
      ctx.closePath();
      ctx.fill();
    }
    for (const b of zone.braises) {
      const gb = ctx.createRadialGradient(b.x - cam.x, b.y - cam.y, 0, b.x - cam.x, b.y - cam.y, b.r);
      gb.addColorStop(0, 'rgba(255,190,110,0.17)');
      gb.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gb;
      ctx.beginPath(); ctx.arc(b.x - cam.x, b.y - cam.y, b.r, 0, TAU); ctx.fill();
    }
    for (const p of zone.persos) {
      if (!p.calme) continue;
      const rc = D.taille * 2.1;
      const gc = ctx.createRadialGradient(p.x - cam.x, p.y - cam.y, 0, p.x - cam.x, p.y - cam.y, rc);
      gc.addColorStop(0, 'rgba(168,240,200,0.2)');
      gc.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gc;
      ctx.beginPath(); ctx.arc(p.x - cam.x, p.y - cam.y, rc, 0, TAU); ctx.fill();
    }
    for (const t of zone.torches) {
      if (t.reste <= 0) continue;
      const k = clamp(t.reste / (t.duree * 0.35), 0, 1);
      const rt = t.r * (0.55 + k * 0.45);
      const gt = ctx.createRadialGradient(t.x - cam.x, t.y - cam.y, 0, t.x - cam.x, t.y - cam.y, rt);
      gt.addColorStop(0, 'rgba(255,180,92,0.19)');
      gt.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gt;
      ctx.beginPath(); ctx.arc(t.x - cam.x, t.y - cam.y, rt, 0, TAU); ctx.fill();
    }
    for (const p of eclaires) {
      const pp = D.portee * 5;
      const gp = ctx.createRadialGradient(p.x - cam.x, p.y - cam.y, 0, p.x - cam.x, p.y - cam.y, pp);
      // un calmé éclaire en vert : c'est une lampe que le joueur a allumée,
      // elle doit se distinguer d'un simple relais de passage
      gp.addColorStop(0, rgba(p.calme ? '#a8f0c8' : COULEURS[p.emotion], p.calme ? 0.2 : 0.16));
      gp.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gp;
      ctx.beginPath();
      ctx.moveTo(p.x - cam.x, p.y - cam.y);
      ctx.arc(p.x - cam.x, p.y - cam.y, pp, p.regard - D.cone, p.regard + D.cone);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // on se fait fixer : le bord de l'écran rougit
    const alerte = joueur.vu * (1 - joueur.souffle * 0.55);
    if (alerte > 0.02) {
      // concentré sur le bord : au centre on doit continuer à voir le jeu
      const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.62);
      v.addColorStop(0, 'rgba(255,60,50,0)');
      v.addColorStop(1, `rgba(255,60,50,${clamp(alerte * 0.3, 0, 0.3)})`);
      ctx.fillStyle = v;
      ctx.fillRect(0, 0, W, H);
    }

    dessinerManche();
  }

  function flecheVers(wx, wy, couleur, temps) {
    const x = wx - cam.x, y = wy - cam.y;
    if (x > 30 && x < W - 30 && y > 80 && y < H - 30) return;   // déjà à l'écran
    const a = Math.atan2(y - H / 2, x - W / 2);
    const rx = Math.min(W, H) * 0.38;
    const px = W / 2 + Math.cos(a) * rx, py = H / 2 + Math.sin(a) * rx;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(a);
    ctx.fillStyle = rgba(couleur, 0.5 + Math.sin(temps * 4) * 0.2);
    ctx.beginPath();
    ctx.moveTo(12, 0); ctx.lineTo(-8, 7); ctx.lineTo(-8, -7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* ==================================================== interface ======== */

  let toastT = 0;
  function montrerToast(texte, couleur) {
    elToast.textContent = texte;
    elToast.style.color = couleur || '#ffb4a8';
    elToast.style.borderColor = couleur ? rgba(couleur, 0.45) : 'rgba(255,122,107,0.4)';
    elToast.style.background = couleur ? rgba(couleur, 0.14) : 'rgba(255,122,107,0.16)';
    elToast.classList.add('on');
    toastT = 2.8;
  }

  let flashEnCours = false;
  function montrerFlash(titre, texte, couleur, surtitre) {
    el('flash-sur').textContent = surtitre || '';
    el('flash-titre').textContent = titre;
    el('flash-titre').style.color = couleur;
    el('flash-texte').textContent = texte;
    elFlash.classList.add('on');
    flashEnCours = true;
    manche.actif = false;
    manche.force = 0;
  }
  el('flash-ok').addEventListener('click', () => {
    elFlash.classList.remove('on');
    flashEnCours = false;
  });

  function majInterface() {
    const f = forme();
    const suivant = FORMES[joueur.niveau + 1];
    const bas = f.seuil;
    const haut = suivant ? suivant.seuil : f.seuil + 60;
    elForme.textContent = f.nom;
    elForme.style.color = f.couleur;
    elBarre.style.width = `${clamp((joueur.eclat - bas) / (haut - bas), 0, 1) * 100}%`;
    elBarre.style.background = f.couleur;
    elZone.textContent = `ZONE ${zone.numero} · ${priseCount}/${zone.requis}`;

    if (joueur.bonus && joueur.bonusT > 0) {
      const b = BONUS[joueur.bonus];
      elBonus.classList.add('on');
      elBonus.style.color = b.couleur;
      elBonusNom.textContent = b.nom;
      elBonusJauge.style.width = `${clamp(joueur.bonusT / b.duree, 0, 1) * 46}px`;
    } else {
      elBonus.classList.remove('on');
    }
  }

  /* ==================================================== zones ============ */

  function chargerZone(numero) {
    const z = genererZone(grain, numero, joueur.niveau);
    if (!z) return;
    zone = z;
    numeroZone = numero;
    priseCount = 0;
    particules = [];
    ondes = [];
    fil = [];
    joueur.x = zone.depart.x;
    joueur.y = zone.depart.y;
    joueur.vx = joueur.vy = 0;
    filDernier = { x: joueur.x, y: joueur.y };
    cadrer(true);
    majBoutons();
    majInterface();
  }

  function zoneSuivante() {
    const n = numeroZone + 1;
    chargerZone(n);
    montrerFlash(`Zone ${n}`, 'Plus grand, plus peuplé. Ta forme, ton éclat et tes braises te suivent.', '#ffe9a8', 'Nouveau territoire');
  }

  function cadrer(immediat) {
    const cx = clamp(joueur.x - W / 2, 0, Math.max(0, zone.largeur - W));
    const cy = clamp(joueur.y - H / 2, 0, Math.max(0, zone.hauteur - H));
    if (immediat) { cam.x = cx; cam.y = cy; return; }
    cam.x += (cx - cam.x) * 0.14;
    cam.y += (cy - cam.y) * 0.14;
  }

  /* ==================================================== boucle =========== */

  function surveillerCadence(dt) {
    if (palier >= PALIERS.length - 1) return;
    fenetre.push(dt);
    if (fenetre.length < 90) return;
    const median = [...fenetre].sort((a, b) => a - b)[45];
    fenetre = [];
    if (median > 0.022) { palier++; redimensionner(); }
  }

  function redimensionner() {
    DPR = Math.min(window.devicePixelRatio || 1, PALIERS[palier]);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    lum.width = Math.ceil(canvas.width * QLUM);
    lum.height = Math.ceil(canvas.height * QLUM);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    D = dims();
  }

  let dernier = performance.now();

  function boucle(maintenant) {
    requestAnimationFrame(boucle);
    const dt = Math.min((maintenant - dernier) / 1000, 1 / 30);
    dernier = maintenant;
    const temps = maintenant / 1000;
    if (!zone) return;

    if (manche.actif) surveillerCadence(dt);
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) elToast.classList.remove('on'); }

    if (!flashEnCours) {
      majJoueur(dt);
      const eclaires = propager();
      majPersos(dt, temps, eclaires);
      majRegles(dt);
      majParticules(dt);
      cadrer(false);
      majInterface();
      dessiner(temps, eclaires);
    } else {
      dessiner(temps, new Set());
    }
  }

  /* ==================================================== entrées ========== */

  // Joystick flottant : il naît exactement sous le doigt, où qu'on le pose.
  function pointCanvas(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function majManche(p) {
    const dx = p.x - manche.ox, dy = p.y - manche.oy;
    const d = Math.hypot(dx, dy);
    manche.force = clamp(d / RAYON_MANCHE, 0, 1);
    if (d > 0.01) { manche.dx = dx / d; manche.dy = dy / d; }
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (manche.id !== null) return;
    canvas.setPointerCapture(e.pointerId);
    const p = pointCanvas(e);
    manche.id = e.pointerId;
    manche.actif = true;
    manche.ox = p.x; manche.oy = p.y;
    manche.dx = 0; manche.dy = 0; manche.force = 0;
    elHint.style.opacity = '0';
  });

  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerId !== manche.id) return;
    majManche(pointCanvas(e));
  });

  ['pointerup', 'pointercancel'].forEach((t) =>
    canvas.addEventListener(t, (e) => {
      if (e.pointerId !== manche.id) return;
      manche.actif = false;
      manche.force = 0;
      manche.id = null;
    }));

  // pointerdown, pas click : mesuré, un `click` n'agissait qu'au RELÂCHEMENT du
  // doigt, alors qu'on appuie sur ces boutons dans l'urgence. L'action part
  // maintenant à l'instant où on touche.
  const bouton = (element, action) => {
    element.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!element.disabled) action();
    });
    element.addEventListener('click', (e) => e.preventDefault());
  };
  bouton(elBraise, poserBraise);
  bouton(elCharge, decharger);
  bouton(elEclair, lancerEclat);

  window.addEventListener('resize', () => {
    redimensionner();
    if (zone) cadrer(true);
  });

  redimensionner();
  chargerZone(1);
  requestAnimationFrame(boucle);

  // Exposé pour les mesures automatisées. L'accessibilité du plan se vérifie
  // exactement — parcours en largeur sur la grille — et c'est précisément ce
  // que le solveur de lumière du mode puzzle ne savait qu'approximer.
  window.__lux = {
    info: () => zone && {
      zone: zone.numero, grain: zone.grain,
      cols: zone.cols, lignes: zone.lignes, salles: zone.salles.length,
      lueurs: zone.lueurs.length, requis: zone.requis,
      speciales: zone.lueurs.filter((l) => l.type !== 'eclat').length,
      persos: zone.persos.length, longueur: zone.longueur,
      niveau: joueur.niveau, eclat: Math.round(joueur.eclat), prises: priseCount,
      braises: joueur.braises, posees: zone.braises.length,
      souffle: +joueur.souffle.toFixed(2),
    },
    accessible: () => {
      const d = distances(zone, { cx: Math.floor(zone.depart.x / CASE), cy: Math.floor(zone.depart.y / CASE) });
      const ok = (p) => {
        const cx = Math.floor(p.x / CASE), cy = Math.floor(p.y / CASE);
        return d[cy] && d[cy][cx] >= 0;
      };
      return { sortie: ok(zone.sortie), lueurs: zone.lueurs.every(ok), persos: zone.persos.every(ok) };
    },
    charger: chargerZone,
    graine: (g) => { grain = g; chargerZone(1); },
    joueur: () => ({ ...joueur }),
    toast: () => elToast.classList.contains('on'),
    // pousse le joystick vers un point du monde, comme un doigt le ferait
    viser: (wx, wy) => {
      const dx = wx - joueur.x, dy = wy - joueur.y;
      const d = Math.hypot(dx, dy) || 1;
      manche.actif = true; manche.id = -1;
      manche.ox = W / 2; manche.oy = H / 2;
      manche.dx = dx / d; manche.dy = dy / d;
      manche.force = 1;
    },
    lacher: () => { manche.actif = false; manche.force = 0; manche.id = null; },
    manche: () => ({ ...manche }),
    monter: (n) => {
      joueur.sommet = joueur.eclat = n;
      joueur.niveau = 0;
      for (let i = 0; i < FORMES.length; i++) evoluer();
      elFlash.classList.remove('on'); flashEnCours = false;
      majBoutons();
    },
    poserBraise, decharger, lancerEclat,
    fil: () => fil,
    estEclaire,
    // pour chaque PNJ à portée d'écran : ses yeux sont-ils dessinés, et sinon pourquoi
    diagYeux: () => zone.persos.map((p) => {
      const dj = Math.hypot(p.x - joueur.x, p.y - joueur.y);
      const cache = !vueLibre(p.x, p.y, joueur.x, joueur.y);
      const portee = cache ? CASE * 5 : CASE * 9;
      return {
        emotion: p.emotion, cases: +(dj / CASE).toFixed(1), cache,
        horsPortee: dj > portee,
        dejaEclaire: p.eclaire || estEclaire(p.x, p.y),
        cligne: p.cligne > 0, aveugle: p.aveugle > 0,
        aEcran: Math.abs(p.x - joueur.x) < W / 2 + 40 && Math.abs(p.y - joueur.y) < H / 2 + 40,
      };
    }),
    soigner: () => { joueur.souffle = 1; joueur.repit = 0; },
    poser: (x, y) => { joueur.x = x; joueur.y = y; joueur.vx = joueur.vy = 0; cadrer(true); },
    // ce que la boucle de drain calcule réellement, pour un perso donné
    sonde: (q) => ({
      emotion: q.emotion, aveugle: +q.aveugle.toFixed(1), alerte: +q.alerte.toFixed(2),
      regard: +q.regard.toFixed(3),
      angleVersJoueur: +Math.atan2(joueur.y - q.y, joueur.x - q.x).toFixed(3),
      ecart: +Math.abs(ecartAngle(q.regard, Math.atan2(joueur.y - q.y, joueur.x - q.x))).toFixed(3),
      dist: Math.round(Math.hypot(joueur.x - q.x, joueur.y - q.y)),
      dansCone: dansLeCone(q.x, q.y, q.regard, joueur.x, joueur.y, CASE * 4.6, 0.42),
      vueLibre: vueLibre(q.x, q.y, joueur.x, joueur.y),
      abri: prochedUneBraise(joueur.x, joueur.y, 1),
    }),
    tuer: () => eteindre(),
    chemin: (wx, wy) => {
      const dep = { cx: Math.floor(joueur.x / CASE), cy: Math.floor(joueur.y / CASE) };
      const d = distances(zone, dep);
      let cx = Math.floor(wx / CASE), cy = Math.floor(wy / CASE);
      if (!d[cy] || d[cy][cx] < 0) return null;
      const route = [];
      while (d[cy][cx] > 0) {
        route.push([(cx + 0.5) * CASE, (cy + 0.5) * CASE]);
        const n = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]
          .filter(([x, y]) => d[y] !== undefined && d[y][x] >= 0);
        const suivant = n.reduce((a, [x, y]) => (d[y][x] < d[a[1]][a[0]] ? [x, y] : a), n[0]);
        cx = suivant[0]; cy = suivant[1];
      }
      return route.reverse();
    },
    etat: () => zone,
  };
})();
</script>
